<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Olasz leckék Assimil-módszerrel – magyar anyanyelvűeknek">
<meta name="theme-color" content="#f6f5f0">
<title>Olaszóra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=swap">
<script>try{var t=JSON.parse(localStorage.getItem('olaszora:theme')||'""');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* Olaszóra — webalkalmazás: oldalsáv (asztali) / alsó sáv (mobil), útvonalak: #ma #leckek #lecke-N #kartyak #szotar */
:root{
  --bg:#f6f5f0; --paper:#fffefa; --sunk:#eeece5; --ink:#19202e; --muted:#5b6372; --line:#e4e1d8; --line-2:#cfcbbf;
  --grid:rgba(76,128,205,.16); --margin:#e0525c; --pen:#1f4fa3; --pen-soft:#e7eefb;
  --basil:#227a4c; --basil-soft:#e2f2e8; --tomato:#c8202f; --tomato-soft:#fbe6e8;
  --primary:#19202e; --on-primary:#fffefa;
  --display:"Bodoni Moda", Didot, Georgia, serif; --body:"Atkinson Hyperlegible", system-ui, sans-serif; --hand:"Kalam", "Comic Sans MS", cursive;
  --r:8px; --R:14px; --side:248px; --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141517; --paper:#1c1d20; --sunk:#25262a; --ink:#ecebe6; --muted:#a4a39c; --line:#2c2d31; --line-2:#3d3e43;
  --grid:rgba(140,170,230,.08); --margin:#e86a72; --pen:#97b6ff; --pen-soft:#212a3a;
  --basil:#7dd3a2; --basil-soft:#18291f; --tomato:#ff858d; --tomato-soft:#381b1e;
  --primary:#ecebe6; --on-primary:#141517; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141517; --paper:#1c1d20; --sunk:#25262a; --ink:#ecebe6; --muted:#a4a39c; --line:#2c2d31; --line-2:#3d3e43;
  --grid:rgba(140,170,230,.08); --margin:#e86a72; --pen:#97b6ff; --pen-soft:#212a3a;
  --basil:#7dd3a2; --basil-soft:#18291f; --tomato:#ff858d; --tomato-soft:#381b1e;
  --primary:#ecebe6; --on-primary:#141517; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
::selection{background:var(--pen-soft);color:var(--ink)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--pen);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
svg.i{width:18px;height:18px;flex:none}

/* Váz */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px;padding:26px 14px 20px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px;font-family:var(--display);font-style:italic;font-weight:500;font-size:1.85rem;line-height:1;letter-spacing:-.015em;text-decoration:none;font-variation-settings:"opsz" 72}
.flag{display:inline-flex;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.flag i{display:block;width:6px;height:17px}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;height:42px;padding:0 12px;border-radius:var(--r);color:var(--muted);text-decoration:none;font-size:.97rem;transition:background-color .15s,color .15s}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--sunk);color:var(--ink);font-weight:700}
.nav a[aria-current="page"] svg{color:var(--tomato)}
.count{margin-left:auto;min-width:24px;text-align:center;font-size:.76rem;font-weight:700;font-variant-numeric:tabular-nums;background:var(--pen-soft);color:var(--pen);border-radius:999px;padding:1px 8px}
.side-foot{margin-top:auto;display:grid;gap:16px;padding:0 12px}
.side-prog{display:grid;gap:8px;font-size:.86rem;color:var(--muted)}
.side-prog div{display:flex;justify-content:space-between}
.side-prog b{color:var(--ink);font-variant-numeric:tabular-nums}
.meter{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--pen);border-radius:inherit;transition:width .4s var(--ease)}
.theme-btn{display:flex;align-items:center;gap:10px;background:none;border:0;padding:8px 0;color:var(--muted);cursor:pointer;font-size:.9rem}
.theme-btn:hover{color:var(--ink)}
.topbar,.tabbar{display:none}
main{width:100%;max-width:1200px;padding:40px clamp(24px,4vw,56px) 96px;outline:none}

/* Oldalfej */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted);margin:0 0 18px}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin:0 0 28px}
.ph h1{font-family:var(--display);font-weight:600;font-size:clamp(2rem,4.2vw,2.7rem);line-height:1.05;letter-spacing:-.018em;margin:0;text-wrap:balance;font-variation-settings:"opsz" 72}
.lead{margin:8px 0 0;color:var(--muted);font-size:1.02rem}
.kicker{font-family:var(--hand);font-weight:700;color:var(--tomato);font-size:1.15rem;line-height:1.2;margin:0 0 6px}
.ptitle{font-size:1rem;font-weight:700;margin:0}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 18px}
.phead span{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}

/* Elemek */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--paper);color:var(--ink);font-size:.94rem;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap;transition:border-color .15s,background-color .15s,opacity .15s,transform .1s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{opacity:.88}
.btn.done{background:var(--basil-soft);border-color:transparent;color:var(--basil)}
.btn.sm{height:32px;padding:0 12px;font-size:.84rem}
.btn svg{width:16px;height:16px}
kbd{font:inherit;font-size:.75rem;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 5px;opacity:.6}
@media (hover:none){kbd{display:none}}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:none;color:var(--muted);font-size:.88rem;font-weight:700;padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:background-color .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin:0 0 20px}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.tag svg{width:13px;height:13px}
.tag.ok{background:var(--basil-soft);color:var(--basil)}
.tag.cur{background:var(--pen-soft);color:var(--pen)}
.tag.rip{background:var(--tomato-soft);color:var(--tomato)}
.tag.new{background:var(--sunk);color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--R);padding:24px}
.panel.flush{padding:0;overflow:hidden}
.grid{display:grid;gap:20px;margin-bottom:20px}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:1060px){.two{grid-template-columns:minmax(0,1fr)}}
.sheet{position:relative;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:5mm 5mm;background-position:-1px -1px;border:1px solid var(--line);border-radius:var(--R);overflow:hidden}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:52px;width:2px;background:var(--margin);opacity:.7}

/* Ma */
.cont{padding:26px 28px 28px 80px;display:flex;flex-direction:column}
.cont .ptitle{margin-bottom:18px}
.cont .big{font-family:var(--display);font-weight:600;font-size:clamp(1.8rem,3.4vw,2.4rem);line-height:1.08;letter-spacing:-.015em;margin:0;font-variation-settings:"opsz" 72}
.cont .hut{margin:6px 0 18px;color:var(--muted)}
.preview{margin:0 0 18px;font-family:var(--display);font-style:italic;font-size:1.12rem;line-height:1.6}
.preview p{margin:0}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 20px;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto}
.review{display:flex;flex-direction:column}
.figure{font-family:var(--display);font-weight:600;font-size:3.2rem;line-height:1;margin:18px 0 6px;font-variant-numeric:lining-nums;font-variation-settings:"opsz" 96}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk);margin:20px 0 12px;gap:2px}
.stack i{display:block;height:100%}
.legend{list-style:none;margin:0 0 22px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:.88rem;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:8px}
.legend li b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums}
.legend i,.dotk{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.l0{background:var(--line-2)} .l1{background:color-mix(in srgb,var(--pen) 35%,var(--paper))} .l2{background:color-mix(in srgb,var(--pen) 65%,var(--paper))} .l3{background:var(--pen)}
.review .btn{margin-top:auto;align-self:flex-start}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0}
.kpis>div{padding:20px 24px;border-left:1px solid var(--line)}
.kpis>div:first-child{border-left:0}
.kpis dt{font-size:.86rem;color:var(--muted)}
.kpis dd{margin:6px 0 0;font-size:1.65rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpis dd small{font-size:.95rem;font-weight:400;color:var(--muted)}
.wk+.wk{margin-top:18px}
.wk-l{display:flex;justify-content:space-between;font-size:.86rem;color:var(--muted);margin-bottom:8px}
.cells{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cell{position:relative;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:1/.92;padding:8px 9px;border-radius:10px;background:var(--sunk);text-decoration:none;color:var(--muted);transition:transform .15s var(--ease),background-color .15s}
.cell:hover{transform:translateY(-2px);color:var(--ink)}
.cell b{font-family:var(--display);font-size:1.45rem;font-weight:600;line-height:1;color:var(--ink)}
.cell small{font-size:.72rem;line-height:1.1}
.cell.ok{background:var(--basil-soft);color:var(--basil)}
.cell.ok b{color:var(--basil)}
.cell.cur{box-shadow:inset 0 0 0 2px var(--pen);background:var(--paper)}
.cell.rip small{color:var(--tomato)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal span{font-size:.74rem;color:var(--muted);text-align:center}
.cal i{display:block;aspect-ratio:1;border-radius:5px;background:var(--sunk)}
.cal i.on{background:var(--pen)}
.cal i.today{box-shadow:inset 0 0 0 2px var(--tomato)}
.cal i.fut{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.cal-note{margin:16px 0 0;font-size:.9rem;color:var(--muted)}
.cal-note b{color:var(--ink)}
/* Számok a Bodoni-ban (az Atkinson áthúzott nullája helyett) */
.kpis dd,.legend b,.rows dd,.cal-note b,.side-prog b,.phead span,.wk-l span:last-child,.week-h div span:first-child,.deckbar span,.count-line,.meta,.lrow .m .n{font-family:var(--display);font-variant-numeric:lining-nums tabular-nums}
.kpis dd{font-weight:600;font-size:1.85rem}

/* Leckék */
.week{margin:0 0 36px}
.week-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.week-h h2{font-family:var(--display);font-size:1.5rem;font-weight:600;margin:0;letter-spacing:-.01em}
.week-h div{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.week-h .meter{width:120px}
.list{background:var(--paper);border:1px solid var(--line);border-radius:var(--R);overflow:hidden}
.lrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto 18px;align-items:center;gap:18px;padding:16px 22px 16px 18px;border-top:1px solid var(--line);text-decoration:none;transition:background-color .15s}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--sunk)}
.lrow:hover .chev{transform:translateX(3px);color:var(--ink)}
.lrow .no{font-family:var(--display);font-size:1.8rem;font-weight:500;color:var(--tomato);text-align:center;line-height:1;font-variant-numeric:lining-nums}
.lrow .t{font-family:var(--display);font-size:1.2rem;font-weight:600;line-height:1.25;letter-spacing:-.005em}
.lrow .s{color:var(--muted);font-size:.92rem;margin-top:2px}
.lrow .m{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:.86rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{color:var(--muted);transition:transform .15s var(--ease)}

/* Lecke */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 24px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 14px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--muted);text-decoration:none;font-weight:700;white-space:nowrap;transition:color .15s}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--tomato)}
.tabs .c{font-weight:400;margin-left:6px;font-variant-numeric:tabular-nums}
.lesson-grid{display:grid;gap:24px;align-items:start}
@media (min-width:1200px){
  .lesson-grid.has-notes{grid-template-columns:minmax(0,1fr) 360px}
  .lesson-grid .notes{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto}
}
.dlg{list-style:none;margin:0;padding:14px 0}
.dlg li{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:30px;padding:11px 26px 11px 0}
.dlg .num{font-family:var(--hand);color:var(--tomato);font-size:1.05rem;text-align:right;line-height:1.75}
.dlg .it{margin:0;font-family:var(--display);font-weight:500;font-size:1.32rem;line-height:1.45;font-variation-settings:"opsz" 28}
.dlg .hu{grid-column:2;margin:3px 0 0;color:var(--muted);font-size:1rem}
.dlg .hu i{opacity:.85}
.dlg .hu.hidden{color:transparent;background:var(--pen-soft);border-radius:4px;cursor:pointer;user-select:none;transition:background-color .15s}
.dlg .hu.hidden:hover{background:color-mix(in srgb,var(--pen) 22%,var(--paper))}
.ref{font-family:var(--hand);font-weight:700;font-size:.6em;color:var(--tomato);background:none;border:0;padding:0 2px 0 1px;margin:0;cursor:pointer;vertical-align:super;line-height:0;border-radius:3px}
.ref:hover{background:var(--tomato-soft)}
.notes{background:var(--paper);border:1px solid var(--line);border-radius:var(--R);padding:22px 22px 22px 24px;border-left:3px solid var(--tomato)}
.notes h2{font-family:var(--hand);color:var(--tomato);font-size:1.4rem;font-weight:700;margin:0 0 12px}
.notes ol{margin:0;padding-left:1.4rem;display:grid;gap:10px}
.notes li{padding:4px 8px;margin-left:-8px;border-radius:6px;transition:background-color .4s}
.notes li.hl{background:var(--tomato-soft)}
.notes li::marker{color:var(--tomato);font-family:var(--hand);font-weight:700}
.notes b{color:var(--tomato)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:40px}
.pager a{display:block;padding:16px 20px;border:1px solid var(--line);border-radius:var(--R);background:var(--paper);text-decoration:none;transition:border-color .15s}
.pager a:hover{border-color:var(--ink)}
.pager small{display:block;color:var(--muted);font-size:.84rem;margin-bottom:2px}
.pager b{font-family:var(--display);font-size:1.1rem;font-weight:600}
.pager .next{grid-column:2;text-align:right}
.ex h2,.rip h2{font-family:var(--hand);color:var(--tomato);font-size:1.35rem;font-weight:700;margin:0 0 14px}
.ex+.ex{margin-top:20px}
.ex1 ol{margin:0;padding-left:1.5rem;display:grid;gap:12px}
.ex1 li::marker{color:var(--tomato);font-family:var(--hand);font-weight:700}
.ex1 .q1{font-family:var(--display);font-size:1.15rem;font-weight:500;margin-right:8px}
.ex1 .ans{display:block;color:var(--basil);font-weight:700;margin-top:2px}
.ex2 .row{padding:14px 0;border-top:1px solid var(--line)}
.ex2 .row:first-of-type{border-top:0}
.ex2 .q{font-weight:700;margin-bottom:4px}
.ex2 .line{line-height:2.5;font-family:var(--display);font-size:1.15rem}
.ex2 input{font:inherit;font-family:var(--hand);font-size:1.05rem;font-weight:700;border:0;border-bottom:2px dotted var(--pen);background:transparent;color:var(--pen);padding:0 6px;border-radius:0;width:auto}
.ex2 input:focus{background:var(--pen-soft);outline:none}
.ex2 input.ok{border-bottom:2px solid var(--basil);color:var(--basil);background:var(--basil-soft)}
.ex2 input.no{border-bottom:2px solid var(--tomato);color:var(--tomato);background:var(--tomato-soft)}
.fb{font-family:var(--hand);font-size:.95rem;color:var(--tomato);margin-left:6px}
.ex2 .actions{margin-top:18px}
.rip h2{margin-top:26px}
.rip h2:first-child{margin-top:0}
.rip p{margin:0 0 10px}
.tablewrap{overflow-x:auto;margin:4px 0 6px}
table.conj{border-collapse:collapse;font-size:.94rem;min-width:440px}
table.conj td,table.conj th{border:1px solid var(--line);padding:6px 12px;text-align:left}
table.conj th{color:var(--pen);background:var(--pen-soft)}

/* Táblázatok: szavak, szótár */
table.words{width:100%;border-collapse:collapse}
.words th{font-size:.84rem;font-weight:400;color:var(--muted);text-align:left;padding:12px 22px;border-bottom:1px solid var(--line)}
.words td{padding:12px 22px;border-bottom:1px solid var(--line);vertical-align:middle}
.words tr:last-child td{border-bottom:0}
.words td.it{font-family:var(--display);font-size:1.12rem;font-weight:600}
.words td.ln a{text-decoration:none;color:var(--muted);font-variant-numeric:tabular-nums}
.words td.ln a:hover{color:var(--ink);text-decoration:underline}
.words th.r,.words td.lv,.words td.ln{text-align:right;white-space:nowrap}
.words .empty{text-align:center;color:var(--muted);padding:40px 20px}
.filters{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 14px}
.search{position:relative;flex:1 1 320px}
.search svg{position:absolute;left:14px;top:13px;color:var(--muted)}
.search input,.select select{width:100%;height:46px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper);color:var(--ink);font:inherit}
.search input{padding:0 14px 0 42px}
.select{flex:0 1 280px}
.select select{padding:0 12px;cursor:pointer}
.search input:focus,.select select:focus{outline:2.5px solid var(--pen);outline-offset:0;border-color:transparent}
.count-line{margin:0 0 12px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Szókártyák */
.cards-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.stage{display:grid;gap:18px;justify-items:center}
.deckbar{width:100%;max-width:580px;display:flex;align-items:center;gap:14px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.deckbar .meter{flex:1}
.fcard{width:100%;max-width:580px;min-height:320px;background-color:var(--paper);background-image:linear-gradient(var(--margin),var(--margin)),repeating-linear-gradient(transparent 0 31px,var(--grid) 31px 32px);background-size:100% 2px,100% 100%;background-position:0 52px,0 20px;background-repeat:no-repeat,repeat;border:1px solid var(--line);border-radius:var(--R);display:grid;place-items:center;text-align:center;padding:68px 28px 36px;cursor:pointer;position:relative;transition:transform .2s var(--ease),border-color .15s}
.fcard:hover{border-color:var(--line-2)}
.fcard .w{font-family:var(--display);font-weight:500;font-size:clamp(2rem,5vw,2.7rem);line-height:1.12;font-variation-settings:"opsz" 72}
.fcard .a{margin-top:14px;font-family:var(--hand);font-size:1.55rem;color:var(--tomato);font-weight:700}
.fcard .hintf{margin-top:14px;font-size:.9rem}
.fcard .lab{position:absolute;top:16px;left:20px;font-family:var(--hand);font-size:1rem;color:var(--muted)}
.fcard .lvl{position:absolute;top:16px;right:18px}
.fbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.fbtns .btn{min-width:160px;height:48px}
.rows{margin:14px 0 0}
.rows div{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.94rem}
.rows div:first-child{border-top:0}
.rows dt{display:flex;align-items:center;gap:9px;color:var(--muted)}
.rows dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.sum .muted{font-size:.88rem;margin:16px 0 0}

/* Belépő mozgás (csak oldalváltáskor) */
@media (prefers-reduced-motion:no-preference){
  main.enter>*{animation:rise .45s var(--ease) both}
  main.enter>*:nth-child(2){animation-delay:.05s} main.enter>*:nth-child(3){animation-delay:.1s} main.enter>*:nth-child(4){animation-delay:.15s} main.enter>*:nth-child(n+5){animation-delay:.2s}
  @keyframes rise{from{transform:translateY(12px)}to{transform:none}}
  .fcard:active{transform:scale(.985)}
  .fcard.flip{animation:flip .28s var(--ease)}
  @keyframes flip{from{transform:rotateX(14deg) scale(.98)}to{transform:none}}
}

/* Tablet és mobil */
@media (max-width:1060px){ .cards-layout{grid-template-columns:minmax(0,1fr)} .sum{max-width:580px;width:100%;justify-self:center} }
@media (max-width:860px){
  .app{display:block}
  .side{display:none}
  .topbar{display:flex;position:sticky;top:0;z-index:5;height:56px;align-items:center;justify-content:space-between;padding:0 8px 0 16px;background:var(--bg);border-bottom:1px solid var(--line)}
  .topbar .brand{font-size:1.55rem;padding:0}
  .topbar .theme-btn{width:44px;height:44px;justify-content:center;padding:0}
  .topbar .theme-btn span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;font-size:.74rem;color:var(--muted);text-decoration:none}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--ink);font-weight:700}
  .tabbar a[aria-current="page"] svg{color:var(--tomato)}
  .tabbar .count{position:absolute;top:5px;left:calc(50% + 6px);margin:0;min-width:0;padding:0 6px;font-size:.68rem}
  main{padding:22px 16px calc(100px + env(safe-area-inset-bottom))}
  .ph{margin-bottom:22px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis>div:nth-child(3){border-left:0}
  .kpis>div:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:640px){
  body{font-size:16px}
  .panel{padding:20px 18px}
  .cont{padding:22px 18px 22px 64px}
  .sheet::before{left:42px}
  .dlg li{grid-template-columns:28px minmax(0,1fr);column-gap:24px;padding-right:16px}
  .dlg .it{font-size:1.18rem}
  .lrow{grid-template-columns:38px minmax(0,1fr) 16px;gap:12px;padding:14px 14px 14px 10px}
  .lrow .no{font-size:1.5rem}
  .lrow .m{grid-column:2;grid-row:2;margin-top:-4px}
  .lrow .m .n{display:none}
  .lrow .chev{grid-column:3;grid-row:1/3}
  .week-h .meter{width:64px}
  .kpis>div{padding:16px 18px}
  .kpis dd{font-size:1.4rem}
  .cells{gap:6px}
  .cell{padding:6px;border-radius:8px}
  .cell b{font-size:1.15rem}
  .cell small{display:none}
  .pager{grid-template-columns:1fr}
  .pager .next{grid-column:1}
  .words thead{display:none}
  .words tr{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .words tr:last-child{border-bottom:0}
  .words td{padding:0;border:0}
  .words td.it{grid-column:1;grid-row:1}
  .words td.hu{grid-column:1;grid-row:2;color:var(--muted)}
  .words td.lv{grid-column:2;grid-row:1/3;align-self:center}
  .words td.ln{grid-column:2;grid-row:2;font-size:.85rem}
  .words td.ln+td.lv{grid-row:1}
  .words .empty{grid-column:1/-1}
  .fbtns .btn{min-width:0;flex:1}
  .fcard{min-height:280px}
}
</style>
