<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Olasz leckék Assimil-módszerrel – magyar anyanyelvűeknek">
<title>Olaszóra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:ital@0;1&display=swap">
<style>
/* Layout: egy oszlopos "füzet" — fejléc haladással, fülek (Leckék / Gyakorlás / Szókártyák), lecke-chipek, párbeszéd sorokban */
:root{
  --bg:#f3f5f1; --paper:#ffffff; --ink:#1d2731; --muted:#5d6a73; --line:#dde3dc;
  --basil:#2c7a57; --basil-soft:#e2f0e8; --tomato:#c2274a; --tomato-soft:#f7e3e8; --gold:#9a6a00;
  --display:"Young Serif", Georgia, serif; --body:"Figtree", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141a1f; --paper:#1c242b; --ink:#e7ece8; --muted:#9aa7ae; --line:#2e3942;
  --basil:#6cc79c; --basil-soft:#1f3a2e; --tomato:#f07a93; --tomato-soft:#3a1f27; --gold:#e0b453; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#141a1f; --paper:#1c242b; --ink:#e7ece8; --muted:#9aa7ae; --line:#2e3942;
  --basil:#6cc79c; --basil-soft:#1f3a2e; --tomato:#f07a93; --tomato-soft:#3a1f27; --gold:#e0b453; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,6vw,2.8rem);margin:0;line-height:1}
h1 .flag{display:inline-flex;gap:3px;margin-left:10px;vertical-align:middle}
h1 .flag i{display:block;width:8px;height:22px;border-radius:2px;border:1px solid var(--line)}
.sub{color:var(--muted);margin:6px 0 0;font-size:.95rem}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{color:var(--basil)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tomato)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--basil);box-shadow:inset 0 0 0 1px var(--basil)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.chip.done .dot{background:var(--basil)}
button:focus-visible,input:focus-visible{outline:2px solid var(--tomato);outline-offset:2px}
.lesson-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;margin-bottom:6px}
.lesson-head h2{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0;text-wrap:balance}
.kicker{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tomato);font-weight:700}
.hu-title{color:var(--muted);margin:0 0 14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.btn{font:inherit;font-size:.9rem;font-weight:600;border-radius:10px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.btn.primary{background:var(--basil);border-color:var(--basil);color:var(--paper)}
.btn.ghost{background:none}
.dlg{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:14px}
.dlg li{display:grid;grid-template-columns:2.2rem 1fr auto;gap:4px 10px;padding:12px 14px;border-top:1px solid var(--line)}
.dlg li:first-child{border-top:0}
.dlg .num{font-family:var(--mono);color:var(--muted);font-size:.85rem;padding-top:2px;font-variant-numeric:tabular-nums}
.dlg .it{font-weight:600;min-width:0}
.dlg .it sup{color:var(--tomato);font-size:.65em;margin-left:1px}
.dlg .hu{grid-column:2/3;color:var(--muted);font-size:.95rem;min-width:0}
.dlg .hu i{opacity:.75}
.dlg .hu.hidden{color:transparent;background:var(--line);border-radius:6px;cursor:pointer;user-select:none}
.dlg .hu.hidden i{color:transparent}
.say{grid-row:1/3;grid-column:3;align-self:start;border:0;background:none;color:var(--basil);cursor:pointer;font-size:1.1rem;padding:2px 6px;border-radius:8px}
.notes{margin:18px 0 0;padding:14px 16px 14px 18px;border-left:3px dotted var(--tomato);background:var(--paper);border-radius:0 12px 12px 0}
.notes h3,.card h3{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tomato);margin:0 0 8px}
.notes ol{margin:0;padding-left:1.3rem;display:grid;gap:8px;font-size:.95rem}
.notes li::marker{color:var(--tomato);font-weight:700;font-size:.85em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.ex1 li{margin-bottom:10px}
.ex1 .ans{display:block;color:var(--basil);font-weight:600}
.ex2 .row{padding:10px 0;border-top:1px solid var(--line)}
.ex2 .row:first-of-type{border-top:0}
.ex2 .q{font-weight:600;margin-bottom:6px}
.ex2 .line{line-height:2.4}
.ex2 input{font:inherit;font-family:var(--mono);font-size:.95rem;border:0;border-bottom:2px solid var(--line);background:var(--bg);color:var(--ink);padding:2px 6px;border-radius:6px 6px 0 0;width:auto}
.ex2 input.ok{border-bottom-color:var(--basil);background:var(--basil-soft)}
.ex2 input.no{border-bottom-color:var(--tomato);background:var(--tomato-soft)}
.fb{font-size:.85rem;color:var(--muted);margin-left:6px}
.flash{display:grid;gap:14px;justify-items:center}
.fcard{width:min(100%,460px);min-height:210px;background:var(--paper);border:1px solid var(--line);border-radius:18px;display:grid;place-items:center;text-align:center;padding:24px;cursor:pointer;position:relative}
.fcard .w{font-family:var(--display);font-size:1.9rem;line-height:1.2}
.fcard .a{margin-top:10px;font-size:1.2rem;color:var(--basil);font-weight:600}
.fcard .tag{position:absolute;top:10px;left:14px;font-size:.75rem;color:var(--muted);font-family:var(--mono)}
.fbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.boxes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.boxes span{border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-variant-numeric:tabular-nums}
.rip h4{margin:14px 0 6px;font-size:1rem;color:var(--tomato)}
.rip p{margin:0 0 8px;font-size:.95rem}
.tablewrap{overflow-x:auto}
table.conj{border-collapse:collapse;font-size:.9rem;min-width:420px}
table.conj td,table.conj th{border:1px solid var(--line);padding:4px 8px;text-align:left}
table.conj th{color:var(--basil)}
.muted{color:var(--muted);font-size:.9rem}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:.9rem}
@media (max-width:520px){ .dlg li{grid-template-columns:1.8rem 1fr auto} }
@media (prefers-reduced-motion:no-preference){ .fcard{transition:transform .15s} .fcard:active{transform:scale(.98)} }
</style>

</head>

melléknév viszont a valódi nemhez igazodik: <b>Lei è straniero<\/b> (férfinak) / <b>straniera<\/b> (nőnek).", "<b>Studiare l'italiano<\/b>: tanulni egy nyelvet – névelővel; de beszélni egy nyelven névelő nélkül: <b>parlare italiano<\/b> (2. lecke). Az egyes szám 1. személy végződése mindig <b>-o<\/b>: <b>studio<\/b> (tanulok), <b>vivo<\/b> (élek), <b>vado<\/b> (megyek).", "<b>Non… ma…<\/b> = <i>nem… hanem…<\/i>. Választékosabban: <b>non… bensì…<\/b>.", "<b>Cittadina<\/b> = kisváros. Az <b>-ina / -ino<\/b> kicsinyítő képző: <b>città → cittadina<\/b>, vö. <b>Pietro → Pierino<\/b> (2. lecke).", "<b>Dove?<\/b> = <i>hol?<\/i> és <i>hová?<\/i> egyaránt. Az olasz nem választja szét a helyet és az irányt: <b>Dove vive?<\/b> (Hol él?), <b>Dove va?<\/b> (Hová megy?). Honnan? = <b>Da dove?<\/b>", "<b>In albergo<\/b> = a szállodában és a szállodába is: az <b>in<\/b> elöljárószó helyet és irányt is jelöl. Néhány gyakori helynél nincs névelő: <b>in albergo, in banca, in cucina, a casa<\/b>. <b>Vado<\/b> az <b>andare<\/b> (menni) rendhagyó alakja: <b>vado, vai, va<\/b>."], "ex1": [["La signora Rossi vive in una grande città.", "Rossiné egy nagyvárosban él."], ["Studia l'ungherese?", "Magyarul tanul?"], ["Dove va la moglie?", "Hova megy a feleség?"], ["Siete a Roma?", "Rómában vagytok?"], ["Adesso non vado in cucina.", "Most nem megyek a konyhába."], ["Noi studiamo a casa.", "Mi otthon tanulunk."]], "ex2": [{"hu": "Budapestre megyek.", "gap": "Vado a . . . . . . . . .", "ans": ["Budapest"]}, {"hu": "Van konyha a szállodában?", "gap": "C'è una . . . . . . in . . . . . . . ?", "ans": ["cucina", "albergo"]}, {"hu": "Viszontlátásra Olaszországban.", "gap": ". . . . . . . . . . . in Italia.", "ans": ["Arrivederci"]}, {"hu": "Hol él Rossiné?", "gap": ". . . . . vive la signora Rossi?", "ans": ["Dove"]}, {"hu": "Hova megy a külföldi?", "gap": "Dove . . lo . . . . . . . . . ?", "ans": ["va", "straniero"]}, {"hu": "A tanár is tanul.", "gap": ". . . . . il professore studia.", "ans": ["Anche"]}], "voc": [["straniero", "külföldi"], ["studiare", "tanulni"], ["difficile", "nehéz"], ["facile", "könnyű"], ["la lingua", "a nyelv"], ["dove?", "hol? hová?"], ["adesso", "most"], ["l'albergo", "a szálloda"], ["andare", "menni"], ["arrivederci", "viszontlátásra"], ["la cittadina", "a kisváros"]]}, {"n": 5, "it": "Quinta lezione", "hu": "Ötödik lecke", "title_it": "Al ristorante «Da Mario»", "title_hu": "A „Da Mario” étteremben (-nál étterem „Mariónál”)", "dlg": [["Cameriere! Il menù, per favore^1!", "Pincér! Az étlapot, legyen szíves (Az étlap, kérem)!"], ["Arrivo subito… Ecco a Lei^2.", "Azonnal jövök (Érkezem azonnal)… Tessék (Íme Önnek)."], ["Grazie.", "Köszönöm."], ["Cosa prendete^3 da bere?", "Mit kérnek inni (Mit vesztek -ból inni)?"], ["Un litro di^4 vino rosso.", "Egy liter vörösbort (Egy liter -ból bor vörös)."], ["Abbiamo^5 solo vino bianco.", "Csak fehérbor van (Van-nekünk csak bor fehér)."], ["Va bene. Ma vogliamo anche dell'acqua^6. Avete le lasagne?", "Jó (Megy jól). De vizet is kérünk (De akarunk is -ból-a víz). Van lasagne (Van-nektek a lasagne)?"], ["Sì, signore. Le abbiamo^7. E abbiamo anche il pollo arrosto.", "Igen, uram (úr). Van (Azokat van-nekünk). És sült csirke is van (És van-nekünk is a csirke sült)."], ["Prendiamo due lasagne e un pollo arrosto.", "Két lasagnét és egy sült csirkét kérünk (Veszünk két lasagne és egy csirke sült)."], ["Porto anche un'insalata.", "Hozok salátát is (Hozok is egy saláta)."], ["No, l'insalata non la vogliamo^7.", "Nem, salátát nem kérünk (Nem, a saláta nem azt akarjuk)."], ["Buon appetito!", "Jó étvágyat!"]], "notes": ["<b>Per favore<\/b> = <i>kérem, legyen szíves<\/i>. A <b>grazie<\/b>-re adott válasz: <b>prego<\/b> (<i>szívesen<\/i>).", "<b>Ecco<\/b> = <i>íme, tessék<\/i>, amikor átadunk vagy megmutatunk valamit: <b>Ecco il menù<\/b> = Itt az étlap. <b>Ecco a Lei<\/b> = Tessék (Önnek).", "<b>Prendere<\/b> = venni, fogni; étteremben „kérni, rendelni”. <b>Prendete<\/b> többes szám 2. személy: a pincér a társaságot <b>voi<\/b>-jal szólítja meg, ez étteremben is teljesen udvarias.", "Mennyiség után <b>di<\/b> áll: <b>un litro di vino<\/b>, <b>un chilo di pane<\/b>. Fontos: az olaszban <i>nincs tárgyrag<\/i> (-t)! A tárgy ugyanúgy néz ki, mint az alany; a szórend mutatja: <b>prendo il vino<\/b> (alany – ige – tárgy).", "<b>Avere<\/b> = birtokolni. Az olasznak – a magyarral ellentétben – van külön igéje a birtoklásra: <b>ho, hai, ha, abbiamo, avete, hanno<\/b>. „Van nekünk” = <b>abbiamo<\/b>; „Van gulyás?” étteremben = <b>Avete…?<\/b> (Önöknek van…?).", "<b>Dell'acqua, del vino<\/b>: részelő névelő (<b>di<\/b> + határozott névelő) = „egy kis, valamennyi”. A magyarban ilyenkor egyszerűen nincs névelő: <i>vizet kérünk<\/i>.", "<b>Le abbiamo / la vogliamo<\/b>: hangsúlytalan tárgyi névmások – <b>lo<\/b> (őt/azt, hímnem), <b>la<\/b> (nőnem), <b>li<\/b> (hímnem többes), <b>le<\/b> (nőnem többes). Az ige <i>elé<\/i> kerülnek. Ez a magyar tárgyas ragozás egyik megfelelője: <b>la vogliamo<\/b> = akarjuk (azt)."], "ex1": [["Il cameriere va in albergo.", "A pincér a szállodába megy."], ["Porto dell'acqua e del vino.", "Hozok vizet és bort."], ["Lo straniero prende anche l'insalata.", "A külföldi salátát is kér."], ["Adesso le lasagne non sono buone.", "Most nem jó a lasagne."], ["Ecco il menù.", "Itt az étlap."], ["Perché prendiamo il pollo?", "Miért kérünk csirkét?"]], "ex2": [{"hu": "A rendőrök nem kérnek italt.", "gap": "I poliziotti non . . . . . . . . da bere.", "ans": ["prendono"]}, {"hu": "A saláta jó.", "gap": "L'. . . . . . . . . è . . . . .", "ans": ["insalata", "buona"]}, {"hu": "Rossiék vizet hoznak.", "gap": "I Rossi portano dell'. . . . . .", "ans": ["acqua"]}, {"hu": "Tanár úr, legyen szíves, hol van Európa?", "gap": "Professore, per . . . . . . , dov'è l'Europa?", "ans": ["favore"]}, {"hu": "Pierino nem kér csirkét.", "gap": "Pierino non vuole il . . . . .", "ans": ["pollo"]}, {"hu": "Van jó bor Magyarországon?", "gap": "C'è del . . . . vino in . . . . . . . ?", "ans": ["buon", "Ungheria"]}], "voc": [["il cameriere", "a pincér"], ["il menù", "az étlap"], ["per favore", "legyen szíves"], ["subito", "azonnal"], ["ecco", "íme, tessék"], ["bere", "inni"], ["il vino rosso", "a vörösbor"], ["bianco", "fehér"], ["l'acqua", "a víz"], ["il pollo", "a csirke"], ["l'insalata", "a saláta"], ["portare", "hozni, vinni"], ["Buon appetito!", "Jó étvágyat!"], ["prego", "szívesen"]]}, {"n": 6, "it": "Sesta lezione", "hu": "Hatodik lecke", "title_it": "Libri interessanti", "title_hu": "Érdekes könyvek (Könyvek érdekesek)", "dlg": [["Gigi^1, vieni a fare^2 una passeggiata?", "Gigi, jössz sétálni (jössz -ni csinál egy séta)?"], ["No, adesso non ho tempo^3.", "Nem, most nincs időm (most nem van-nekem idő)."], ["Perché? Cosa fai?", "Miért? Mit csinálsz?"], ["Studio l'ungherese.", "Magyarul tanulok (Tanulom a magyart)."], ["È bello il libro?", "Jó a könyv (Van szép a könyv)?"], ["Molto interessante. Il suo titolo^4 è: «Il rosso e il nero».", "Nagyon érdekes. A címe (Az ő címe van): „Vörös és fekete” (A vörös és a fekete)."], ["Bene, allora non facciamo la passeggiata, leggo anch'io. Dov'è il mio libro^4?", "Jó, akkor nem sétálunk (nem csináljuk a sétát), én is olvasok. Hol a könyvem (Hol van a az-én könyv)?"], ["Eccolo^5, è sul^6 tavolo. Il titolo è interessante:", "Tessék (Íme-az), itt van az asztalon (van -on-a asztal). Érdekes a címe (A cím van érdekes):"], ["«Il poliziotto, sua moglie e il basilico».", "„A rendőr, a felesége és a bazsalikom” (A rendőr, övé feleség és a bazsalikom)."]], "notes": ["<b>Gigi<\/b> a <b>Luigi<\/b> becézője (mint a magyar <i>Laci<\/i> a <i>László<\/i>-é).", "Mozgást jelentő igék után <b>a<\/b> + főnévi igenév: <b>vieni a fare<\/b> (jössz csinálni), <b>vado a mangiare<\/b> (megyek enni). A főnévi igenév végződése <b>-are, -ere, -ire<\/b>: <b>parlare, leggere, venire<\/b>. <b>Vieni<\/b> a <b>venire<\/b> (jönni) alakja: <b>vengo, vieni, viene<\/b>.", "<b>Non ho tempo<\/b> = nincs időm (szó szerint: nem birtoklok időt). Az olaszban <i>nincs külön „nincs” szó<\/i>: <b>non c'è<\/b> = nincs (ott), <b>non ho<\/b> = nincs nekem. A tagadás mindig <b>non<\/b> + ige.", "Birtokos névmás <i>névelővel<\/i>: <b>il mio libro<\/b> (a könyvem), <b>il tuo<\/b>, <b>il suo<\/b>; nőnem: <b>la mia, la tua, la sua<\/b>. A névmás a birtok neméhez igazodik, nem a birtokoséhoz: <b>il suo titolo<\/b> = az ő (a könyv) címe. Kivétel: egyes számú rokonsági szavak névelő nélkül: <b>sua moglie<\/b> (9. mondat).", "<b>Eccolo<\/b> = <b>ecco<\/b> + <b>lo<\/b>: itt van (az). A hangsúlytalan névmás az <b>ecco<\/b> végéhez tapad: <b>eccola, eccoli<\/b>.", "Az elöljárószók összeolvadnak a határozott névelővel: <b>su + il = sul<\/b>, <b>in + il = nel<\/b>, <b>a + il = al<\/b>, <b>di + il = del<\/b>, <b>da + il = dal<\/b>. Ami a magyarban rag (<i>asztal-on<\/i>), az olaszban elöljárószó + névelő (<b>sul tavolo<\/b>)."], "ex1": [["Vado a passeggiare.", "Megyek sétálni."], ["Maria è molto bella.", "Mari nagyon szép."], ["Studio in una piccola città.", "Egy kis városban tanulok."], ["Il mio vino è sul tavolo.", "A borom az asztalon van."], ["Leggo solo in italiano.", "Csak olaszul olvasok."], ["Vorrei tre libri interessanti.", "Kérek három érdekes könyvet."]], "ex2": [{"hu": "Olvasok egy érdekes könyvet.", "gap": "Leggo un . . . . . interessante.", "ans": ["libro"]}, {"hu": "A férjem nincs otthon.", "gap": "Mio . . . . . . non è a . . . . .", "ans": ["marito", "casa"]}, {"hu": "Mit csinál Pierino a szobában?", "gap": "Cosa . . Pierino in . . . . . . ?", "ans": ["fa", "camera"]}, {"hu": "Egy különös nyelvet tanulunk.", "gap": ". . . . . . . . una lingua particolare.", "ans": ["Studiamo"]}, {"hu": "Miért nem sétálsz?", "gap": ". . . . . . non passeggi?", "ans": ["Perché"]}, {"hu": "Önök is olvasnak?", "gap": "Anche . . . leggete?", "ans": ["voi"]}], "voc": [["la passeggiata", "a séta"], ["perché", "miért; mert"], ["fare", "csinálni"], ["il libro", "a könyv"], ["interessante", "érdekes"], ["il titolo", "a cím"], ["leggere", "olvasni"], ["il tavolo", "az asztal"], ["allora", "akkor"], ["rosso", "vörös, piros"], ["nero", "fekete"], ["venire", "jönni"]]}, {"n": 7, "it": "Settima lezione", "hu": "Hetedik lecke", "title_it": "Ripasso", "title_hu": "Ismétlés", "ripasso": true, "sections": [["1 Az ige", ["<b>1.1 Jelen idő.<\/b> Az eddigi igealakok mind kijelentő mód jelen időben állnak.", "<b>1.2 Főnévi igenév.<\/b> Három végződés, három ragozási csoport: <b>-are<\/b> (parlare), <b>-ere<\/b> (leggere), <b>-ire<\/b> (venire, dormire).", "<b>1.3 Szabályos ragozás.<\/b> <b>parlare<\/b>: parlo, parli, parla, parliamo, parlate, parlano · <b>leggere<\/b>: leggo, leggi, legge, leggiamo, leggete, leggono. Az 1. személy mindig <b>-o<\/b>, a 2. mindig <b>-i<\/b>, a többes 1. mindig <b>-iamo<\/b>.", "<b>1.4 Rendhagyó igék<\/b> (táblázat a következő oldalon).", "<b>1.5 A létige.<\/b> Az olaszban az <b>è / sono<\/b> <i>soha nem marad el<\/i>: <b>Maria è bella<\/b> (Mari Ø szép), <b>Budapest è una città<\/b>. Létezés: <b>c'è / ci sono<\/b> (van / vannak). Birtoklás: <b>avere<\/b> (<b>ho tempo<\/b> = van időm). Hogylét: <b>stare<\/b> (<b>sto bene<\/b>)."]], ["TABLE", [["", "essere", "avere", "andare", "venire", "fare"], ["io", "sono", "ho", "vado", "vengo", "faccio"], ["tu", "sei", "hai", "vai", "vieni", "fai"], ["lui/lei", "è", "ha", "va", "viene", "fa"], ["noi", "siamo", "abbiamo", "andiamo", "veniamo", "facciamo"], ["voi", "siete", "avete", "andate", "venite", "fate"], ["loro", "sono", "hanno", "vanno", "vengono", "fanno"]]], ["2 Személyes névmások", ["<b>io, tu, lui/lei, noi, voi, loro<\/b>. Mint a magyarban, általában elmaradnak, mert az igevégződés mutatja a személyt: <b>parlo<\/b> = beszélek. Csak nyomatékként használjuk: <b>io parlo<\/b> = <i>én<\/i> beszélek. Udvarias forma: <b>Lei<\/b> (+ egyes szám 3. személy)."]], ["3 Nem és névelő", ["Minden főnévnek van nyelvtani neme. <b>-o<\/b> → többnyire hímnem (libro), <b>-a<\/b> → többnyire nőnem (casa), <b>-e<\/b> → mindkettő lehet (paese hím., moglie nőn.).", "Határozott névelő: hímnem <b>il<\/b> (il libro), <b>lo<\/b> (s+mássalhangzó, z előtt: lo straniero), <b>l'<\/b> (magánhangzó előtt); nőnem <b>la<\/b>, <b>l'<\/b>. Többes szám: <b>i / gli<\/b> (hím.), <b>le<\/b> (nőn.). Határozatlan: <b>un, uno<\/b> / <b>una, un'<\/b>.", "A melléknév nemben és számban egyezik: <b>il libro rosso, la casa rossa, i libri rossi, le case rosse<\/b>."]], ["4 Elöljárószók a ragok helyett", ["<b>in<\/b> = -ban/-ben és -ba/-be (országok, helyiségek: in Italia, in cucina) · <b>a<\/b> = városnév előtt -ban/-ba (a Roma), és <b>a casa<\/b> · <b>su<\/b> = -on/-en/-ön, -ra/-re · <b>di<\/b> = -ból (anyag, mennyiség), birtok („-é”) · <b>da<\/b> = -tól/-től, -nál/-nél, -hoz/-hez (személyeknél).", "Névelővel összeolvadnak: <b>in + il = nel<\/b>, <b>su + la = sulla<\/b>, <b>a + il = al<\/b>, <b>di + il = del<\/b>, <b>da + il = dal<\/b>."]]], "dlg": [["Cosa fa Pietro in camera?", "Mit csinál Péter a szobában?"], ["Legge un libro interessante.", "Egy érdekes könyvet olvas."], ["E Maria in cucina?", "És Mari a konyhában?"], ["Fa il pollo arrosto.", "Sült csirkét csinál."], ["Dove vive lo straniero?", "Hol él a külföldi?"], ["In Ungheria.", "Magyarországon."], ["E la famiglia Rossi?", "És a Rossi család?"], ["A Roma.", "Rómában."], ["Dove va Giovanni?", "Hova megy János?"], ["In albergo.", "A szállodába."]], "voc": [["essere", "lenni"], ["avere", "birtokolni (van neki)"], ["stare bene", "jól lenni"], ["c'è / ci sono", "van / vannak"], ["io vado", "megyek"], ["io vengo", "jövök"], ["io faccio", "csinálok"]]}]</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const store={get(k,d){try{const v=localStorage.getItem('olaszora:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('olaszora:'+k,JSON.stringify(v))}catch(e){}}};
let st={tab:store.get('tab','lecke'),n:store.get('n',4),done:store.get('done',[]),boxes:store.get('boxes',{}),showHu:false};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sup=s=>s.replace(/\^(\d+)/g,'<sup>$1</sup>');
const calc=s=>s.replace(/\(([^)]*)\)/g,'<i>($1)</i>');
const clean=s=>s.replace(/\^\d+/g,'');
const lesson=()=>DATA.find(d=>d.n===st.n);
const canSpeak=false;
function speak(t){ if(!canSpeak) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(clean(t)); u.lang='it-IT'; u.rate=.85; const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('it')); if(v) u.voice=v; speechSynthesis.speak(u);}catch(e){} }
function save(){store.set('tab',st.tab);store.set('n',st.n);store.set('done',st.done);store.set('boxes',st.boxes)}
function allCards(){ const c=[]; DATA.forEach(d=>d.voc.forEach(([it,hu])=>c.push({id:d.n+':'+it,it,hu,n:d.n}))); return c }
function stats(){
  const cards=allCards(); const known=cards.filter(c=>(st.boxes[c.id]||0)>=3).length;
  document.getElementById('stats').innerHTML=`<span class="pill">Leckék: <b>${st.done.length}</b> / ${DATA.length}</span><span class="pill">Szavak (tudom): <b>${known}</b> / ${cards.length}</span>`;
}
function chips(){
  const el=document.getElementById('chips');
  if(st.tab==='kartya'){el.innerHTML='';return}
  el.innerHTML=DATA.map(d=>`<button class="chip ${st.done.includes(d.n)?'done':''}" aria-pressed="${d.n===st.n}" data-n="${d.n}"><span class="dot"></span>${d.n}. ${d.ripasso?'Ismétlés':esc(d.title_it)}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st.n=+b.dataset.n;st.showHu=false;render()});
}
function viewLesson(){
  const d=lesson(); let h=`<div class="lesson-head"><div><div class="kicker">${d.it} · ${d.hu}</div><h2>${esc(d.title_it)}</h2></div></div><p class="hu-title">${calc(d.title_hu)}</p>`;
  if(d.ripasso){
    h+='<div class="card rip">'+d.sections.map(([t,it])=>{
      if(t==='TABLE') return `<h4>Rendhagyó igék</h4><div class="tablewrap"><table class="conj">${it.map((r,i)=>'<tr>'+r.map((c,j)=>i===0||j===0?`<th>${c}</th>`:`<td>${c}</td>`).join('')+'</tr>').join('')}</table></div>`;
      return `<h4>${t}</h4>`+it.map(p=>`<p>${p}</p>`).join('')}).join('')+'</div>';
    h+=`<h3 class="kicker" style="margin:18px 0 8px">Ismétlő gyakorlat</h3>`;
  }
  h+=`<div class="toolbar"><button class="btn" id="tgl">${st.showHu?'Fordítás elrejtése':'Fordítás mutatása'}</button>${canSpeak?'<button class="btn ghost" id="all">▶ Teljes párbeszéd</button>':''}<button class="btn ${st.done.includes(d.n)?'':'primary'}" id="dn">${st.done.includes(d.n)?'✓ Kész – visszavonás':'Megjelölöm késznek'}</button></div>`;
  h+='<ol class="dlg">'+d.dlg.map(([it,hu],i)=>`<li><span class="num">${i+1}</span><span class="it">${sup(esc(it))}</span>${canSpeak?`<button class="say" data-i="${i}" aria-label="Meghallgatás">▶</button>`:''}<span class="hu ${st.showHu?'':'hidden'}" title="Koppints a fordításért">${calc(esc(hu))}</span></li>`).join('')+'</ol>';
  if(!st.showHu) h+='<p class="muted">Tipp: próbálja meg előbb megérteni az olasz mondatot, aztán koppintson a szürke sávra a fordításért.</p>';
  if(d.notes) h+='<section class="notes"><h3>Jegyzetek</h3><ol>'+d.notes.map(n=>`<li>${n}</li>`).join('')+'</ol></section>';
  const v=document.getElementById('view'); v.innerHTML=h;
  v.querySelector('#tgl').onclick=()=>{st.showHu=!st.showHu;render()};
  v.querySelector('#dn').onclick=()=>{st.done=st.done.includes(d.n)?st.done.filter(x=>x!==d.n):[...st.done,d.n];render()};
  v.querySelectorAll('.hu.hidden').forEach(e=>e.onclick=()=>e.classList.remove('hidden'));
  v.querySelectorAll('.say').forEach(b=>b.onclick=()=>speak(d.dlg[+b.dataset.i][0]));
  const a=v.querySelector('#all'); if(a) a.onclick=()=>speak(d.dlg.map(x=>x[0]).join(' … '));
}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’`]/g,"'").replace(/\s+/g,' ').trim();
const accentOk=(a,b)=>a.toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g,' ').trim()===b.toLowerCase();
function viewEx(){
  const d=lesson(); const v=document.getElementById('view');
  if(d.ripasso){ v.innerHTML=`<div class="card"><h3>Ismétlés</h3><p>Ennél a leckénél a gyakorlat maga a párbeszéd: nyissa meg a <b>Leckék</b> fület, takarja le a fordítást, és fordítsa le fejben mind a tíz mondatot.</p></div>`; return }
  let h=`<div class="lesson-head"><div><div class="kicker">${d.it} · Gyakorlatok</div><h2>${esc(d.title_it)}</h2></div></div>`;
  h+=`<section class="card ex1"><h3>1. gyakorlat – Fordítsa le</h3><ol>`+d.ex1.map(([it,hu],i)=>`<li><span>${esc(it)}</span> <button class="btn ghost" style="padding:2px 10px;font-size:.8rem" data-r="${i}">Megoldás</button><span class="ans" id="a${i}" hidden>${esc(hu)}</span></li>`).join('')+'</ol></section>';
  h+=`<section class="card ex2"><h3>2. gyakorlat – Egészítse ki</h3><p class="muted">Írja be a hiányzó olasz szavakat. Minden pont egy betű.</p>`;
  d.ex2.forEach((r,ri)=>{ let k=0; const line=esc(r.gap).replace(/(?:^|(?<=[\s']))\.(?: \.)*/g,m=>{const len=(m.match(/\./g)||[]).length;const id=`g${ri}_${k++}`;return `<input id="${id}" size="${Math.max(3,len+1)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="hiányzó szó">`});
    h+=`<div class="row"><div class="q">${ri+1}. ${esc(r.hu)}</div><div class="line">${line}<span class="fb" id="fb${ri}"></span></div></div>`});
  h+=`<div class="toolbar"><button class="btn primary" id="chk">Ellenőrzés</button><button class="btn" id="shw">Megoldások</button></div></section>`;
  v.innerHTML=h;
  v.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{document.getElementById('a'+b.dataset.r).hidden=false;b.remove()});
  v.querySelector('#chk').onclick=()=>{ let ok=0,tot=0; d.ex2.forEach((r,ri)=>{ let good=true; r.ans.forEach((a,k)=>{const el=document.getElementById(`g${ri}_${k}`);tot++;const val=el.value; const exact=accentOk(val,a); const loose=norm(val)===norm(a); el.className=exact?'ok':(loose?'ok':'no'); if(exact||loose) ok++; else good=false; if(loose&&!exact) document.getElementById('fb'+ri).textContent='ékezet: '+a;}); if(good&&!document.getElementById('fb'+ri).textContent) document.getElementById('fb'+ri).textContent='✓'; }); v.querySelector('#chk').textContent=`Ellenőrzés (${ok}/${tot})`; };
  v.querySelector('#shw').onclick=()=>d.ex2.forEach((r,ri)=>r.ans.forEach((a,k)=>{const el=document.getElementById(`g${ri}_${k}`);el.value=a;el.className=''}));
}
let deck=[],cur=0,flipped=false,dir=store.get('dir','it');
function buildDeck(){ const learned=DATA.filter(d=>d.n<=Math.max(st.n,...st.done,1)).map(d=>d.n); deck=allCards().filter(c=>learned.includes(c.n)).sort((a,b)=>(st.boxes[a.id]||0)-(st.boxes[b.id]||0)||Math.random()-.5); cur=0; flipped=false }
function viewCards(){
  if(!deck.length) buildDeck();
  const v=document.getElementById('view'); const c=deck[cur];
  const cnt=[0,1,2,3].map(b=>deck.filter(x=>Math.min(3,st.boxes[x.id]||0)===b).length);
  const q=dir==='it'?c.it:c.hu, a=dir==='it'?c.hu:c.it;
  v.innerHTML=`<div class="opts"><span>Irány:</span><button class="chip" aria-pressed="${dir==='it'}" id="d-it">olasz → magyar</button><button class="chip" aria-pressed="${dir==='hu'}" id="d-hu">magyar → olasz</button><span class="muted">A kártyák az eddig megnyitott leckékből jönnek.</span></div>
  <div class="flash"><div class="fcard" id="fc" tabindex="0" role="button" aria-label="Kártya megfordítása"><span class="tag">${c.n}. lecke · ${cur+1}/${deck.length}</span><div><div class="w">${esc(q)}</div>${flipped?`<div class="a">${esc(a)}</div>`:'<div class="muted" style="margin-top:10px">koppintson a megfordításhoz</div>'}</div></div>
  <div class="fbtns">${flipped?'<button class="btn" id="no">Még nem tudom</button><button class="btn primary" id="yes">Tudom</button>':''}${canSpeak?'<button class="btn ghost" id="sp">▶ Kiejtés</button>':''}</div>
  <div class="boxes"><span>új: ${cnt[0]}</span><span>1×: ${cnt[1]}</span><span>2×: ${cnt[2]}</span><span>tudom: ${cnt[3]}</span></div></div>`;
  const fc=v.querySelector('#fc'); fc.onclick=()=>{flipped=!flipped;viewCards()}; fc.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();fc.click()}};
  const next=()=>{cur=(cur+1)%deck.length;flipped=false;save();stats();viewCards()};
  const y=v.querySelector('#yes'); if(y) y.onclick=()=>{st.boxes[c.id]=Math.min(3,(st.boxes[c.id]||0)+1);next()};
  const n=v.querySelector('#no'); if(n) n.onclick=()=>{st.boxes[c.id]=0;next()};
  const sp=v.querySelector('#sp'); if(sp) sp.onclick=()=>speak(c.it);
  v.querySelector('#d-it').onclick=()=>{dir='it';store.set('dir',dir);flipped=false;viewCards()};
  v.querySelector('#d-hu').onclick=()=>{dir='hu';store.set('dir',dir);flipped=false;viewCards()};
}
function render(){
  save(); stats(); chips();
  ['lecke','gyak','kartya'].forEach(t=>document.getElementById('t-'+t).setAttribute('aria-selected',st.tab===t));
  if(st.tab==='lecke') viewLesson(); else if(st.tab==='gyak') viewEx(); else { deck=[]; viewCards(); }
}
['lecke','gyak','kartya'].forEach(t=>document.getElementById('t-'+t).onclick=()=>{st.tab=t;render()});
if(!DATA.some(d=>d.n===st.n)) st.n=DATA[0].n;
render();

</script>

</body>
