}], "voc": [["straniero", "külföldi"], ["studiare", "tanulni"], ["difficile", "nehéz"], ["facile", "könnyű"], ["la lingua", "a nyelv"], ["dove?", "hol? hová?"], ["adesso", "most"], ["l'albergo", "a szálloda"], ["andare", "menni"], ["arrivederci", "viszontlátásra"], ["la cittadina", "a kisváros"]]}, {"n": 5, "it": "Quinta lezione", "hu": "Ötödik lecke", "title_it": "Al ristorante «Da Mario»", "title_hu": "A „Da Mario” étteremben (-nál étterem „Mariónál”)", "dlg": [["Cameriere! Il menù, per favore^1!", "Pincér! Az étlapot, legyen szíves (Az étlap, kérem)!"], ["Arrivo subito… Ecco a Lei^2.", "Azonnal jövök (Érkezem azonnal)… Tessék (Íme Önnek)."], ["Grazie.", "Köszönöm."], ["Cosa prendete^3 da bere?", "Mit kérnek inni (Mit vesztek -ból inni)?"], ["Un litro di^4 vino rosso.", "Egy liter vörösbort (Egy liter -ból bor vörös)."], ["Abbiamo^5 solo vino bianco.", "Csak fehérbor van (Van-nekünk csak bor fehér)."], ["Va bene. Ma vogliamo anche dell'acqua^6. Avete le lasagne?", "Jó (Megy jól). De vizet is kérünk (De akarunk is -ból-a víz). Van lasagne (Van-nektek a lasagne)?"], ["Sì, signore. Le abbiamo^7. E abbiamo anche il pollo arrosto.", "Igen, uram (úr). Van (Azokat van-nekünk). És sült csirke is van (És van-nekünk is a csirke sült)."], ["Prendiamo due lasagne e un pollo arrosto.", "Két lasagnét és egy sült csirkét kérünk (Veszünk két lasagne és egy csirke sült)."], ["Porto anche un'insalata.", "Hozok salátát is (Hozok is egy saláta)."], ["No, l'insalata non la vogliamo^7.", "Nem, salátát nem kérünk (Nem, a saláta nem azt akarjuk)."], ["Buon appetito!", "Jó étvágyat!"]], "notes": ["<b>Per favore<\/b> = <i>kérem, legyen szíves<\/i>. A <b>grazie<\/b>-re adott válasz: <b>prego<\/b> (<i>szívesen<\/i>).", "<b>Ecco<\/b> = <i>íme, tessék<\/i>, amikor átadunk vagy megmutatunk valamit: <b>Ecco il menù<\/b> = Itt az étlap. <b>Ecco a Lei<\/b> = Tessék (Önnek).", "<b>Prendere<\/b> = venni, fogni; étteremben „kérni, rendelni”. <b>Prendete<\/b> többes szám 2. személy: a pincér a társaságot <b>voi<\/b>-jal szólítja meg, ez étteremben is teljesen udvarias.", "Mennyiség után <b>di<\/b> áll: <b>un litro di vino<\/b>, <b>un chilo di pane<\/b>. Fontos: az olaszban <i>nincs tárgyrag<\/i> (-t)! A tárgy ugyanúgy néz ki, mint az alany; a szórend mutatja: <b>prendo il vino<\/b> (alany – ige – tárgy).", "<b>Avere<\/b> = birtokolni. Az olasznak – a magyarral ellentétben – van külön igéje a birtoklásra: <b>ho, hai, ha, abbiamo, avete, hanno<\/b>. „Van nekünk” = <b>abbiamo<\/b>; „Van gulyás?” étteremben = <b>Avete…?<\/b> (Önöknek van…?).", "<b>Dell'acqua, del vino<\/b>: részelő névelő (<b>di<\/b> + határozott névelő) = „egy kis, valamennyi”. A magyarban ilyenkor egyszerűen nincs névelő: <i>vizet kérünk<\/i>.", "<b>Le abbiamo / la vogliamo<\/b>: hangsúlytalan tárgyi névmások – <b>lo<\/b> (őt/azt, hímnem), <b>la<\/b> (nőnem), <b>li<\/b> (hímnem többes), <b>le<\/b> (nőnem többes). Az ige <i>elé<\/i> kerülnek. Ez a magyar tárgyas ragozás egyik megfelelője: <b>la vogliamo<\/b> = akarjuk (azt)."], "ex1": [["Il cameriere va in albergo.", "A pincér a szállodába megy."], ["Porto dell'acqua e del vino.", "Hozok vizet és bort."], ["Lo straniero prende anche l'insalata.", "A külföldi salátát is kér."], ["Adesso le lasagne non sono buone.", "Most nem jó a lasagne."], ["Ecco il menù.", "Itt az étlap."], ["Perché prendiamo il pollo?", "Miért kérünk csirkét?"]], "ex2": [{"hu": "A rendőrök nem kérnek italt.", "gap": "I poliziotti non . . . . . . . . da bere.", "ans": ["prendono"]}, {"hu": "A saláta jó.", "gap": "L'. . . . . . . . è . . . . .", "ans": ["insalata", "buona"]}, {"hu": "Rossiék vizet hoznak.", "gap": "I Rossi portano dell'. . . . . .", "ans": ["acqua"]}, {"hu": "Tanár úr, legyen szíves, hol van Európa?", "gap": "Professore, per . . . . . . , dov'è l'Europa?", "ans": ["favore"]}, {"hu": "Pierino nem kér csirkét.", "gap": "Pierino non vuole il . . . . .", "ans": ["pollo"]}, {"hu": "Van jó bor Magyarországon?", "gap": "C'è del . . . . vino in . . . . . . . . ?", "ans": ["buon", "Ungheria"]}], "voc": [["il cameriere", "a pincér"], ["il menù", "az étlap"], ["per favore", "legyen szíves"], ["subito", "azonnal"], ["ecco", "íme, tessék"], ["bere", "inni"], ["il vino rosso", "a vörösbor"], ["bianco", "fehér"], ["l'acqua", "a víz"], ["il pollo", "a csirke"], ["l'insalata", "a saláta"], ["portare", "hozni, vinni"], ["Buon appetito!", "Jó étvágyat!"], ["prego", "szívesen"]]}, {"n": 6, "it": "Sesta lezione", "hu": "Hatodik lecke", "title_it": "Libri interessanti", "title_hu": "Érdekes könyvek (Könyvek érdekesek)", "dlg": [["Gigi^1, vieni a fare^2 una passeggiata?", "Gigi, jössz sétálni (jössz -ni csinál egy séta)?"], ["No, adesso non ho tempo^3.", "Nem, most nincs időm (most nem van-nekem idő)."], ["Perché? Cosa fai?", "Miért? Mit csinálsz?"], ["Studio l'ungherese.", "Magyarul tanulok (Tanulom a magyart)."], ["È bello il libro?", "Jó a könyv (Van szép a könyv)?"], ["Molto interessante. Il suo titolo^4 è: «Il rosso e il nero».", "Nagyon érdekes. A címe (Az ő címe van): „Vörös és fekete” (A vörös és a fekete)."], ["Bene, allora non facciamo la passeggiata, leggo anch'io. Dov'è il mio libro^4?", "Jó, akkor nem sétálunk (nem csináljuk a sétát), én is olvasok. Hol a könyvem (Hol van a az-én könyv)?"], ["Eccolo^5, è sul^6 tavolo. Il titolo è interessante:", "Tessék (Íme-az), itt van az asztalon (van -on-a asztal). Érdekes a címe (A cím van érdekes):"], ["«Il poliziotto, sua moglie e il basilico».", "„A rendőr, a felesége és a bazsalikom” (A rendőr, övé feleség és a bazsalikom)."]], "notes": ["<b>Gigi<\/b> a <b>Luigi<\/b> becézője (mint a magyar <i>Laci<\/i> a <i>László<\/i>-é).", "Mozgást jelentő igék után <b>a<\/b> + főnévi igenév: <b>vieni a fare<\/b> (jössz csinálni), <b>vado a mangiare<\/b> (megyek enni). A főnévi igenév végződése <b>-are, -ere, -ire<\/b>: <b>parlare, leggere, venire<\/b>. <b>Vieni<\/b> a <b>venire<\/b> (jönni) alakja: <b>vengo, vieni, viene<\/b>.", "<b>Non ho tempo<\/b> = nincs időm (szó szerint: nem birtoklok időt). Az olaszban <i>nincs külön „nincs” szó<\/i>: <b>non c'è<\/b> = nincs (ott), <b>non ho<\/b> = nincs nekem. A tagadás mindig <b>non<\/b> + ige.", "Birtokos névmás <i>névelővel<\/i>: <b>il mio libro<\/b> (a könyvem), <b>il tuo<\/b>, <b>il suo<\/b>; nőnem: <b>la mia, la tua, la sua<\/b>. A névmás a birtok neméhez igazodik, nem a birtokoséhoz: <b>il suo titolo<\/b> = az ő (a könyv) címe. Kivétel: egyes számú rokonsági szavak névelő nélkül: <b>sua moglie<\/b> (9. mondat).", "<b>Eccolo<\/b> = <b>ecco<\/b> + <b>lo<\/b>: itt van (az). A hangsúlytalan névmás az <b>ecco<\/b> végéhez tapad: <b>eccola, eccoli<\/b>.", "Az elöljárószók összeolvadnak a határozott névelővel: <b>su + il = sul<\/b>, <b>in + il = nel<\/b>, <b>a + il = al<\/b>, <b>di + il = del<\/b>, <b>da + il = dal<\/b>. Ami a magyarban rag (<i>asztal-on<\/i>), az olaszban elöljárószó + névelő (<b>sul tavolo<\/b>)."], "ex1": [["Vado a passeggiare.", "Megyek sétálni."], ["Maria è molto bella.", "Mari nagyon szép."], ["Studio in una piccola città.", "Egy kis városban tanulok."], ["Il mio vino è sul tavolo.", "A borom az asztalon van."], ["Leggo solo in italiano.", "Csak olaszul olvasok."], ["Vorrei tre libri interessanti.", "Kérek három érdekes könyvet."]], "ex2": [{"hu": "Olvasok egy érdekes könyvet.", "gap": "Leggo un . . . . . interessante.", "ans": ["libro"]}, {"hu": "A férjem nincs otthon.", "gap": "Mio . . . . . . non è a . . . . .", "ans": ["marito", "casa"]}, {"hu": "Mit csinál Pierino a szobában?", "gap": "Cosa . . Pierino in . . . . . . ?", "ans": ["fa", "camera"]}, {"hu": "Egy különös nyelvet tanulunk.", "gap": ". . . . . . . . una lingua particolare.", "ans": ["Studiamo"]}, {"hu": "Miért nem sétálsz?", "gap": ". . . . . . non passeggi?", "ans": ["Perché"]}, {"hu": "Önök is olvasnak?", "gap": "Anche . . . leggete?", "ans": ["voi"]}], "voc": [["la passeggiata", "a séta"], ["perché", "miért; mert"], ["fare", "csinálni"], ["il libro", "a könyv"], ["interessante", "érdekes"], ["il titolo", "a cím"], ["leggere", "olvasni"], ["il tavolo", "az asztal"], ["allora", "akkor"], ["rosso", "vörös, piros"], ["nero", "fekete"], ["venire", "jönni"]]}, {"n": 7, "it": "Settima lezione", "hu": "Hetedik lecke", "title_it": "Ripasso", "title_hu": "Ismétlés", "ripasso": true, "sections": [["1 Az ige", ["<b>1.1 Jelen idő.<\/b> Az eddigi igealakok mind kijelentő mód jelen időben állnak.", "<b>1.2 Főnévi igenév.<\/b> Három végződés, három ragozási csoport: <b>-are<\/b> (parlare), <b>-ere<\/b> (leggere), <b>-ire<\/b> (venire, dormire).", "<b>1.3 Szabályos ragozás.<\/b> <b>parlare<\/b>: parlo, parli, parla, parliamo, parlate, parlano · <b>leggere<\/b>: leggo, leggi, legge, leggiamo, leggete, leggono. Az 1. személy mindig <b>-o<\/b>, a 2. mindig <b>-i<\/b>, a többes 1. mindig <b>-iamo<\/b>.", "<b>1.4 Rendhagyó igék<\/b> (táblázat a következő oldalon).", "<b>1.5 A létige.<\/b> Az olaszban az <b>è / sono<\/b> <i>soha nem marad el<\/i>: <b>Maria è bella<\/b> (Mari Ø szép), <b>Budapest è una città<\/b>. Létezés: <b>c'è / ci sono<\/b> (van / vannak). Birtoklás: <b>avere<\/b> (<b>ho tempo<\/b> = van időm). Hogylét: <b>stare<\/b> (<b>sto bene<\/b>)."]], ["TABLE", [["", "essere", "avere", "andare", "venire", "fare"], ["io", "sono", "ho", "vado", "vengo", "faccio"], ["tu", "sei", "hai", "vai", "vieni", "fai"], ["lui/lei", "è", "ha", "va", "viene", "fa"], ["noi", "siamo", "abbiamo", "andiamo", "veniamo", "facciamo"], ["voi", "siete", "avete", "andate", "venite", "fate"], ["loro", "sono", "hanno", "vanno", "vengono", "fanno"]]], ["2 Személyes névmások", ["<b>io, tu, lui/lei, noi, voi, loro<\/b>. Mint a magyarban, általában elmaradnak, mert az igevégződés mutatja a személyt: <b>parlo<\/b> = beszélek. Csak nyomatékként használjuk: <b>io parlo<\/b> = <i>én<\/i> beszélek. Udvarias forma: <b>Lei<\/b> (+ egyes szám 3. személy)."]], ["3 Nem és névelő", ["Minden főnévnek van nyelvtani neme. <b>-o<\/b> → többnyire hímnem (libro), <b>-a<\/b> → többnyire nőnem (casa), <b>-e<\/b> → mindkettő lehet (paese hím., moglie nőn.).", "Határozott névelő: hímnem <b>il<\/b> (il libro), <b>lo<\/b> (s+mássalhangzó, z előtt: lo straniero), <b>l'<\/b> (magánhangzó előtt); nőnem <b>la<\/b>, <b>l'<\/b>. Többes szám: <b>i / gli<\/b> (hím.), <b>le<\/b> (nőn.). Határozatlan: <b>un, uno<\/b> / <b>una, un'<\/b>.", "A melléknév nemben és számban egyezik: <b>il libro rosso, la casa rossa, i libri rossi, le case rosse<\/b>."]], ["4 Elöljárószók a ragok helyett", ["<b>in<\/b> = -ban/-ben és -ba/-be (országok, helyiségek: in Italia, in cucina) · <b>a<\/b> = városnév előtt -ban/-ba (a Roma), és <b>a casa<\/b> · <b>su<\/b> = -on/-en/-ön, -ra/-re · <b>di<\/b> = -ból (anyag, mennyiség), birtok („-é”) · <b>da<\/b> = -tól/-től, -nál/-nél, -hoz/-hez (személyeknél).", "Névelővel összeolvadnak: <b>in + il = nel<\/b>, <b>su + la = sulla<\/b>, <b>a + il = al<\/b>, <b>di + il = del<\/b>, <b>da + il = dal<\/b>."]]], "dlg": [["Cosa fa Pietro in camera?", "Mit csinál Péter a szobában?"], ["Legge un libro interessante.", "Egy érdekes könyvet olvas."], ["E Maria in cucina?", "És Mari a konyhában?"], ["Fa il pollo arrosto.", "Sült csirkét csinál."], ["Dove vive lo straniero?", "Hol él a külföldi?"], ["In Ungheria.", "Magyarországon."], ["E la famiglia Rossi?", "És a Rossi család?"], ["A Roma.", "Rómában."], ["Dove va Giovanni?", "Hova megy János?"], ["In albergo.", "A szállodába."]], "voc": [["essere", "lenni"], ["avere", "birtokolni (van neki)"], ["stare bene", "jól lenni"], ["c'è / ci sono", "van / vannak"], ["io vado", "megyek"], ["io vengo", "jövök"], ["io faccio", "csinálok"]]}, {"n": 8, "it": "Ottava lezione", "hu": "Nyolcadik lecke", "title_it": "Una visita in banca", "title_hu": "Látogatás a bankban (Egy látogatás -ban bank)", "dlg": [["Stamattina^1 il signor Bianchi va in banca.", "Bianchi úr ma délelőtt a bankba megy (Ma-reggel a úr Bianchi megy -ba bank)."], ["La banca è in via^2 Garibaldi.", "A bank a Garibaldi utcában van (A bank van -ban utca Garibaldi)."], ["Buongiorno. Dov'è la cassa?", "Jó napot kívánok. Hol van a pénztár?"], ["È lì a sinistra, vicino alla^3 finestra.", "Ott van balra, az ablak mellett (Van ott -ra bal, közel -hoz-az ablak)."], ["Grazie mille^4.", "Köszönöm szépen (Köszönet ezer)."], ["Ecco due assegni^5, vorrei dei contanti.", "Itt van két csekk, készpénzt kérek (Íme két csekkek, szeretnék -ból-a készpénz)."], ["Signore, questi^6 assegni sono falsi.", "Uram, ezek a csekkek hamisak (Úr, ezek csekkek vannak hamisak)."], ["Se non mi dà cento milioni di euro, sparo!", "Ha nem ad százmillió eurót, lövök! (Ha nem nekem ad száz milliók -ból euró, lövök!)"], ["Ecco i soldi. Prego, cento milioni di euro.", "Itt a pénz. Tessék, százmillió euró (Íme a pénzek. Tessék, száz milliók -ból euró)."], ["Va bene. Non sparo.", "Rendben van. Nem lövök (Megy jól. Nem lövök)."], ["Il signor Bianchi esce dalla^7 banca e torna a casa. La polizia lo^8 aspetta già.", "Bianchi úr kijön a bankból és hazamegy. A rendőrség már várja (A rendőrség őt várja már)."]], "notes": ["<b>Stamattina<\/b> = <b>questa mattina<\/b> (ma reggel, ma délelőtt). Ugyanígy: <b>stasera<\/b> (ma este), <b>stanotte<\/b> (ma éjjel).", "Utcanév: <b>via<\/b> + név, névelő nélkül: <b>in via Garibaldi<\/b> = a Garibaldi utcában. Tér: <b>piazza<\/b> (<b>in piazza Navona<\/b>).", "A magyar névutók helyett az olaszban elöljárós kifejezések állnak: <b>vicino a<\/b> (mellett, közel), <b>davanti a<\/b> (előtt), <b>dietro<\/b> (mögött). <b>a + la = alla<\/b>.", "<b>Grazie mille<\/b> = köszönöm szépen („ezer köszönet”). Melléknévből határozószó a <b>-mente<\/b> képzővel: <b>certo → certamente<\/b> (biztosan), <b>particolare → particolarmente<\/b> (különösen).", "Fontos különbség: az olaszban számnév után <i>többes szám<\/i> áll: <b>due assegni<\/b> (két csekk), <b>tre libri<\/b> (három könyv). Az <b>euro<\/b> nem változik: <b>un euro, cento euro<\/b>.", "<b>questo / questa / questi / queste<\/b> + főnév, <i>névelő nélkül<\/i>: <b>questo libro<\/b> = ez a könyv, <b>questi assegni<\/b> = ezek a csekkek. A magyar „ez <i>a<\/i>” névelője elmarad!", "Honnan? = <b>Da dove?<\/b> A <b>da<\/b> = -ból/-ből, -tól/-től: <b>esco dalla banca<\/b> (kijövök a bankból), <b>vengo da Roma<\/b> (Rómából jövök). Összefoglalva: <b>sono in banca<\/b> (bankban vagyok) / <b>vado in banca<\/b> (bankba megyek) / <b>esco dalla banca<\/b> (bankból jövök ki).", "<b>lo<\/b> = őt (hímnem), <b>la<\/b> = őt (nőnem); az ige <i>elé<\/i> kerül: <b>lo aspetta<\/b> = várja (őt). Vö. a magyar tárgyas ragozással: <b>várja<\/b>."], "ex1": [["Queste finestre sono belle.", "Ezek az ablakok szépek."], ["L'assegno è alla cassa.", "A csekk a pénztárban van."], ["Pierino torna a casa stamattina.", "Petike ma délelőtt hazamegy."], ["Se non studia, va a passeggiare.", "Ha nem tanul, sétálni megy."], ["L'albergo è vicino al ristorante.", "A szálloda az étterem mellett van."], ["La famiglia non viene dall'Ungheria.", "A család nem Magyarországról jön."]], "ex2": [{"hu": "Ezek a csekkek nem hamisak.", "gap": ". . . . . . assegni non sono . . . . . .", "ans": ["Questi", "falsi"]}, {"hu": "A konyha balra van.", "gap": "La . . . . . . è a . . . . . . . .", "ans": ["cucina", "sinistra"]}, {"hu": "A tanár pénzt ad.", "gap": "Il professore dà dei . . . . .", "ans": ["soldi"]}, {"hu": "Hogy van, uram?", "gap": "Come sta, . . . . . . . ?", "ans": ["signore"]}, {"hu": "Otthon van százmillió eurom.", "gap": "A casa . . cento milioni di euro", "ans": ["ho"]}, {"hu": "Nem Pietro jön a városból.", "gap": "Non è Pietro che viene . . . . . città", "ans": ["dalla"]}], "voc": [["la banca", "a bank"], ["la cassa", "a pénztár"], ["la finestra", "az ablak"], ["a sinistra", "balra"], ["a destra", "jobbra"], ["vicino a", "mellett, közel"], ["l'assegno", "a csekk"], ["i soldi", "a pénz"], ["falso", "hamis"], ["se", "ha"], ["stamattina", "ma délelőtt"], ["tornare a casa", "hazamenni"]]}, {"n": 9, "it": "Nona lezione", "hu": "Kilencedik lecke", "title_it": "È tardi", "title_hu": "Késő van (Van késő)", "dlg": [["Sono le otto^1 di mattina.", "Reggel nyolc óra van (Vannak a nyolc -ból reggel)."], ["La signora Neri va al lavoro.", "Neriné munkába megy (A asszony Neri megy -hoz-a munka)."], ["In piazza Venezia sale sul^2 tram.", "A Venezia téren felszáll a villamosra (-ban tér Venezia felszáll -ra-a villamos)."], ["Sul tram si siede^3 e legge il giornale.", "A villamoson leül és újságot olvas (-on-a villamos magát leülteti és olvas a újság)."], ["Scende dal tram vicino alla banca.", "A bank mellett leszáll a villamosról (Leszáll -ról-a villamos közel -hoz-a bank)."], ["Poi cammina a piedi per cinquecento metri.", "Aztán gyalog sétál ötszáz métert (Aztán gyalogol -on lábak -ért ötszáz méterek)."], ["Si ferma davanti a un grande palazzo. È il suo^4 posto di lavoro.", "Egy nagy ház előtt megáll. Ez a munkahelye (Magát megállítja előtt -hoz egy nagy palota. Van a ő helye -ból munka)."], ["Sale in ascensore al terzo piano.", "Felmegy lifttel a harmadik emeletre (Felmegy -ban lift -ra-a harmadik emelet)."], ["La signora Neri è nervosa perché sono già le nove.", "Neriné ideges, mert már kilenc óra van."], ["Buongiorno, signora Neri. Perché arriva solo adesso?", "Jó reggelt kívánok, Neriné. Miért csak most jön (Miért érkezik csak most)?"], ["Il nostro bambino è malato^5, direttore. Domani arrivo puntuale.", "Beteg a gyerekünk, igazgató úr. Holnap pontosan jövök (Holnap érkezem pontos)."]], "notes": ["Az idő: <b>Che ore sono?<\/b> (Hány óra van?) – <b>Sono le otto<\/b> (többes szám!), de: <b>È l'una<\/b> (egy óra van), <b>è mezzogiorno<\/b> (dél van). A létige itt sem marad el.", "Elöljárószó + névelő: <b>su + il = sul<\/b>, <b>da + il = dal<\/b>, <b>a + la = alla<\/b>. <b>salire su<\/b> = felszállni -ra, <b>scendere da<\/b> = leszállni -ról. Az irányt az ige mutatja (<b>salire<\/b> = fel, <b>scendere<\/b> = le), nem igekötő.", "Visszaható igék: <b>si siede<\/b> (leül), <b>si ferma<\/b> (megáll): <b>mi siedo, ti siedi, si siede…<\/b> A magyar igekötős ige (<i>le<\/i>ül, <i>meg<\/i>áll) gyakran olasz visszaható ige.", "Birtokos: névelő + birtokos névmás + főnév: <b>il suo posto<\/b> (az ő helye), <b>il mio, il tuo, il nostro<\/b>. Részletesen a 14. leckében.", "A melléknév egyezik: <b>il bambino è malato<\/b> / <b>la bambina è malata<\/b>. Megszólítás: <b>direttore<\/b> = igazgató úr („úr” nélkül)."], "ex1": [["Sul tram non leggo il giornale.", "A villamoson nem olvasok újságot."], ["Il nostro professore è malato.", "A tanárunk beteg."], ["Anche tu sali al terzo piano?", "Te is felmész a harmadik emeletre?"], ["A Budapest sono le sette, anche a Roma.", "Budapesten hét óra van, Rómában is."], ["Il mio posto di lavoro è vicino al ristorante.", "A munkahelyem az étterem mellett van."], ["Se non è nervosa, studia l'italiano.", "Ha nem ideges, olaszul tanul."]], "ex2": [{"hu": "Megállunk a bank előtt.", "gap": "Ci . . . . . . . . davanti alla banca", "ans": ["fermiamo"]}, {"hu": "Már öt óra van.", "gap": ". . . . già le cinque", "ans": ["Sono"]}, {"hu": "Ma a tanárok idegesek.", "gap": "Oggi i professori sono . . . . . . . .", "ans": ["nervosi"]}, {"hu": "Felmegyek a negyedik emeletre.", "gap": ". . . . . al quarto piano", "ans": ["Salgo"]}, {"hu": "A gyerekek leszállnak a buszról.", "gap": "I bambini . . . . . . . . dall'autobus", "ans": ["scendono"]}, {"hu": "Leülök, mert van időm.", "gap": "Mi . . . . . perché ho tempo", "ans": ["siedo"]}], "voc": [["le otto", "nyolc óra"], ["il lavoro", "a munka"], ["salire", "felszállni, felmenni"], ["scendere", "leszállni, lemenni"], ["il tram", "a villamos"], ["sedersi", "leülni"], ["il giornale", "az újság"], ["a piedi", "gyalog"], ["fermarsi", "megállni"], ["l'ascensore", "a lift"], ["il piano", "az emelet"], ["nervoso", "ideges"], ["malato", "beteg"], ["domani", "holnap"]]}, {"n": 10, "it": "Decima lezione", "hu": "Tizedik lecke", "title_it": "Dal dentista", "title_hu": "A fogorvosnál (-nál-a fogorvos)", "dlg": [["Il professore di ungherese^1 va dal^2 dentista.", "A magyartanár fogorvoshoz megy (A tanár -ból magyar megy -hoz-a fogorvos)."], ["Dal dentista aspettano in molti.", "A fogorvosnál sokan várnak (-nál-a fogorvos várnak -ban sokan)."], ["Si siede. Gli fa molto male il dente^3, ma bisogna^4 aspettare.", "Leül. Nagyon fáj a foga, de várni kell (Neki csinál nagyon rosszat a fog, de kell várni)."], ["Finalmente entra nello studio del medico.", "Végre bemegy az orvos szobájába (Végre bemegy -ba-a rendelő -ból-a orvos)."], ["Che cosa le fa male? Dove le fa male? A sinistra? A destra?", "Mi fáj? Hol fáj? Balra? Jobbra? (Mi önnek csinál rosszat? Hol önnek csinál rosszat?)"], ["Mi fa male sia a sinistra che a destra. Sto molto male.", "Bal oldalon is fáj, jobb oldalon is fáj. Nagyon beteg vagyok (Nekem csinál rosszat is -ra bal, mint -ra jobb. Állok nagyon rosszul)."], ["Non abbia paura^5. Le faccio un'iniezione. Va tutto bene?", "Nem kell félni. Adok egy injekciót. Minden rendben van? (Ne legyen félelme. Önnek csinálok egy injekciót. Megy minden jól?)"], ["Il dente non mi fa più male. Grazie. Quanto pago?", "Már nem fáj a fogam. Köszönöm. Mennyit fizetek? (A fog nem nekem csinál többé rosszat.)"], ["Sono cento euro. Arrivederci, a domani alle^6 cinque del pomeriggio.", "Száz eurót kérek. Viszontlátásra holnap délután ötkor (Vannak száz euró. Viszontlátásra, -ra holnap -ra-a öt -ból-a délután)."], ["Dal dentista il professore va in una pasticceria.", "A tanár a fogorvostól egy cukrászdába megy."], ["Ha molta fame^7 e vuole mangiare qualcosa.", "Nagyon éhes és enni akar valamit (Van neki sok éhség és akar enni valamit)."]], "notes": ["<b>Professore di ungherese<\/b>: a <b>di<\/b> köti össze a két főnevet: <b>libro di storia<\/b> (történelemkönyv), <b>insegnante di italiano<\/b> (olasztanár). A magyarban ez egyetlen összetett szó.", "Személyeknél a <b>da<\/b> mindhárom irányt jelöli: <b>vado dal dentista<\/b> (fogorvoshoz megyek), <b>sono dal dentista<\/b> (a fogorvosnál vagyok), <b>vengo dal dentista<\/b> (a fogorvostól jövök). Egy szó – három magyar rag!", "Fájdalom: <b>mi fa male la testa<\/b> = fáj a fejem („nekem rosszat csinál a fej”). Birtokos rag helyett részes névmás: <b>mi<\/b> (nekem), <b>ti<\/b> (neked), <b>gli<\/b> (neki, férfi), <b>le<\/b> (neki, nő; Önnek).", "<b>Bisogna<\/b> + főnévi igenév = kell: <b>bisogna aspettare<\/b> = várni kell. Személyhez kötve: <b>devo aspettare<\/b> (várnom kell).", "<b>Non abbia paura<\/b> = ne féljen (Lei-forma). <b>Avere paura<\/b> = félni („félelmet birtokolni”). Tegezve: <b>Non avere paura!<\/b>", "Időpont: <b>alle cinque<\/b> = ötkor (<b>a + le<\/b>); <b>all'una<\/b> = egykor. Mikor? = <b>A che ora?<\/b>", "<b>Avere fame<\/b> = éhesnek lenni („éhséget birtokolni”). Ugyanígy: <b>avere sete<\/b> (szomjas), <b>avere freddo<\/b> (fázik), <b>avere paura<\/b> (fél)."], "ex1": [["Non ti fa male il dente?", "Nem fáj a fogad?"], ["Non bisogna avere paura in ascensore.", "Nem kell félni a liftben."], ["I malati sono dal medico.", "A betegek az orvosnál vannak."], ["Il dentista fa un'iniezione.", "A fogorvos injekciót ad."], ["Arrivederci, a domani.", "Viszontlátásra holnap."], ["Dai Rossi andate da Pietro?", "Rossiéktól Péterhez mentek?"]], "ex2": [{"hu": "Nagyon betegek vagyunk.", "gap": "Siamo molto . . . . . . .", "ans": ["malati"]}, {"hu": "A fogorvos a cukrászdába megy.", "gap": "Il dentista va in . . . . . . . . . . . .", "ans": ["pasticceria"]}, {"hu": "Itt olaszul kell beszélni.", "gap": "Qui . . . . . . . parlare italiano", "ans": ["bisogna"]}, {"hu": "Mennyit fizetek?", "gap": ". . . . . . pago?", "ans": ["Quanto"]}, {"hu": "A férjem nem éhes.", "gap": "Mio marito non ha . . . . .", "ans": ["fame"]}, {"hu": "Nem akarnak a szállodában enni.", "gap": "Non . . . . . . . . mangiare in albergo", "ans": ["vogliono"]}], "voc": [["il dentista", "a fogorvos"], ["aspettare", "várni"], ["il dente", "a fog"], ["mi fa male", "fáj (nekem)"], ["bisogna", "kell"], ["finalmente", "végre"], ["il medico", "az orvos"], ["avere paura", "félni"], ["pagare", "fizetni"], ["il pomeriggio", "a délután"], ["la pasticceria", "a cukrászda"], ["avere fame", "éhesnek lenni"], ["mangiare", "enni"], ["qualcosa", "valami"]]}, {"n": 11, "it": "Undicesima lezione", "hu": "Tizenegyedik lecke", "title_it": "Oggi abbiamo un esame", "title_hu": "Ma vizsgázunk (Ma van-nekünk egy vizsga)", "dlg": [["Non avete paura dell'^1esame di oggi?", "Nem féltek a mai vizsgától? (Nem van-nektek félelem -tól-a vizsga -ból ma?)"], ["Sì che^2 abbiamo paura, perché il professore è molto severo.", "De félünk, mert nagyon szigorú a tanár (Igen hogy van-nekünk félelem…)."], ["A che ora avete l'esame?", "Hány órakor van a vizsgátok? (-ra melyik óra van-nektek a vizsga?)"], ["Alle quattro del pomeriggio.", "Délután négy órakor."], ["Noi l'abbiamo alle cinque, ma non di fisica^3, bensì di matematica.", "Mi öt órakor vizsgázunk, de nem fizikából, hanem matematikából (Mi azt birtokoljuk -ra-a öt…)."], ["Buongiorno, signori. Chi vuole fare l'esame di fisica? Prego, entrate e sedetevi^4.", "Jó napot, uraim. Ki akar vizsgázni fizikából? Tessék bejönni és leülni (Tessék, gyertek be és üljetek le)."], ["Professore, sono molto nervoso e mi fa male la testa.", "Tanár úr, nagyon ideges vagyok és fáj a fejem (nekem csinál rosszat a fej)."], ["Non fa niente^5, figliolo. Tutti^6 hanno paura degli esami.", "Nem baj, fiam. A vizsgáktól mindenki fél (Nem csinál semmit, fiacskám. Mindenki van-nekik félelem -tól-a vizsgák)."], ["Ma io non so niente. Torno a casa. Arrivederci.", "De én nem tudok semmit. Hazamegyek. Viszontlátásra."], ["Chi altro vuole fare l'esame di fisica?", "Ki akar még vizsgázni fizikából? (Ki más akar csinálni a vizsga -ból fizika?)"]], "notes": ["<b>Avere paura di<\/b> = félni valamitől: <b>paura dell'esame<\/b> (<b>di + l'<\/b>), <b>paura degli esami<\/b> (<b>di + gli<\/b>).", "Tagadó kérdésre ellentmondó válasz: <b>Sì che…<\/b> / <b>Certo che…<\/b> – vö. a magyar „<i>De<\/i> félünk!”", "<b>Fare l'esame di fisica<\/b> = fizikából vizsgázni. A tantárgyat a <b>di<\/b> vezeti be.", "Felszólító mód, <b>voi<\/b> (ti) alak: <b>entrate!<\/b> (gyertek be), <b>sedetevi!<\/b> (üljetek le – a visszaható névmás az ige végére tapad). Tegezve: <b>entra!<\/b>, <b>siediti!<\/b> A magyar „Tessék + főnévi igenév” helyett: <b>Prego<\/b> + felszólító mód.", "Kettős tagadás, mint a magyarban: <b>non<\/b> + ige + <b>niente<\/b>: <b>non so niente<\/b> (nem tudok semmit), <b>non fa niente<\/b> (nem baj). Ugyanígy: <b>non… mai<\/b> (soha), <b>non… nessuno<\/b> (senki).", "<b>Tutti<\/b> = mindenki, de az ige <i>többes számban<\/i> áll: <b>tutti hanno paura<\/b>."], "ex1": [["I professori oggi non fanno esami.", "A tanárok ma nem vizsgáztatnak."], ["Chi vuole sedersi?", "Ki akar leülni?"], ["L'esame non è difficile.", "A vizsga nem nehéz."], ["Il poliziotto non ha paura di niente.", "A rendőr semmitől nem fél."], ["Prego, entrate in camera.", "Tessék bejönni a szobába."], ["Torniamo a casa di mattina?", "Reggel hazamegyünk?"]], "ex2": [{"hu": "Ki akar matematikából vizsgázni?", "gap": "Chi . . . . . fare l'esame di . . . . . . . . . . ?", "ans": ["vuole", "matematica"]}, {"hu": "Tanár úr, nem fáj a fejem.", "gap": "Professore, non mi fa male la . . . . .", "ans": ["testa"]}, {"hu": "Ti is féltek az orvostól?", "gap": "Anche voi avete . . . . . del medico?", "ans": ["paura"]}, {"hu": "Délután nem akarok sétálni.", "gap": "Il . . . . . . . . . . non voglio passeggiare", "ans": ["pomeriggio"]}, {"hu": "Hány órakor megy a feleséged a bankba?", "gap": "A che . . . va in banca tua moglie?", "ans": ["ora"]}, {"hu": "Nem tudok semmit.", "gap": "Non so . . . . . .", "ans": ["niente"]}], "voc": [["l'esame", "a vizsga"], ["oggi", "ma"], ["severo", "szigorú"], ["A che ora?", "Hány órakor?"], ["la fisica", "a fizika"], ["la matematica", "a matematika"], ["entrare", "bemenni, bejönni"], ["la testa", "a fej"], ["Non fa niente.", "Nem baj."], ["tutti", "mindenki"], ["sapere (so)", "tudni (tudok)"], ["niente", "semmi"]]}, {"n": 12, "it": "Dodicesima lezione", "hu": "Tizenkettedik lecke", "title_it": "Visita guidata a Roma", "title_hu": "Városnézés Rómában (Látogatás vezetett -ra Róma)", "dlg": [["Cari turisti, siamo sul Tevere^1.", "Kedves turisták, a Tiberisnél vagyunk (Kedves turisták, vagyunk -on-a Tiberis)."], ["Questo è Ponte Sisto. Sulle due rive del Tevere, a Trastevere e in centro, passano autobus arancioni e tram verdi.", "Ez a Sisto-híd. A Tiberis két partján, Trasteverében is, a belvárosban is narancssárga buszok és zöld villamosok járnak."], ["Adesso saliamo al Campidoglio. Lì ci sono i grandi musei.", "Most felmegyünk a Capitoliumra. Ott vannak a nagy múzeumok."], ["Questa è la chiesa di Santa Maria in Aracoeli. È molto antica. Le finestre sono particolarmente belle.", "Ez az Aracoeli Szűz Mária-templom. Nagyon régi. Az ablakok különösen szépek."], ["Adesso scendiamo di nuovo verso il fiume.", "Most megint lemegyünk a folyóhoz (Most lemegyünk újra felé a folyó)."], ["Questo palazzo^2 a destra è Montecitorio, la Camera dei Deputati. È barocco.", "Ez az épület jobbra a Montecitorio, a Képviselőház. Barokk."], ["In alto a sinistra, quelli sono l'albergo Hassler e la chiesa di Trinità dei Monti.", "Balra fent az a Hassler szálloda és a Trinità dei Monti-templom (Fent -ra bal, azok vannak…)."], ["Scusi^3, perché ci sono palazzi moderni in un quartiere antico?", "Elnézést kérek, miért vannak modern épületek egy régi városrészben?"], ["Perché anche qui la gente^4 vive e lavora. Nella capitale italiana non ci sono solo monumenti.", "Mert itt is emberek élnek és dolgoznak (Mert itt is a nép él és dolgozik). Az olasz fővárosban nemcsak műemlékek vannak."], ["Quanti abitanti ha Roma?", "Hányan laknak Rómában? (Hány lakost birtokol Róma?)"], ["Roma ha quasi tre milioni di^5 abitanti. L'Italia ne ha^6 sessanta milioni.", "Rómának majdnem hárommillió lakosa van. Olaszországnak hatvanmillió (Olaszország abból birtokol hatvan milliót)."], ["Signore e signori, la visita è finita.", "Hölgyeim és uraim, a városnézésnek vége (a látogatás van befejezve)."]], "notes": ["<b>sul Tevere<\/b> = <b>su + il<\/b>. A folyónevek hímneműek és névelővel állnak: <b>il Tevere<\/b> (Tiberis), <b>il Danubio<\/b> (Duna), <b>il Po<\/b>.", "<b>questo<\/b> (közeli) / <b>quello<\/b> (távoli), mint <b>ez / az<\/b>: <b>questo palazzo<\/b> (ez az épület), <b>quel palazzo<\/b> (az az épület), <b>quelli<\/b> (azok). Névelő nem kell!", "<b>Scusi<\/b> = elnézést (Lei-forma); tegezve <b>scusa<\/b>.", "<b>La gente<\/b> = az emberek, de nyelvtanilag <i>egyes számú nőnem<\/i>: <b>la gente vive<\/b> (élnek az emberek).", "<b>milione<\/b> után <b>di<\/b>: <b>tre milioni di abitanti<\/b>. A <b>cento<\/b> és <b>mille<\/b> után nincs <b>di<\/b>: <b>cento euro<\/b>, <b>mille persone<\/b>.", "Birtoklás: <b>Roma ha…<\/b> („Róma birtokol”) – a magyar <i>-nak van<\/i> helyett <b>avere<\/b>. A <b>ne<\/b> = abból, belőle: <b>ne ha sessanta milioni<\/b> = (lakosból) hatvanmillió van neki."], "ex1": [["Quello a destra non è il Senato.", "Az ott jobbra nem a Szenátus."], ["Nella capitale ungherese ci sono i tram.", "A magyar fővárosban vannak villamosok."], ["Quante persone lavorano al ristorante?", "Hányan dolgoznak az étteremben?"], ["Anche voi scendete al fiume?", "Ti is lementek a folyóhoz?"], ["Scusi, dov'è l'albergo?", "Elnézést kérek, hol van a szálloda?"], ["Questo libro è particolarmente interessante.", "Ez a könyv különösen érdekes."]], "ex2": [{"hu": "Ez az épület jobbra a bank.", "gap": ". . . . . . palazzo a destra è la banca", "ans": ["Questo"]}, {"hu": "A fővárosnak tízmillió lakosa van.", "gap": "La capitale ha dieci . . . . . . . di abitanti", "ans": ["milioni"]}, {"hu": "A templom messze van?", "gap": "La chiesa è . . . . . . . ?", "ans": ["lontana"]}, {"hu": "A műemlékek fent vannak.", "gap": "I . . . . . . . . . sono in alto", "ans": ["monumenti"]}, {"hu": "Elnézést, hova megy ez a busz?", "gap": ". . . . . , dove va questo autobus?", "ans": ["Scusi"]}, {"hu": "A rendőr felmegy a harmadik emeletre.", "gap": "Il poliziotto . . . . al terzo piano", "ans": ["sale"]}], "voc": [["il turista", "a turista"], ["il fiume", "a folyó"], ["il ponte", "a híd"], ["la riva", "a part"], ["il museo", "a múzeum"], ["la chiesa", "a templom"], ["antico", "régi"], ["il palazzo", "az épület, a palota"], ["in alto", "fent"], ["Scusi!", "Elnézést!"], ["la gente", "az emberek"], ["la capitale", "a főváros"], ["l'abitante", "a lakos"], ["il monumento", "a műemlék"]]}, {"n": 13, "it": "Tredicesima lezione", "hu": "Tizenharmadik lecke", "title_it": "Fatti suoi", "title_hu": "Magánügy (Tények az övéi)", "dlg": [["Che cosa fa Giuseppe Fiore dalla mattina alla sera^1?", "Mit csinál Fiore József reggeltől estig?"], ["La mattina si alza alle sette. Si lava, si veste^2, fa colazione e legge il giornale.", "Reggel hétkor felkel. Mosakszik, felöltözik, reggelizik és újságot olvas (Magát felemeli… magát mossa, magát öltözteti, csinál reggelit…)."], ["Poi scende in strada. Sale sull'autobus e scende davanti alla fabbrica.", "Aztán lemegy az utcára. Felszáll a buszra és leszáll a gyár előtt."], ["Dalle otto alle cinque lavora in fabbrica accanto a una macchina.", "Nyolctól ötig dolgozik a gyárban egy gép mellett."], ["A mezzogiorno, alle dodici in punto, pranza, poi beve un caffè al bar^3.", "Délben, pontosan tizenkét órakor ebédel, majd iszik egy kávét a büfében."], ["Il pomeriggio è già molto stanco e nervoso.", "Délután már nagyon fáradt és ideges."], ["Alle otto di sera torna a casa, cena, guarda la tv, si spoglia e va a letto.", "Este nyolckor hazamegy, vacsorázik, tévét néz, levetkőzik, lefekszik (…megy -ba ágy)."], ["Di notte dorme^4 a casa.", "Éjjel otthon alszik."], ["Ma che cosa fa Giuseppe Fiore dalle cinque del pomeriggio alle otto di sera?", "De mit csinál Fiore József délután öttől este nyolcig?"], ["Sono fatti suoi^5.", "Ez magánügy (Vannak tények az övéi)."]], "notes": ["<b>da… a…<\/b> = -tól/-től …-ig: <b>dalla mattina alla sera<\/b> (reggeltől estig), <b>dalle otto alle cinque<\/b> (nyolctól ötig: <b>da + le<\/b>, <b>a + le<\/b>).", "Visszaható igék (vö. 9. lecke): <b>alzarsi<\/b> (felkelni) – <b>mi alzo, ti alzi, si alza…<\/b>; <b>lavarsi<\/b> (mosakodni), <b>vestirsi<\/b> (felöltözni), <b>spogliarsi<\/b> (levetkőzni). A magyar <i>-kodik / -kőzik<\/i> ige gyakran olasz visszaható ige.", "<b>Il bar<\/b> = kávézó-büfé, ahol az olaszok gyakran állva isszák a kávét. <b>Un caffè<\/b> = egy eszpresszó! <b>Bere<\/b> (inni) rendhagyó: <b>bevo, bevi, beve…<\/b>", "<b>-ire<\/b> igék: <b>dormire<\/b> – <b>dormo, dormi, dorme, dormiamo, dormite, dormono<\/b>.", "<b>Sono fatti suoi<\/b> = ez az ő dolga („az ő ügyei”); <b>fatti miei<\/b> = az én dolgom. Gyakori, kicsit nyers kifejezés."], "ex1": [["Quest'uomo non si lava.", "Ez az ember nem mosakszik."], ["Il caffè è particolarmente buono.", "A kávé különösen jó."], ["Dal medico il professore si spoglia.", "A tanár levetkőzik az orvosnál."], ["In fabbrica non c'è il bar.", "Nincs büfé a gyárban."], ["Dalle tre alle sei sono in chiesa.", "Háromtól hatig a templomban vagyok."], ["Bambini, chi vuole guardare la tv?", "Gyerekek, ki akar tévét nézni?"]], "ex2": [{"hu": "A család nem alszik.", "gap": "La famiglia non . . . . .", "ans": ["dorme"]}, {"hu": "Itt sokan beszélnek olaszul.", "gap": "Qui in . . . . . parlano italiano", "ans": ["molti"]}, {"hu": "A férjek nagyon fáradtak.", "gap": "I mariti sono molto . . . . . . .", "ans": ["stanchi"]}, {"hu": "Petike nem akar kilenctől tízig dolgozni.", "gap": "Pierino non vuole lavorare . . . . . nove . . . . dieci", "ans": ["dalle", "alle"]}, {"hu": "Ez az ő dolga.", "gap": "Sono fatti . . . . .", "ans": ["suoi"]}, {"hu": "A feleségem nem ebédel és nem vacsorázik.", "gap": "Mia moglie non . . . . . . e non . . . . .", "ans": ["pranza", "cena"]}], "voc": [["alzarsi", "felkelni"], ["lavarsi", "mosakodni"], ["vestirsi", "felöltözni"], ["fare colazione", "reggelizni"], ["la fabbrica", "a gyár"], ["la macchina", "a gép"], ["mezzogiorno", "dél"], ["pranzare", "ebédelni"], ["il caffè", "a kávé"], ["stanco", "fáradt"], ["cenare", "vacsorázni"], ["andare a letto", "lefeküdni"], ["dormire", "aludni"], ["la notte", "az éjszaka"]]}, {"n": 14, "it": "Quattordicesima lezione", "hu": "Tizennegyedik lecke", "title_it": "Ripasso", "title_hu": "Ismétlés", "ripasso": true, "sections": [["1 Az ige", ["<b>1.1 Visszaható igék.<\/b> <b>alzarsi, sedersi, fermarsi, lavarsi, vestirsi, spogliarsi<\/b>: a visszaható névmás (<b>mi, ti, si, ci, vi, si<\/b>) az ige <i>előtt<\/i> áll: <b>mi alzo<\/b> (felkelek). Felszólító módban az ige végére tapad: <b>sedetevi!<\/b>", "<b>1.2 Igekötők helyett.<\/b> Ahol a magyar igekötőt használ (<i>fel<\/i>megy, <i>le<\/i>megy, <i>be<\/i>megy, <i>ki<\/i>megy), az olasz többnyire külön igét: <b>salire, scendere, entrare, uscire<\/b>; vagy visszaható igét: <b>sedersi<\/b> (leül), <b>fermarsi<\/b> (megáll).", "<b>1.3 Három igecsoport.<\/b> <b>-are<\/b> (parlare), <b>-ere<\/b> (leggere), <b>-ire<\/b> (dormire). Néhány új rendhagyó ige a táblázatban."]], ["TABLE", [["", "alzarsi", "dormire", "uscire", "volere"], ["io", "mi alzo", "dormo", "esco", "voglio"], ["tu", "ti alzi", "dormi", "esci", "vuoi"], ["lui/lei", "si alza", "dorme", "esce", "vuole"], ["noi", "ci alziamo", "dormiamo", "usciamo", "vogliamo"], ["voi", "vi alzate", "dormite", "uscite", "volete"], ["loro", "si alzano", "dormono", "escono", "vogliono"]], "Igeragozás"], ["2 Hol? Hová? Honnan?", ["A magyarban kilenc helyhatározó rag van; az olasz nem választja szét a helyet és az irányt (<b>dove?<\/b> = hol? és hová?). Csak a „honnan?” kap külön elöljárót: <b>da<\/b>."]], ["TABLE", [["", "Hová? / Hol?", "Honnan?"], ["ország, helyiség", "in Italia, in banca", "dall'Italia, dalla banca"], ["város", "a Roma", "da Roma"], ["felület", "sul tram", "dal tram"], ["személy", "dal medico", "dal medico"]], "Helyhatározók"], ["3 Birtokos névmások", ["Névelő + birtokos névmás + főnév; a névmás a <i>birtokhoz<\/i> igazodik, nem a birtokoshoz: <b>la sua casa<\/b> = az ő háza (férfié vagy nőé egyaránt). Családtagnál egyes számban nincs névelő: <b>mia moglie, suo marito<\/b>; de: <b>il loro figlio<\/b>."]], ["TABLE", [["", "libro (hímn.)", "casa (nőn.)"], ["az enyém", "il mio libro", "la mia casa"], ["a tiéd", "il tuo libro", "la tua casa"], ["az övé", "il suo libro", "la sua casa"], ["a miénk", "il nostro libro", "la nostra casa"], ["a tiétek", "il vostro libro", "la vostra casa"], ["az övék", "il loro libro", "la loro casa"]], "Birtokos névmás"], ["4 Számnév után", ["A magyarral ellentétben számnév után <i>többes szám<\/i>: <b>due assegni<\/b> (két csekk), <b>tre milioni di abitanti<\/b>. Az <b>euro<\/b> változatlan: <b>cento euro<\/b>."]]], "dlg": [["In banca chiediamo dei contanti.", "A bankban készpénzt kérünk."], ["I turisti non fanno esami.", "A turisták nem vizsgáznak."], ["Già in pasticceria mi fa male il dente.", "Már a cukrászdában fáj a fogam."], ["Passeggio a piedi sul ponte.", "Gyalog sétálok a hídon."], ["Alle quattro del pomeriggio il professore di ungherese ha già molta fame.", "Délután négy órakor már nagyon éhes a magyartanár."], ["Che fai stasera? – Fatti miei.", "Mit csinálsz ma este? – Ez magánügy."], ["Sono stanco perché lavoro molto.", "Fáradt vagyok, mert sokat dolgozom."], ["Oggi il medico è nervoso.", "Az orvos ma ideges."], ["Mi fermo davanti al palazzo.", "Megállok az épület előtt."], ["La mattina andiamo al fiume.", "Délelőtt a folyóhoz megyünk."]], "voc": [["mi alzo", "felkelek"], ["esco", "kimegyek"], ["dormo", "alszom"], ["voglio", "akarok"], ["il mio / la mia", "az enyém"], ["da (+ személy)", "-nál, -hoz, -tól"]]}]</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const store={get(k,d){try{const v=localStorage.getItem('olaszora:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('olaszora:'+k,JSON.stringify(v))}catch(e){}}};
const st={n:store.get('n',DATA[0].n),done:store.get('done',[]),boxes:store.get('boxes',{}),due:store.get('due',{}),days:store.get('days',[]),showHu:false};
let dir=store.get('dir','it'),scope=store.get('scope','learned'),theme=store.get('theme','');
let deck=[],cur=0,flipped=false,deckKey='',q='',qn=0;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const escA=s=>esc(s).replace(/"/g,'&quot;');
const calc=s=>s.replace(/\(([^)]*)\)/g,'<i>($1)</i>');
const clean=s=>s.replace(/\^\d+/g,'');
const refs=s=>s.replace(/\^(\d+)/g,'<button class="ref" type="button" data-note="$1" aria-label="$1. jegyzet">$1</button>');
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’`]/g,"'").replace(/\s+/g,' ').trim();
const accentOk=(a,b)=>a.toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g,' ').trim()===b.toLowerCase();
const byN=n=>DATA.find(d=>d.n===n);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const name=d=>d.ripasso?'Ismétlés':d.title_it;

/* Idő: napok sorszáma (helyi naptár szerint) */
const dayNum=(d=new Date())=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const iso=k=>new Date(k*864e5).toISOString().slice(0,10);
function mark(){const t=iso(dayNum());if(!st.days.includes(t))st.days=[...st.days,t].slice(-400)}
function streak(){const s=new Set(st.days);let k=dayNum();if(!s.has(iso(k)))k--;let c=0;while(s.has(iso(k))){c++;k--}return c}
function save(){store.set('n',st.n);store.set('done',st.done);store.set('boxes',st.boxes);store.set('due',st.due);store.set('days',st.days);store.set('dir',dir);store.set('scope',scope);store.set('theme',theme)}

/* Kártyák: azonosító "<lecke>:<olasz szó>" */
function allCards(){const c=[];DATA.forEach(d=>d.voc.forEach(([it,hu])=>c.push({id:d.n+':'+it,it,hu,n:d.n})));return c}
const learnedMax=()=>Math.max(st.n,...st.done,DATA[0].n);
const learnedCards=()=>{const m=learnedMax();return allCards().filter(c=>c.n<=m)};
const box=c=>Math.min(3,st.boxes[c.id]||0);
const isDue=c=>(st.due[c.id]??0)<=dayNum();
function scopeCards(){if(scope==='lesson')return allCards().filter(c=>c.n===st.n);if(scope==='all')return allCards();return learnedCards()}
function nextLesson(){const d=byN(st.n);if(d&&!st.done.includes(d.n))return d;return DATA.find(x=>x.n>st.n&&!st.done.includes(x.n))||DATA.find(x=>!st.done.includes(x.n))||null}
const LV=['új','1×','2×','tudom'];
const lvTag=b=>b>=3?`<span class="tag ok">${ico('check')}tudom</span>`:b>0?`<span class="tag cur">${b}× tudtam</span>`:'<span class="tag new">új</span>';

/* Ikonok (körvonalas, 24-es rács) */
const P={
  ma:'<path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v11.5h13V9"/><path d="M10 20.5v-6h4v6"/>',
  leckek:'<path d="M4 5.5A2 2 0 0 1 6 3.5h14v14H6a2 2 0 0 0-2 2z"/><path d="M4 19.5a2 2 0 0 0 2 2h14v-4"/><path d="M8.5 8h7M8.5 11.5h5"/>',
  kartyak:'<rect x="3" y="7" width="13.5" height="14" rx="2"/><path d="M7.5 3.5H19a2 2 0 0 1 2 2V17"/>',
  szotar:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>',
  chev:'<path d="m9 6 6 6-6 6"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>'
};
const ico=k=>`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>`;

/* Téma */
const mq=matchMedia('(prefers-color-scheme: dark)');
const isDark=()=>theme?theme==='dark':mq.matches;
function applyTheme(){
  if(theme)document.documentElement.dataset.theme=theme;else delete document.documentElement.dataset.theme;
  document.querySelector('meta[name="theme-color"]').content=isDark()?'#141517':'#f6f5f0';
  document.querySelectorAll('.theme-btn').forEach(b=>{b.innerHTML=ico(isDark()?'sun':'moon')+`<span>${isDark()?'Világos mód':'Sötét mód'}</span>`;b.setAttribute('aria-label',isDark()?'Váltás világos módra':'Váltás sötét módra')});
}
document.querySelectorAll('.theme-btn').forEach(b=>b.onclick=()=>{theme=isDark()?'light':'dark';save();applyTheme()});
mq.addEventListener&&mq.addEventListener('change',applyTheme);

/* Váz: navigáció és haladás */
const NAV=[['ma','Ma'],['leckek','Leckék'],['kartyak','Szókártyák'],['szotar','Szótár']];
function shell(page){
  const due=learnedCards().filter(isDue).length;
  const links=NAV.map(([k,l])=>`<a href="#${k}"${page===k?' aria-current="page"':''}>${ico(k)}<span>${l}</span>${k==='kartyak'&&due?`<span class="count" title="${due} kártya esedékes">${due}</span>`:''}</a>`).join('');
  document.getElementById('nav').innerHTML=links;
  document.getElementById('tabbar').innerHTML=links;
  const p=Math.round(st.done.length/DATA.length*100);
  document.getElementById('side-prog').innerHTML=`<div><span>Haladás</span><b>${st.done.length} / ${DATA.length} lecke</b></div><div class="meter" role="progressbar" aria-label="Elvégzett leckék" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div><div><span>Napi sorozat</span><b>${streak()} nap</b></div>`;
}

/* Útvonalak: #ma #leckek #lecke-N[/gyakorlatok|/szavak|/parbeszed] #kartyak #szotar */
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  const m=h.match(/^lecke-(\d+)(?:\/([a-z]+))?$/);
  if(m&&byN(+m[1]))return{page:'lecke',n:+m[1],sub:m[2]||''};
  return{page:['leckek','kartyak','szotar'].includes(h)?h:'ma'};
}
const VIEWS={ma:viewToday,leckek:viewLessons,lecke:viewLesson,kartyak:viewCards,szotar:viewDict};
const TITLES={ma:'Ma',leckek:'Leckék',kartyak:'Szókártyák',szotar:'Szótár'};
function render(nav){
  const r=route(),v=document.getElementById('view');
  if(r.page==='lecke'&&st.n!==r.n){st.n=r.n;st.showHu=false}
  if(nav&&r.page==='kartyak')deckKey='';
  shell(r.page==='lecke'?'leckek':r.page);
  VIEWS[r.page](v,r);
  save();
  if(nav){
    document.title=(r.page==='lecke'?`${r.n}. lecke – ${name(byN(r.n))}`:TITLES[r.page])+' · Olaszóra';
    window.scrollTo(0,0);v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');
    v.focus({preventScroll:true});
  }
}

/* Ma */
function viewToday(v){
  const d=nextLesson(),cards=learnedCards(),due=cards.filter(isDue).length,all=allCards();
  const known=all.filter(c=>box(c)>=3).length,cnt=[0,1,2,3].map(b=>cards.filter(c=>box(c)===b).length);
  const date=cap(new Date().toLocaleDateString('hu-HU',{weekday:'long',month:'long',day:'numeric'}));
  let h=`<header class="ph"><div><h1>Mai tanulás</h1><p class="lead">${date}</p></div></header><div class="grid two">`;
  if(d){
    h+=`<section class="sheet cont" aria-labelledby="h-next"><h2 class="ptitle" id="h-next">${st.done.length?'Következő lecke':'Kezdje itt'}</h2>
    <p class="kicker">${d.n}. lecke · ${d.it}</p><p class="big" lang="it">${esc(d.title_it)}</p><p class="hut">${d.ripasso?esc(d.title_hu):calc(esc(d.title_hu))}</p>
    <div class="preview" lang="it">${d.dlg.slice(0,2).map(x=>`<p>${esc(clean(x[0]))}</p>`).join('')}</div>
    <p class="meta">${d.dlg.length} mondat · ${d.notes?d.notes.length+' jegyzet':'nyelvtani összefoglaló'} · ${d.voc.length} szó</p>
    <div class="actions"><a class="btn primary" href="#lecke-${d.n}">Lecke megnyitása</a>${d.ex1?`<a class="btn" href="#lecke-${d.n}/gyakorlatok">Gyakorlatok</a>`:''}</div></section>`;
  }else{
    h+=`<section class="sheet cont" aria-labelledby="h-next"><h2 class="ptitle" id="h-next">Minden lecke kész</h2><p class="big">Bravissima!</p><p class="hut">Mind a ${DATA.length} leckét elvégezte. A szókártyákkal tarthatja frissen a szavakat.</p><div class="actions"><a class="btn primary" href="#kartyak">Szókártyák</a><a class="btn" href="#leckek">Leckék</a></div></section>`;
  }
  h+=`<section class="panel review" aria-labelledby="h-rev"><h2 class="ptitle" id="h-rev">Szókártyák</h2>
    <p class="figure">${due}</p><p class="muted" style="margin:0">kártya esedékes ma, ${learnedMax()>DATA[0].n?`az 1–${learnedMax()}.`:'az 1.'} leckéből</p>
    <div class="stack" aria-hidden="true">${cnt.map((c,i)=>c?`<i class="l${i}" style="flex:${c}"></i>`:'').join('')}</div>
    <ul class="legend">${cnt.map((c,i)=>`<li><i class="l${i}"></i>${cap(LV[i])}<b>${c}</b></li>`).join('')}</ul>
    <a class="btn" href="#kartyak">Ismétlés indítása</a></section></div>`;
  h+=`<dl class="panel kpis grid" aria-label="Összesítés">
    <div><dt>Kész leckék</dt><dd>${st.done.length} <small>/ ${DATA.length}</small></dd></div>
    <div><dt>Megtanult szavak</dt><dd>${known} <small>/ ${all.length}</small></dd></div>
    <div><dt>Napi sorozat</dt><dd>${streak()} <small>nap</small></dd></div>
    <div><dt>Tanulási napok</dt><dd>${st.days.length} <small>összesen</small></dd></div></dl>`;
  const weeks=[];for(let i=0;i<DATA.length;i+=7)weeks.push(DATA.slice(i,i+7));
  h+=`<div class="grid two"><section class="panel" aria-labelledby="h-course"><div class="phead"><h2 class="ptitle" id="h-course">A kurzus</h2><span>${st.done.length} / ${DATA.length} kész</span></div>`+
    weeks.map((w,i)=>`<div class="wk"><div class="wk-l"><span>${i+1}. hét</span><span>${w.filter(d=>st.done.includes(d.n)).length} / ${w.length}</span></div><div class="cells">${w.map(d=>{const ok=st.done.includes(d.n);return `<a class="cell${ok?' ok':''}${d.n===st.n?' cur':''}${d.ripasso?' rip':''}" href="#lecke-${d.n}" aria-label="${d.n}. lecke: ${escA(name(d))}${ok?', kész':''}"><b>${d.n}</b><small>${d.ripasso?'ismétlés':ok?'kész':''}</small></a>`}).join('')}</div></div>`).join('')+`</section>`;
  const t=dayNum(),wd=(new Date().getDay()+6)%7,start=t-wd-21,ds=new Set(st.days);let n4=0;
  const cells=Array.from({length:28},(_,i)=>{const k=start+i;const on=ds.has(iso(k));if(on&&k<=t)n4++;return `<i class="${k>t?'fut':on?'on':''}${k===t?' today':''}" title="${iso(k)}"></i>`}).join('');
  h+=`<section class="panel" aria-labelledby="h-cal"><div class="phead"><h2 class="ptitle" id="h-cal">Az elmúlt négy hét</h2></div><div class="cal" aria-hidden="true">${['H','K','Sze','Cs','P','Szo','V'].map(x=>`<span>${x}</span>`).join('')}${cells}</div><p class="cal-note"><b>${n4}</b> tanulási nap az elmúlt négy hétben. A mai nap piros keretet kap.</p></section></div>`;
  v.innerHTML=h;
}

/* Leckék */
function viewLessons(v){
  let h=`<header class="ph"><div><h1>Leckék</h1><p class="lead">${DATA.length} lecke, hetente hat új lecke és egy ismétlés</p></div></header>`;
  for(let i=0;i<DATA.length;i+=7){
    const w=DATA.slice(i,i+7),dn=w.filter(d=>st.done.includes(d.n)).length;
    h+=`<section class="week" aria-labelledby="w${i}"><div class="week-h"><h2 id="w${i}">${i/7+1}. hét</h2><div><span>${dn} / ${w.length} kész</span><span class="meter" aria-hidden="true"><i style="width:${dn/w.length*100}%"></i></span></div></div><div class="list">`+
    w.map(d=>{const ok=st.done.includes(d.n);return `<a class="lrow" href="#lecke-${d.n}"><span class="no">${d.n}</span><span><span class="t" lang="it">${esc(name(d))}</span><span class="s" style="display:block">${d.ripasso?esc(d.title_it):calc(esc(d.title_hu))}</span></span><span class="m"><span class="n">${d.dlg.length} mondat · ${d.voc.length} szó</span>${ok?`<span class="tag ok">${ico('check')}Kész</span>`:d.n===st.n?'<span class="tag cur">Folyamatban</span>':d.ripasso?'<span class="tag rip">Ismétlés</span>':''}</span><span class="chev">${ico('chev')}</span></a>`}).join('')+`</div></section>`;
  }
  v.innerHTML=h;
}

/* Egy lecke */
function viewLesson(v,r){
  const d=byN(r.n),rip=!!d.ripasso,done=st.done.includes(d.n),idx=DATA.indexOf(d);
  const subs=rip?[['','Összefoglaló'],['parbeszed','Párbeszéd'],['szavak','Szavak']]:[['','Párbeszéd'],['gyakorlatok','Gyakorlatok'],['szavak','Szavak']];
  const sub=subs.some(s=>s[0]===r.sub)?r.sub:'';
  let h=`<nav class="crumbs" aria-label="Hely"><a href="#leckek">Leckék</a><span aria-hidden="true">/</span><span>${d.n}. lecke</span></nav>
  <header class="ph"><div><p class="kicker">${d.it} · ${d.hu}</p><h1 lang="it">${esc(d.title_it)}</h1><p class="lead">${calc(esc(d.title_hu))}</p></div>
  <button class="btn${done?' done':''}" id="dn" type="button" aria-pressed="${done}">${done?ico('check')+'Kész':'Megjelölöm késznek'}</button></header>
  <nav class="tabs" aria-label="A lecke részei">${subs.map(([k,l])=>`<a href="#lecke-${d.n}${k?'/'+k:''}"${k===sub?' aria-current="page"':''}>${l}${k==='szavak'?`<span class="c">${d.voc.length}</span>`:k==='gyakorlatok'?`<span class="c">${d.ex1.length+d.ex2.length}</span>`:''}</a>`).join('')}</nav>`;
  if(sub==='szavak')h+=wordsHTML(d);
  else if(sub==='gyakorlatok')h+=exHTML(d);
  else if(rip&&sub==='')h+=ripHTML(d);
  else h+=dlgHTML(d,rip);
  const pv=DATA[idx-1],nx=DATA[idx+1];
  h+=`<nav class="pager" aria-label="Leckék lapozása">${pv?`<a href="#lecke-${pv.n}"><small>← Előző: ${pv.n}. lecke</small><b lang="it">${esc(name(pv))}</b></a>`:''}${nx?`<a class="next" href="#lecke-${nx.n}"><small>Következő: ${nx.n}. lecke →</small><b lang="it">${esc(name(nx))}</b></a>`:''}</nav>`;
  v.innerHTML=h;
  v.querySelector('#dn').onclick=()=>{st.done=done?st.done.filter(x=>x!==d.n):[...st.done,d.n];mark();render()};
  v.querySelectorAll('[data-hu]').forEach(b=>b.onclick=()=>{st.showHu=b.dataset.hu==='1';render()});
  v.querySelectorAll('.hu.hidden').forEach(e=>{const show=()=>{e.classList.remove('hidden');e.removeAttribute('role');e.removeAttribute('tabindex');e.removeAttribute('aria-label')};e.onclick=show;e.onkeydown=k=>{if(k.key==='Enter'||k.key===' '){k.preventDefault();show()}}});
  v.querySelectorAll('.ref').forEach(b=>b.onclick=()=>{const li=v.querySelector('#note-'+b.dataset.note);if(!li)return;li.classList.add('hl');li.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});setTimeout(()=>li.classList.remove('hl'),1800)});
  const wk=v.querySelector('#wk');if(wk)wk.onclick=()=>{scope='lesson';save();location.hash='#kartyak'};
  if(sub==='gyakorlatok')bindEx(v,d);
}
function dlgHTML(d,rip){
  let h=`<div class="bar"><div class="seg" role="group" aria-label="Fordítás"><button type="button" data-hu="1" aria-pressed="${st.showHu}">Fordítással</button><button type="button" data-hu="0" aria-pressed="${!st.showHu}">Fordítás nélkül</button></div><span class="muted">${rip?'Ismétlő gyakorlat: fordítsa le fejben mind a '+d.dlg.length+' mondatot, aztán ellenőrizze.':st.showHu?'A zárójeles dőlt rész szó szerinti fordítás.':'Koppintson a kék sávra egy mondat fordításáért.'}</span></div>`;
  h+=`<div class="lesson-grid${d.notes?' has-notes':''}"><div class="sheet"><ol class="dlg">${d.dlg.map(([it,hu],i)=>`<li><span class="num">${i+1}</span><p class="it" lang="it">${refs(esc(it))}</p><p class="hu${st.showHu?'':' hidden'}"${st.showHu?'':' role="button" tabindex="0" aria-label="Fordítás megjelenítése"'}>${calc(esc(hu))}</p></li>`).join('')}</ol></div>`;
  if(d.notes)h+=`<aside class="notes" aria-labelledby="h-notes"><h2 id="h-notes">Jegyzetek</h2><ol>${d.notes.map((n,i)=>`<li id="note-${i+1}">${n}</li>`).join('')}</ol></aside>`;
  return h+'</div>';
}
function ripHTML(d){
  return '<section class="panel rip">'+d.sections.map(([t,it,tt])=>{
    if(t==='TABLE')return `<h2>${tt||'Rendhagyó igék'}</h2><div class="tablewrap"><table class="conj">${it.map((r,i)=>'<tr>'+r.map((c,j)=>i===0||j===0?`<th>${c}</th>`:`<td>${c}</td>`).join('')+'</tr>').join('')}</table></div>`;
    return `<h2>${t}</h2>`+it.map(p=>`<p>${p}</p>`).join('')}).join('')+'</section>';
}
function wordsHTML(d){
  return `<div class="bar"><span class="muted">${d.voc.length} szó ebből a leckéből</span><button class="btn sm" id="wk" type="button">${ico('kartyak')}Gyakorlás szókártyákkal</button></div>
  <div class="panel flush"><table class="words"><thead><tr><th>Olasz</th><th>Magyar</th><th class="r">Szint</th></tr></thead><tbody>${d.voc.map(([it,hu])=>`<tr><td class="it" lang="it">${esc(it)}</td><td class="hu">${esc(hu)}</td><td class="lv">${lvTag(box({id:d.n+':'+it}))}</td></tr>`).join('')}</tbody></table></div>`;
}
function exHTML(d){
  let h=`<section class="panel ex ex1"><h2>1. gyakorlat – Fordítsa le</h2><ol>`+d.ex1.map(([it,hu],i)=>`<li><span class="q1" lang="it">${esc(it)}</span><button class="btn sm" type="button" data-r="${i}">Megoldás</button><span class="ans" id="a${i}" hidden>${esc(hu)}</span></li>`).join('')+'</ol></section>';
  h+=`<section class="panel ex ex2"><h2>2. gyakorlat – Egészítse ki</h2><p class="muted" style="margin:0 0 6px">Írja be a hiányzó olasz szavakat. Minden pont egy betű.</p>`;
  d.ex2.forEach((r,ri)=>{let k=0;const line=esc(r.gap).replace(/(?:^|(?<=[\s']))\.(?: \.)*/g,m=>{const len=(m.match(/\./g)||[]).length;const id=`g${ri}_${k++}`;return `<input id="${id}" size="${Math.max(3,len+1)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="hiányzó szó (${len} betű)">`});
    h+=`<div class="row"><div class="q">${ri+1}. ${esc(r.hu)}</div><div class="line" lang="it">${line}<span class="fb" id="fb${ri}"></span></div></div>`});
  return h+`<div class="actions"><button class="btn primary" id="chk" type="button">Ellenőrzés</button><button class="btn" id="shw" type="button">Megoldások</button></div></section>`;
}
function bindEx(v,d){
  v.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{document.getElementById('a'+b.dataset.r).hidden=false;b.remove()});
  v.querySelector('#chk').onclick=()=>{ let ok=0,tot=0; d.ex2.forEach((r,ri)=>{ let good=true; const fb=document.getElementById('fb'+ri); fb.textContent=''; r.ans.forEach((a,k)=>{const el=document.getElementById(`g${ri}_${k}`);tot++;const val=el.value; const exact=accentOk(val,a); const loose=norm(val)===norm(a); el.className=exact?'ok':(loose?'ok':'no'); if(exact||loose) ok++; else good=false; if(loose&&!exact) fb.textContent='ékezet: '+a;}); if(good&&!fb.textContent) fb.textContent='✓'; }); v.querySelector('#chk').textContent=`Ellenőrzés (${ok}/${tot})`; mark(); save(); shell('leckek'); };
  v.querySelector('#shw').onclick=()=>d.ex2.forEach((r,ri)=>r.ans.forEach((a,k)=>{const el=document.getElementById(`g${ri}_${k}`);el.value=a;el.className=''}));
}

/* Szókártyák: Leitner-dobozok 0–3, esedékesség: 0, 1, 3, 7 nap */
const GAP=[0,1,3,7];
function buildDeck(){const t=dayNum();deck=scopeCards().map(c=>({c,r:Math.random()})).sort((a,b)=>{const ad=(st.due[a.c.id]??0)<=t?0:1,bd=(st.due[b.c.id]??0)<=t?0:1;return ad-bd||box(a.c)-box(b.c)||(st.due[a.c.id]??0)-(st.due[b.c.id]??0)||a.r-b.r}).map(x=>x.c);cur=0;flipped=false}
function flip(){flipped=!flipped;render();const fc=document.getElementById('fc');if(fc){fc.classList.add('flip')}}
function answer(ok){const c=deck[cur];if(!c)return;const b=ok?Math.min(3,(st.boxes[c.id]||0)+1):0;st.boxes[c.id]=b;st.due[c.id]=dayNum()+GAP[b];cur=(cur+1)%deck.length;flipped=false;mark();render();const fc=document.getElementById('fc');if(fc)fc.focus({preventScroll:true})}
function viewCards(v){
  const key=scope+'|'+st.n+'|'+dir;if(key!==deckKey||!deck.length){buildDeck();deckKey=key}
  const c=deck[cur],qx=dir==='it'?c.it:c.hu,ax=dir==='it'?c.hu:c.it;
  const cnt=[0,1,2,3].map(b=>deck.filter(x=>box(x)===b).length),dueN=deck.filter(isDue).length;
  const sc=[['learned',`Eddigi leckék (1–${learnedMax()}.)`],['lesson',`Csak a ${st.n}. lecke`],['all','Mind']];
  v.innerHTML=`<header class="ph"><div><h1>Szókártyák</h1><p class="lead">Amit tud, egyre ritkábban jön elő: 1, 3, majd 7 nap múlva.</p></div></header>
  <div class="bar"><div class="seg" role="group" aria-label="Melyik szavak">${sc.map(([k,l])=>`<button type="button" data-sc="${k}" aria-pressed="${scope===k}">${l}</button>`).join('')}</div>
  <div class="seg" role="group" aria-label="Irány"><button type="button" data-dir="it" aria-pressed="${dir==='it'}">olasz → magyar</button><button type="button" data-dir="hu" aria-pressed="${dir==='hu'}">magyar → olasz</button></div></div>
  <div class="cards-layout"><div class="stage">
    <div class="deckbar"><span>${cur+1} / ${deck.length}</span><div class="meter" aria-hidden="true"><i style="width:${(cur+1)/deck.length*100}%"></i></div></div>
    <div class="fcard" id="fc" tabindex="0" role="button" aria-label="${flipped?'Kártya visszafordítása':'Kártya megfordítása'}"><span class="lab">${c.n}. lecke</span><span class="lvl">${lvTag(box(c))}</span><div><div class="w" lang="${dir}">${esc(qx)}</div>${flipped?`<div class="a" lang="${dir==='it'?'hu':'it'}">${esc(ax)}</div>`:'<div class="muted hintf">Gondolja végig, aztán fordítsa meg</div>'}</div></div>
    <div class="fbtns">${flipped?'<button class="btn" id="no" type="button">Még nem tudom <kbd>1</kbd></button><button class="btn primary" id="yes" type="button">Tudom <kbd>2</kbd></button>':'<button class="btn primary" id="flip" type="button">Megfordítom <kbd>Szóköz</kbd></button>'}</div>
  </div>
  <aside class="panel sum" aria-labelledby="h-sum"><h2 class="ptitle" id="h-sum">Ebben a pakliban</h2><dl class="rows">
    <div><dt>Esedékes ma</dt><dd>${dueN}</dd></div>${cnt.map((n,i)=>`<div><dt><span class="dotk l${i}"></span>${cap(LV[i])}</dt><dd>${n}</dd></div>`).join('')}<div><dt>Összesen</dt><dd>${deck.length}</dd></div></dl>
    <p class="muted">Ha egy szót nem tud, visszakerül az elejére, és ma újra előjön.</p></aside></div>`;
  v.querySelector('#fc').onclick=flip;
  v.querySelector('#fc').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();flip()}};
  const fb=v.querySelector('#flip');if(fb)fb.onclick=flip;
  const y=v.querySelector('#yes');if(y)y.onclick=()=>answer(true);
  const n=v.querySelector('#no');if(n)n.onclick=()=>answer(false);
  v.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{scope=b.dataset.sc;render()});
  v.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{dir=b.dataset.dir;render()});
}
addEventListener('keydown',e=>{
  const t=e.target instanceof Element?e.target:document.body;
  if(route().page!=='kartyak'||e.metaKey||e.ctrlKey||e.altKey||t.closest('input,select,textarea'))return;
  if(e.key===' '&&!t.closest('button,a')){e.preventDefault();flip()}
  else if(flipped&&e.key==='1')answer(false);
  else if(flipped&&e.key==='2')answer(true);
});

/* Szótár */
const ART=/^(il|lo|la|i|gli|le|un|uno|una)\s+|^(l|un)'/i;
function viewDict(v){
  const all=allCards();
  v.innerHTML=`<header class="ph"><div><h1>Szótár</h1><p class="lead">${all.length} szó a ${DATA.length} leckéből, olasz ábécérendben</p></div></header>
  <div class="filters"><label class="search">${ico('szotar')}<span class="sr">Keresés</span><input id="q" type="search" placeholder="Keresés olaszul vagy magyarul" value="${escA(q)}" autocomplete="off" spellcheck="false"></label>
  <label class="select"><span class="sr">Lecke</span><select id="qn"><option value="0">Minden lecke</option>${DATA.map(d=>`<option value="${d.n}"${qn===d.n?' selected':''}>${d.n}. ${esc(name(d))}</option>`).join('')}</select></label></div>
  <p class="count-line" id="cnt" aria-live="polite"></p>
  <div class="panel flush"><table class="words dict"><thead><tr><th>Olasz</th><th>Magyar</th><th class="r">Lecke</th><th class="r">Szint</th></tr></thead><tbody id="rows"></tbody></table></div>`;
  const rows=()=>{
    const nq=norm(q);
    const list=all.filter(c=>(!qn||c.n===qn)&&(!nq||norm(c.it).includes(nq)||norm(c.hu).includes(nq))).sort((a,b)=>a.it.replace(ART,'').localeCompare(b.it.replace(ART,''),'it')||a.n-b.n);
    document.getElementById('cnt').textContent=`${list.length} találat`;
    document.getElementById('rows').innerHTML=list.length?list.map(c=>`<tr><td class="it" lang="it">${esc(c.it)}</td><td class="hu">${esc(c.hu)}</td><td class="ln"><a href="#lecke-${c.n}/szavak">${c.n}. lecke</a></td><td class="lv">${lvTag(box(c))}</td></tr>`).join(''):`<tr><td class="empty" colspan="4">Nincs találat erre: „${esc(q)}”.</td></tr>`;
  };
  const qi=v.querySelector('#q');qi.oninput=()=>{q=qi.value;rows()};
  v.querySelector('#qn').onchange=e=>{qn=+e.target.value;rows()};
  rows();
}

addEventListener('hashchange',()=>render(true));
if(!byN(st.n))st.n=DATA[0].n;
applyTheme();
render(true);
</script>
