<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f8f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Olasz nyelvleckék, kártyák és nyelvtani gyakorlatok magyaroknak." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Olaszóra</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Paracadute, in JavaScript semplice (gira anche se il resto dell'app non parte):
      - se l'app non si avvia entro 10 secondi o c'è un errore, mostra il messaggio e «Ripristina l'app»;
      - «Ripristina l'app» toglie il service worker e la copia offline, NON i progressi (IndexedDB);
      - ?reset nell'indirizzo fa la stessa cosa;
      - chiede sempre al service worker di cercare una versione nuova.
    -->
    <script>
      (function () {
        var shown = false;
        function reset() {
          var jobs = [];
          if ("serviceWorker" in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          // ?v=… salta la copia della pagina che il browser tiene per 10 minuti (cache di GitHub Pages).
          Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + "?v=" + Date.now()); });
        }
        window.__arenaReset = reset;
        if (/[?&]reset\b/.test(location.search)) { reset(); return; }
        function show(msg) {
          var root = document.getElementById("root");
          if (shown || !root || root.childElementCount > 0) return;
          shown = true;
          root.innerHTML =
            '<div style="font:16px/1.5 -apple-system,system-ui,sans-serif;padding:32px 16px;max-width:480px;margin:0 auto;color:#111">' +
            '<h1 style="font-size:22px;margin:0 0 8px">Az alkalmazás nem indult el</h1>' +
            '<p style="margin:0 0 16px;color:#555">Általában elég visszaállítani: újra letöltődik, a haladásod a telefonon marad.</p>' +
            '<button id="arena-reset" style="font:inherit;font-weight:600;padding:12px 20px;border-radius:10px;border:0;background:#1d5fbf;color:#fff">Az alkalmazás visszaállítása</button>' +
            (msg ? '<p style="margin:24px 0 0;font-size:13px;color:#777;word-break:break-word">Hiba: ' + String(msg).replace(/</g, "&lt;") + '</p>' : '') +
            '</div>';
          document.getElementById("arena-reset").onclick = reset;
        }
        // Si ricorda l'ultimo errore; lo mostra solo se dopo qualche secondo la pagina è ancora vuota.
        var last = "";
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (t && t.tagName === "SCRIPT") last = "nem töltődött be a fájl: " + t.src;
          else if (e && e.message) last = e.message;
          else return;
          setTimeout(function () { show(last); }, 3000);
        }, true);
        window.addEventListener("unhandledrejection", function (e) { last = (e && e.reason && (e.reason.message || String(e.reason))) || last; });
        setTimeout(function () { show(last); }, 10000);
        if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.update(); }).catch(function () {});
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
