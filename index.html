<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Olasz leckék Assimil-módszerrel – magyar anyanyelvűeknek">
<title>Olaszóra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: egy oszlopos "füzet" — fejléc haladással, fülek (Leckék / Gyakorlás / Szókártyák), lecke-chipek, párbeszéd sorokban */
:root{
  --bg:#fbfaf6; --paper:#fffefb; --ink:#1a2740; --muted:#55627a; --line:#d9e0ec;
  --grid:rgba(76,128,205,.20); --margin:#e0525c; --pen:#1f4fa3; --pen-soft:#e6eefb;
  --basil:#227a4c; --basil-soft:#e1f1e7; --tomato:#c8202f; --tomato-soft:#fbe5e7; --gold:#9a6a00;
  --display:"Bodoni Moda", "Didot", Georgia, serif; --body:"Atkinson Hyperlegible", system-ui, sans-serif; --hand:"Kalam", "Comic Sans MS", cursive; --mono:var(--hand);
  --lift:0 1px 0 rgba(26,39,64,.05), 0 6px 18px -10px rgba(26,39,64,.25);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121a28; --paper:#182233; --ink:#e9eef7; --muted:#a1adc2; --line:#2d3a52;
  --grid:rgba(120,165,235,.10); --margin:#f0727b; --pen:#8fb3ff; --pen-soft:#1e2c47;
  --basil:#72d19a; --basil-soft:#183528; --tomato:#ff7e88; --tomato-soft:#3b1d24; --gold:#e0b453;
  --lift:0 6px 18px -10px rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#121a28; --paper:#182233; --ink:#e9eef7; --muted:#a1adc2; --line:#2d3a52;
  --grid:rgba(120,165,235,.10); --margin:#f0727b; --pen:#8fb3ff; --pen-soft:#1e2c47;
  --basil:#72d19a; --basil-soft:#183528; --tomato:#ff7e88; --tomato-soft:#3b1d24; --gold:#e0b453;
  --lift:0 6px 18px -10px rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:5mm 5mm;background-position:-1px -1px;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;margin:0;min-height:100vh;overflow-x:hidden}
::selection{background:var(--pen-soft);color:var(--ink)}
.wrap{position:relative;max-width:900px;margin:0 auto;padding:28px 20px 72px 64px}
.wrap::before{content:"";position:absolute;top:0;bottom:0;left:44px;width:2px;background:var(--margin);opacity:.75}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:26px}
h1{font-family:var(--display);font-weight:500;font-style:italic;font-size:clamp(2.8rem,9vw,4.4rem);margin:0;line-height:.95;letter-spacing:-.02em;font-variation-settings:"opsz" 96}
h1 .flag{display:inline-flex;gap:0;margin-left:12px;vertical-align:.18em;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
h1 .flag i{display:block;width:9px;height:26px}
.sub{color:var(--muted);margin:10px 0 0;font-family:var(--hand);font-size:1.1rem;line-height:1.3}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--paper);border:1.5px solid var(--line);border-radius:4px;padding:4px 12px;font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:var(--lift)}
.pill b{color:var(--pen);font-size:1.05em}
nav.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:inherit;font-weight:700;font-size:1rem;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 16px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .15s}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tomato)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.chip{font:inherit;font-size:.9rem;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:4px;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:border-color .15s,background-color .15s,transform .15s}
.chip:hover{border-color:var(--pen)}
.chip[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft);color:var(--pen);font-weight:700}
.chip .dot{width:9px;height:9px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.chip.done .dot{background:var(--basil);box-shadow:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--pen);outline-offset:2px}
.lesson-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;margin-bottom:4px}
.lesson-head h2{font-family:var(--display);font-weight:600;font-size:clamp(1.9rem,5.5vw,2.6rem);line-height:1.05;letter-spacing:-.015em;margin:2px 0 0;text-wrap:balance;font-variation-settings:"opsz" 72}
.kicker{font-family:var(--hand);font-size:1.15rem;line-height:1.2;color:var(--tomato);font-weight:700}
.hu-title{color:var(--muted);margin:6px 0 18px;font-size:1.02rem}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 16px}
.btn{font:inherit;font-size:.92rem;font-weight:700;border-radius:4px;padding:9px 16px;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);transition:border-color .15s,background-color .15s,transform .1s}
.btn:hover{border-color:var(--pen)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--bg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.dlg{list-style:none;margin:0;padding:6px 0;background:var(--paper);border:1.5px solid var(--line);border-radius:4px;box-shadow:var(--lift)}
.dlg li{display:grid;grid-template-columns:2.2rem 1fr auto;gap:3px 10px;padding:12px 18px 12px 14px;border-top:1px dashed var(--line)}
.dlg li:first-child{border-top:0}
.dlg .num{font-family:var(--hand);color:var(--tomato);font-size:1.05rem;line-height:1.4;font-variant-numeric:tabular-nums;text-align:right}
.dlg .it{font-family:var(--display);font-weight:500;font-size:1.22rem;line-height:1.4;min-width:0;font-variation-settings:"opsz" 24}
.dlg .it sup{color:var(--tomato);font-family:var(--hand);font-weight:700;font-size:.62em;margin-left:2px}
.dlg .hu{grid-column:2/3;color:var(--muted);font-size:.98rem;min-width:0}
.dlg .hu i{opacity:.8}
.dlg .hu.hidden{color:transparent;background:var(--pen-soft);border-radius:3px;cursor:pointer;user-select:none;transition:background-color .15s}
.dlg .hu.hidden:hover{background:var(--line)}
.dlg .hu.hidden i{color:transparent}
.say{grid-row:1/3;grid-column:3;align-self:start;border:0;background:none;color:var(--pen);cursor:pointer;font-size:1.1rem;padding:2px 6px;border-radius:4px}
.notes{margin:22px 0 0;padding:16px 18px 16px 20px;border-left:3px solid var(--tomato);background:var(--paper);border-radius:0 4px 4px 0;box-shadow:var(--lift)}
.notes h3,.card h3{font-family:var(--hand);font-size:1.3rem;font-weight:700;line-height:1.2;color:var(--tomato);margin:0 0 10px}
.notes ol{margin:0;padding-left:1.5rem;display:grid;gap:10px;font-size:1rem}
.notes li::marker{color:var(--tomato);font-family:var(--hand);font-weight:700;font-size:1.05em}
.notes b{color:var(--tomato)}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:4px;padding:18px 20px;margin-bottom:18px;box-shadow:var(--lift)}
.ex1 ol{padding-left:1.5rem}
.ex1 li{margin-bottom:12px}
.ex1 li::marker{color:var(--tomato);font-family:var(--hand);font-weight:700}
.ex1 li>span:first-child{font-family:var(--display);font-size:1.12rem;font-weight:500}
.ex1 .ans{display:block;color:var(--basil);font-weight:700;margin-top:2px}
.ex2 .row{padding:12px 0;border-top:1px dashed var(--line)}
.ex2 .row:first-of-type{border-top:0}
.ex2 .q{font-weight:700;margin-bottom:6px}
.ex2 .line{line-height:2.5;font-family:var(--display);font-size:1.1rem}
.ex2 input{font:inherit;font-family:var(--hand);font-size:1.05rem;font-weight:700;border:0;border-bottom:2px dotted var(--pen);background:transparent;color:var(--pen);padding:0 6px;border-radius:0;width:auto}
.ex2 input:focus{background:var(--pen-soft)}
.ex2 input.ok{border-bottom:2px solid var(--basil);color:var(--basil);background:var(--basil-soft)}
.ex2 input.no{border-bottom:2px solid var(--tomato);color:var(--tomato);background:var(--tomato-soft)}
.fb{font-family:var(--hand);font-size:.95rem;color:var(--tomato);margin-left:6px}
.flash{display:grid;gap:16px;justify-items:center}
.fcard{width:min(100%,480px);min-height:240px;background-color:var(--paper);background-image:linear-gradient(var(--margin),var(--margin)),repeating-linear-gradient(transparent 0 31px,var(--grid) 31px 32px);background-size:100% 2px,100% 100%;background-position:0 46px,0 14px;background-repeat:no-repeat,repeat;border:1.5px solid var(--line);border-radius:4px;box-shadow:var(--lift);display:grid;place-items:center;text-align:center;padding:56px 24px 28px;cursor:pointer;position:relative}
.fcard .w{font-family:var(--display);font-weight:500;font-size:2.2rem;line-height:1.15;font-variation-settings:"opsz" 72}
.fcard .a{margin-top:12px;font-family:var(--hand);font-size:1.45rem;color:var(--tomato);font-weight:700}
.fcard .tag{position:absolute;top:12px;left:16px;font-size:1rem;color:var(--muted);font-family:var(--hand)}
.fbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.boxes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.boxes span{background:var(--paper);border:1.5px solid var(--line);border-radius:4px;padding:2px 10px;font-variant-numeric:tabular-nums}
.rip h4{margin:18px 0 6px;font-family:var(--hand);font-size:1.2rem;color:var(--tomato)}
.rip h4:first-child{margin-top:0}
.rip p{margin:0 0 8px;font-size:1rem}
.tablewrap{overflow-x:auto}
table.conj{border-collapse:collapse;font-size:.92rem;min-width:420px}
table.conj td,table.conj th{border:1px solid var(--line);padding:5px 10px;text-align:left}
table.conj th{color:var(--pen);background:var(--pen-soft)}
.muted{color:var(--muted);font-size:.92rem}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:.92rem}
@media (max-width:520px){
  body{font-size:16px}
  .wrap{padding:20px 14px 56px 40px}
  .wrap::before{left:26px}
  .dlg li{grid-template-columns:1.6rem 1fr auto;padding:11px 12px 11px 8px}
  .dlg .it{font-size:1.12rem}
  .card{padding:16px 14px}
  .fcard .w{font-size:1.9rem}
}
@media (prefers-reduced-motion:no-preference){ .fcard{transition:transform .15s} .fcard:hover{transform:rotate(-.4deg)} .fcard:active{transform:scale(.98)} }
</style>

</head>

z olaszban <i>van névelő<\/i>: <b>il<\/b> (hímnem), <b>la<\/b> (nőnem), <b>l'<\/b> magánhangzó előtt; <b>un / una<\/b>. Országnév névelővel: <b>l'Italia<\/b>, de <b>in Italia<\/b>.", "<b>Questa<\/b> (ez) nőnemű, mert <b>Europa<\/b> nőnemű. A létige (<b>è<\/b>) <i>sosem marad el<\/i>. <b>è<\/b> (van) ≠ <b>e<\/b> (és).", "<b>C'è<\/b> = van, található; többes: <b>ci sono<\/b>.", "A melléknév általában a főnév <i>után<\/i> áll és egyezik vele: <b>paese grande<\/b>, <b>città bella<\/b>.", "<b>Professore<\/b> megszólításként = <i>tanár úr<\/i>; nőnem: <b>professoressa<\/b>.", "<b>Pierino<\/b> = Pietro becézője (<b>-ino<\/b> ≈ <i>-ke<\/i>).", "Ragok helyett <i>elöljárószók<\/i>: <b>in Ungheria<\/b> = Magyarországon.", "<b>italiano / italiana / italiani / italiane<\/b>, de <b>ungherese / ungheresi<\/b>. Többes: -o→-i, -a→-e, -e→-i.", "<b>Parlano ungherese<\/b> = magyarul beszélnek (névelő nélkül).", "<b>Siamo, parliamo<\/b>: többes 1. személy mindig <b>-iamo<\/b>. Tagadás: <b>non<\/b> + ige."], "ex1": [["Anche Budapest è una città grande.", "Budapest is nagy város."], ["Qui c'è l'Italia.", "Itt van Olaszország."], ["Gli italiani parlano italiano.", "Az olaszok olaszul beszélnek."], ["Noi siamo ungheresi.", "Mi magyarok vagyunk."], ["Professore, l'Italia è bella?", "Tanár úr, Olaszország szép?"], ["In Ungheria ci sono gli ungheresi.", "Magyarországon magyarok vannak."]], "ex2": [{"hu": "Itt van Róma.", "gap": "Qui . . . Roma.", "ans": ["c'è"]}, {"hu": "Az olaszok olaszul beszélnek.", "gap": ". . . italiani . . . . . . . italiano.", "ans": ["Gli", "parlano"]}, {"hu": "Olaszország szép ország.", "gap": "L'Italia . un . . . . . bello.", "ans": ["è", "paese"]}, {"hu": "Mi magyarok vagyunk.", "gap": "Noi . . . . . ungheresi.", "ans": ["siamo"]}, {"hu": "Róma is nagy város?", "gap": ". . . . . Roma è una . . . . . grande?", "ans": ["Anche", "città"]}, {"hu": "Nem vagyunk olaszok.", "gap": "Non . . . . . italiani.", "ans": ["siamo"]}], "voc": [["l'Europa", "Európa"], ["il paese", "az ország"], ["grande", "nagy"], ["bello / bella", "szép"], ["la città", "a város"], ["il professore", "a tanár"], ["sì", "igen"], ["parlare", "beszélni"], ["noi", "mi"], ["italiano", "olasz"], ["ungherese", "magyar"]]}, {"n": 3, "it": "Terza lezione", "hu": "Harmadik lecke", "title_it": "Una strana famiglia", "title_hu": "Egy különös család", "dlg": [["La famiglia Rossi vive a Roma^1", "A Rossi család Rómában él (A család Rossi él -ra Róma)"], ["in un appartamento moderno^2.", "egy modern lakásban (-ban egy lakás modern)."], ["I Rossi^3 sono a casa.", "Rossiék otthon vannak (A Rossi[k] vannak -ra ház)."], ["Dov'è^4 Giovanni Rossi?", "Hol van Rossi Giovanni?"], ["È in cucina^5.", "A konyhában van (Van -ban konyha)."], ["Dov'è la signora Rossi^6?", "Hol van Rossiné?"], ["In camera.", "A szobában."], ["Un marito in cucina?", "Egy férj a konyhában?"], ["Una moglie in camera?", "Egy feleség a szobában?"], ["Non^7 è strano?", "Nem különös (Nem van különös)?"], ["No.", "Nem."]], "notes": ["<b>A Roma<\/b> = Rómában; városnevek előtt <b>a<\/b>, országnevek előtt <b>in<\/b>. <b>Vive<\/b> a <b>vivere<\/b> (élni) 3. személye.", "<b>Un<\/b> hímnemű, <b>una<\/b> nőnemű határozatlan névelő. <b>appartamento moderno<\/b>: melléknév a főnév után.", "<b>I Rossi<\/b> = Rossiék (a család). <b>A casa<\/b> = otthon.", "<b>Dov'è<\/b> = dove + è. Kérdésben a szórend nem változik, csak a hanglejtés.", "<b>In cucina, in camera<\/b>: helyiségek előtt névelő nélkül.", "A <b>-né<\/b> olasz megfelelője: <b>la signora Rossi<\/b>.", "<b>Non<\/b> az ige előtt (<b>non è<\/b>), önálló válaszként <b>no<\/b>."], "ex1": [["Dov'è la moglie?", "Hol van a feleség?"], ["L'appartamento non è moderno.", "A lakás nem modern."], ["Il marito, la moglie e Pierino sono una famiglia.", "A férj, a feleség és Petike egy család."], ["Le famiglie sono a casa.", "A családok otthon vannak."], ["Viviamo a Budapest.", "Budapesten élünk."], ["Questo non è un bel paese.", "Ez nem szép ország."]], "ex2": [{"hu": "Én otthon vagyok.", "gap": "Io . . . . a casa.", "ans": ["sono"]}, {"hu": "A lakás modern.", "gap": "L'appartamento . moderno.", "ans": ["è"]}, {"hu": "Rómában szép idő van.", "gap": ". Roma fa bel tempo.", "ans": ["A"]}, {"hu": "Hol vannak Rossiék?", "gap": ". . . . . sono . Rossi?", "ans": ["Dove", "i"]}, {"hu": "Nem a szobában vannak.", "gap": ". . . sono in . . . . . .", "ans": ["Non", "camera"]}, {"hu": "Te modern férj vagy?", "gap": "Tu . . . un . . . . . . moderno?", "ans": ["sei", "marito"]}], "voc": [["la famiglia", "a család"], ["vivere", "élni"], ["l'appartamento", "a lakás"], ["moderno", "modern"], ["a casa", "otthon"], ["la cucina", "a konyha"], ["la camera", "a szoba"], ["il marito", "a férj"], ["la moglie", "a feleség"], ["strano", "különös, furcsa"], ["la signora", "a hölgy, asszony"]]}, {"n": 4, "it": "Quarta lezione", "hu": "Negyedik lecke", "title_it": "Un poliziotto curioso", "title_hu": "Egy kíváncsi rendőr (Egy rendőr kíváncsi)", "dlg": [["Lei^1 è straniero? Cosa fa in Italia?", "Ön külföldi (Ön van külföldi)? Mit csinál Olaszországban (Mit csinál -ban Olaszország)?"], ["Studio l'italiano^2.", "Olaszul tanulok (Tanulom az olaszt)."], ["È difficile la lingua italiana?", "Nehéz az olasz nyelv (Van nehéz a nyelv olasz)?"], ["No, è facile.", "Nem, könnyű (Nem, van könnyű)."], ["Dove vive? A Budapest?", "Hol él? Budapesten (-ban Budapest)?"], ["Non vivo a Budapest, ma^3 in una cittadina^4 ungherese.", "Nem Budapesten élek, hanem egy magyar kisvárosban (Nem élek -ban Budapest, hanem -ban egy kisváros magyar)."], ["E adesso dove^5 va?", "És most hova megy (És most hol megy)?"], ["Vado in albergo^6.", "A szállodába megyek (Megyek -ba szálloda)."], ["Arrivederci. Buona giornata.", "Viszontlátásra. Minden jót (Jó napot)."]], "notes": ["<b>Lei<\/b> = <i>Ön<\/i>. Az udvarias megszólítás az olaszban a harmadik személyű, nőnemű <b>lei<\/b> névmás (gyakran nagy L-lel írva), az ige egyes szám 3. személyben áll: <b>Lei è<\/b> = Ön van. Férfinak is <b>Lei<\/b>-t mondunk! A melléknév viszont a valódi nemhez igazodik: <b>Lei è straniero<\/b> (férfinak) / <b>straniera<\/b> (nőnek).", "<b>Studiare l'italiano<\/b>: tanulni egy nyelvet – névelővel; de beszélni egy nyelven névelő nélkül: <b>parlare italiano<\/b> (2. lecke). Az egyes szám 1. személy végződése mindig <b>-o<\/b>: <b>studio<\/b> (tanulok), <b>vivo<\/b> (élek), <b>vado<\/b> (megyek).", "<b>Non… ma…<\/b> = <i>nem… hanem…<\/i>. Választékosabban: <b>non… bensì…<\/b>.", "<b>Cittadina<\/b> = kisváros. Az <b>-ina / -ino<\/b> kicsinyítő képző: <b>città → cittadina<\/b>, vö. <b>Pietro → Pierino<\/b> (2. lecke).", "<b>Dove?<\/b> = <i>hol?<\/i> és <i>hová?<\/i> egyaránt. Az olasz nem választja szét a helyet és az irányt: <b>Dove vive?<\/b> (Hol él?), <b>Dove va?<\/b> (Hová megy?). Honnan? = <b>Da dove?<\/b>", "<b>In albergo<\/b> = a szállodában és a szállodába is: az <b>in<\/b> elöljárószó helyet és irányt is jelöl. Néhány gyakori helynél nincs névelő: <b>in albergo, in banca, in cucina, a casa<\/b>. <b>Vado<\/b> az <b>andare<\/b> (menni) rendhagyó alakja: <b>vado, vai, va<\/b>."], "ex1": [["La signora Rossi vive in una grande città.", "Rossiné egy nagyvárosban él."], ["Studia l'ungherese?", "Magyarul tanul?"], ["Dove va la moglie?", "Hova megy a feleség?"], ["Siete a Roma?", "Rómában vagytok?"], ["Adesso non vado in cucina.", "Most nem megyek a konyhába."], ["Noi studiamo a casa.", "Mi otthon tanulunk."]], "ex2": [{"hu": "Budapestre megyek.", "gap": "Vado a . . . . . . . . .", "ans": ["Budapest"]}, {"hu": "Van konyha a szállodában?", "gap": "C'è una . . . . . . in . . . . . . . ?", "ans": ["cucina", "albergo"]}, {"hu": "Viszontlátásra Olaszországban.", "gap": ". . . . . . . . . . . in Italia.", "ans": ["Arrivederci"]}, {"hu": "Hol él Rossiné?", "gap": ". . . . . vive la signora Rossi?", "ans": ["Dove"]}, {"hu": "Hova megy a külföldi?", "gap": "Dove . . lo . . . . . . . . . ?", "ans": ["va", "straniero"]}, {"hu": "A tanár is tanul.", "gap": ". . . . . il professore studia.", "ans": ["Anche"]}], "voc": [["straniero", "külföldi"], ["studiare", "tanulni"], ["difficile", "nehéz"], ["facile", "könnyű"], ["la lingua", "a nyelv"], ["dove?", "hol? hová?"], ["adesso", "most"], ["l'albergo", "a szálloda"], ["andare", "menni"], ["arrivederci", "viszontlátásra"], ["la cittadina", "a kisváros"]]}, {"n": 5, "it": "Quinta lezione", "hu": "Ötödik lecke", "title_it": "Al ristorante «Da Mario»", "title_hu": "A „Da Mario” étteremben (-nál étterem „Mariónál”)", "dlg": [["Cameriere! Il menù, per favore^1!", "Pincér! Az étlapot, legyen szíves (Az étlap, kérem)!"], ["Arrivo subito… Ecco a Lei^2.", "Azonnal jövök (Érkezem azonnal)… Tessék (Íme Önnek)."], ["Grazie.", "Köszönöm."], ["Cosa prendete^3 da bere?", "Mit kérnek inni (Mit vesztek -ból inni)?"], ["Un litro di^4 vino rosso.", "Egy liter vörösbort (Egy liter -ból bor vörös)."], ["Abbiamo^5 solo vino bianco.", "Csak fehérbor van (Van-nekünk csak bor fehér)."], ["Va bene. Ma vogliamo anche dell'acqua^6. Avete le lasagne?", "Jó (Megy jól). De vizet is kérünk (De akarunk is -ból-a víz). Van lasagne (Van-nektek a lasagne)?"], ["Sì, signore. Le abbiamo^7. E abbiamo anche il pollo arrosto.", "Igen, uram (úr). Van (Azokat van-nekünk). És sült csirke is van (És van-nekünk is a csirke sült)."], ["Prendiamo due lasagne e un pollo arrosto.", "Két lasagnét és egy sült csirkét kérünk (Veszünk két lasagne és egy csirke sült)."], ["Porto anche un'insalata.", "Hozok salátát is (Hozok is egy saláta)."], ["No, l'insalata non la vogliamo^7.", "Nem, salátát nem kérünk (Nem, a saláta nem azt akarjuk)."], ["Buon appetito!", "Jó étvágyat!"]], "notes": ["<b>Per favore<\/b> = <i>kérem, legyen szíves<\/i>. A <b>grazie<\/b>-re adott válasz: <b>prego<\/b> (<i>szívesen<\/i>).", "<b>Ecco<\/b> = <i>íme, tessék<\/i>, amikor átadunk vagy megmutatunk valamit: <b>Ecco il menù<\/b> = Itt az étlap. <b>Ecco a Lei<\/b> = Tessék (Önnek).", "<b>Prendere<\/b> = venni, fogni; étteremben „kérni, rendelni”. <b>Prendete<\/b> többes szám 2. személy: a pincér a társaságot <b>voi<\/b>-jal szólítja meg, ez étteremben is teljesen udvarias.", "Mennyiség után <b>di<\/b> áll: <b>un litro di vino<\/b>, <b>un chilo di pane<\/b>. Fontos: az olaszban <i>nincs tárgyrag<\/i> (-t)! A tárgy ugyanúgy néz ki, mint az alany; a szórend mutatja: <b>prendo il vino<\/b> (alany – ige – tárgy).", "<b>Avere<\/b> = birtokolni. Az olasznak – a magyarral ellentétben – van külön igéje a birtoklásra: <b>ho, hai, ha, abbiamo, avete, hanno<\/b>. „Van nekünk” = <b>abbiamo<\/b>; „Van gulyás?” étteremben = <b>Avete…?<\/b> (Önöknek van…?).", "<b>Dell'acqua, del vino<\/b>: részelő névelő (<b>di<\/b> + határozott névelő) = „egy kis, valamennyi”. A magyarban ilyenkor egyszerűen nincs névelő: <i>vizet kérünk<\/i>.", "<b>Le abbiamo / la vogliamo<\/b>: hangsúlytalan tárgyi névmások – <b>lo<\/b> (őt/azt, hímnem), <b>la<\/b> (nőnem), <b>li<\/b> (hímnem többes), <b>le<\/b> (nőnem többes). Az ige <i>elé<\/i> kerülnek. Ez a magyar tárgyas ragozás egyik megfelelője: <b>la vogliamo<\/b> = akarjuk (azt)."], "ex1": [["Il cameriere va in albergo.", "A pincér a szállodába megy."], ["Porto dell'acqua e del vino.", "Hozok vizet és bort."], ["Lo straniero prende anche l'insalata.", "A külföldi salátát is kér."], ["Adesso le lasagne non sono buone.", "Most nem jó a lasagne."], ["Ecco il menù.", "Itt az étlap."], ["Perché prendiamo il pollo?", "Miért kérünk csirkét?"]], "ex2": [{"hu": "A rendőrök nem kérnek italt.", "gap": "I poliziotti non . . . . . . . . da bere.", "ans": ["prendono"]}, {"hu": "A saláta jó.", "gap": "L'. . . . . . . . . è . . . . .", "ans": ["insalata", "buona"]}, {"hu": "Rossiék vizet hoznak.", "gap": "I Rossi portano dell'. . . . . .", "ans": ["acqua"]}, {"hu": "Tanár úr, legyen szíves, hol van Európa?", "gap": "Professore, per . . . . . . , dov'è l'Europa?", "ans": ["favore"]}, {"hu": "Pierino nem kér csirkét.", "gap": "Pierino non vuole il . . . . .", "ans": ["pollo"]}, {"hu": "Van jó bor Magyarországon?", "gap": "C'è del . . . . vino in . . . . . . . ?", "ans": ["buon", "Ungheria"]}], "voc": [["il cameriere", "a pincér"], ["il menù", "az étlap"], ["per favore", "legyen szíves"], ["subito", "azonnal"], ["ecco", "íme, tessék"], ["bere", "inni"], ["il vino rosso", "a vörösbor"], ["bianco", "fehér"], ["l'acqua", "a víz"], ["il pollo", "a csirke"], ["l'insalata", "a saláta"], ["portare", "hozni, vinni"], ["Buon appetito!", "Jó étvágyat!"], ["prego", "szívesen"]]}, {"n": 6, "it": "Sesta lezione", "hu": "Hatodik lecke", "title_it": "Libri interessanti", "title_hu": "Érdekes könyvek (Könyvek érdekesek)", "dlg": [["Gigi^1, vieni a fare^2 una passeggiata?", "Gigi, jössz sétálni (jössz -ni csinál egy séta)?"], ["No, adesso non ho tempo^3.", "Nem, most nincs időm (most nem van-nekem idő)."], ["Perché? Cosa fai?", "Miért? Mit csinálsz?"], ["Studio l'ungherese.", "Magyarul tanulok (Tanulom a magyart)."], ["È bello il libro?", "Jó a könyv (Van szép a könyv)?"], ["Molto interessante. Il suo titolo^4 è: «Il rosso e il nero».", "Nagyon érdekes. A címe (Az ő címe van): „Vörös és fekete” (A vörös és a fekete)."], ["Bene, allora non facciamo la passeggiata, leggo anch'io. Dov'è il mio libro^4?", "Jó, akkor nem sétálunk (nem csináljuk a sétát), én is olvasok. Hol a könyvem (Hol van a az-én könyv)?"], ["Eccolo^5, è sul^6 tavolo. Il titolo è interessante:", "Tessék (Íme-az), itt van az asztalon (van -on-a asztal). Érdekes a címe (A cím van érdekes):"], ["«Il poliziotto, sua moglie e il basilico».", "„A rendőr, a felesége és a bazsalikom” (A rendőr, övé feleség és a bazsalikom)."]], "notes": ["<b>Gigi<\/b> a <b>Luigi<\/b> becézője (mint a magyar <i>Laci<\/i> a <i>László<\/i>-é).", "Mozgást jelentő igék után <b>a<\/b> + főnévi igenév: <b>vieni a fare<\/b> (jössz csinálni), <b>vado a mangiare<\/b> (megyek enni). A főnévi igenév végződése <b>-are, -ere, -ire<\/b>: <b>parlare, leggere, venire<\/b>. <b>Vieni<\/b> a <b>venire<\/b> (jönni) alakja: <b>vengo, vieni, viene<\/b>.", "<b>Non ho tempo<\/b> = nincs időm (szó szerint: nem birtoklok időt). Az olaszban <i>nincs külön „nincs” szó<\/i>: <b>non c'è<\/b> = nincs (ott), <b>non ho<\/b> = nincs nekem. A tagadás mindig <b>non<\/b> + ige.", "Birtokos névmás <i>névelővel<\/i>: <b>il mio libro<\/b> (a könyvem), <b>il tuo<\/b>, <b>il suo<\/b>; nőnem: <b>la mia, la tua, la sua<\/b>. A névmás a birtok neméhez igazodik, nem a birtokoséhoz: <b>il suo titolo<\/b> = az ő (a könyv) címe. Kivétel: egyes számú rokonsági szavak névelő nélkül: <b>sua moglie<\/b> (9. mondat).", "<b>Eccolo<\/b> = <b>ecco<\/b> + <b>lo<\/b>: itt van (az). A hangsúlytalan névmás az <b>ecco<\/b> végéhez tapad: <b>eccola, eccoli<\/b>.", "Az elöljárószók összeolvadnak a határozott névelővel: <b>su + il = sul<\/b>, <b>in + il = nel<\/b>, <b>a + il = al<\/b>, <b>di + il = del<\/b>, <b>da + il = dal<\/b>. Ami a magyarban rag (<i>asztal-on<\/i>), az olaszban elöljárószó + névelő (<b>sul tavolo<\/b>)."], "ex1": [["Vado a passeggiare.", "Megyek sétálni."], ["Maria è molto bella.", "Mari nagyon szép."], ["Studio in una piccola città.", "Egy kis városban tanulok."], ["Il mio vino è sul tavolo.", "A borom az asztalon van."], ["Leggo solo in italiano.", "Csak olaszul olvasok."], ["Vorrei tre libri interessanti.", "Kérek három érdekes könyvet."]], "ex2": [{"hu": "Olvasok egy érdekes könyvet.", "gap": "Leggo un . . . . . interessante.", "ans": ["libro"]}, {"hu": "A férjem nincs otthon.", "gap": "Mio . . . . . . non è a . . . . .", "ans": ["marito", "casa"]}, {"hu": "Mit csinál Pierino a szobában?", "gap": "Cosa . . Pierino in . . . . . . ?", "ans": ["fa", "camera"]}, {"hu": "Egy különös nyelvet tanulunk.", "gap": ". . . . . . . . una lingua particolare.", "ans": ["Studiamo"]}, {"hu": "Miért nem sétálsz?", "gap": ". . . . . . non passeggi?", "ans": ["Perché"]}, {"hu": "Önök is olvasnak?", "gap": "Anche . . . leggete?", "ans": ["voi"]}], "voc": [["la passeggiata", "a séta"], ["perché", "miért; mert"], ["fare", "csinálni"], ["il libro", "a könyv"], ["interessante", "érdekes"], ["il titolo", "a cím"], ["leggere", "olvasni"], ["il tavolo", "az asztal"], ["allora", "akkor"], ["rosso", "vörös, piros"], ["nero", "fekete"], ["venire", "jönni"]]}, {"n": 7, "it": "Settima lezione", "hu": "Hetedik lecke", "title_it": "Ripasso", "title_hu": "Ismétlés", "ripasso": true, "sections": [["1 Az ige", ["<b>1.1 Jelen idő.<\/b> Az eddigi igealakok mind kijelentő mód jelen időben állnak.", "<b>1.2 Főnévi igenév.<\/b> Három végződés, három ragozási csoport: <b>-are<\/b> (parlare), <b>-ere<\/b> (leggere), <b>-ire<\/b> (venire, dormire).", "<b>1.3 Szabályos ragozás.<\/b> <b>parlare<\/b>: parlo, parli, parla, parliamo, parlate, parlano · <b>leggere<\/b>: leggo, leggi, legge, leggiamo, leggete, leggono. Az 1. személy mindig <b>-o<\/b>, a 2. mindig <b>-i<\/b>, a többes 1. mindig <b>-iamo<\/b>.", "<b>1.4 Rendhagyó igék<\/b> (táblázat a következő oldalon).", "<b>1.5 A létige.<\/b> Az olaszban az <b>è / sono<\/b> <i>soha nem marad el<\/i>: <b>Maria è bella<\/b> (Mari Ø szép), <b>Budapest è una città<\/b>. Létezés: <b>c'è / ci sono<\/b> (van / vannak). Birtoklás: <b>avere<\/b> (<b>ho tempo<\/b> = van időm). Hogylét: <b>stare<\/b> (<b>sto bene<\/b>)."]], ["TABLE", [["", "essere", "avere", "andare", "venire", "fare"], ["io", "sono", "ho", "vado", "vengo", "faccio"], ["tu", "sei", "hai", "vai", "vieni", "fai"], ["lui/lei", "è", "ha", "va", "viene", "fa"], ["noi", "siamo", "abbiamo", "andiamo", "veniamo", "facciamo"], ["voi", "siete", "avete", "andate", "venite", "fate"], ["loro", "sono", "hanno", "vanno", "vengono", "fanno"]]], ["2 Személyes névmások", ["<b>io, tu, lui/lei, noi, voi, loro<\/b>. Mint a magyarban, általában elmaradnak, mert az igevégződés mutatja a személyt: <b>parlo<\/b> = beszélek. Csak nyomatékként használjuk: <b>io parlo<\/b> = <i>én<\/i> beszélek. Udvarias forma: <b>Lei<\/b> (+ egyes szám 3. személy)."]], ["3 Nem és névelő", ["Minden főnévnek van nyelvtani neme. <b>-o<\/b> → többnyire hímnem (libro), <b>-a<\/b> → többnyire nőnem (casa), <b>-e<\/b> → mindkettő lehet (paese hím., moglie nőn.).", "Határozott névelő: hímnem <b>il<\/b> (il libro), <b>lo<\/b> (s+mássalhangzó, z előtt: lo straniero), <b>l'<\/b> (magánhangzó előtt); nőnem <b>la<\/b>, <b>l'<\/b>. Többes szám: <b>i / gli<\/b> (hím.), <b>le<\/b> (nőn.). Határozatlan: <b>un, uno<\/b> / <b>una, un'<\/b>.", "A melléknév nemben és számban egyezik: <b>il libro rosso, la casa rossa, i libri rossi, le case rosse<\/b>."]], ["4 Elöljárószók a ragok helyett", ["<b>in<\/b> = -ban/-ben és -ba/-be (országok, helyiségek: in Italia, in cucina) · <b>a<\/b> = városnév előtt -ban/-ba (a Roma), és <b>a casa<\/b> · <b>su<\/b> = -on/-en/-ön, -ra/-re · <b>di<\/b> = -ból (anyag, mennyiség), birtok („-é”) · <b>da<\/b> = -tól/-től, -nál/-nél, -hoz/-hez (személyeknél).", "Névelővel összeolvadnak: <b>in + il = nel<\/b>, <b>su + la = sulla<\/b>, <b>a + il = al<\/b>, <b>di + il = del<\/b>, <b>da + il = dal<\/b>."]]], "dlg": [["Cosa fa Pietro in camera?", "Mit csinál Péter a szobában?"], ["Legge un libro interessante.", "Egy érdekes könyvet olvas."], ["E Maria in cucina?", "És Mari a konyhában?"], ["Fa il pollo arrosto.", "Sült csirkét csinál."], ["Dove vive lo straniero?", "Hol él a külföldi?"], ["In Ungheria.", "Magyarországon."], ["E la famiglia Rossi?", "És a Rossi család?"], ["A Roma.", "Rómában."], ["Dove va Giovanni?", "Hova megy János?"], ["In albergo.", "A szállodába."]], "voc": [["essere", "lenni"], ["avere", "birtokolni (van neki)"], ["stare bene", "jól lenni"], ["c'è / ci sono", "van / vannak"], ["io vado", "megyek"], ["io vengo", "jövök"], ["io faccio", "csinálok"]]}, {"n": 8, "it": "Ottava lezione", "hu": "Nyolcadik lecke", "title_it": "Una visita in banca", "title_hu": "Látogatás a bankban (Egy látogatás -ban bank)", "dlg": [["Stamattina^1 il signor Bianchi va in banca.", "Bianchi úr ma délelőtt a bankba megy (Ma-reggel a úr Bianchi megy -ba bank)."], ["La banca è in via^2 Garibaldi.", "A bank a Garibaldi utcában van (A bank van -ban utca Garibaldi)."], ["Buongiorno. Dov'è la cassa?", "Jó napot kívánok. Hol van a pénztár?"], ["È lì a sinistra, vicino alla^3 finestra.", "Ott van balra, az ablak mellett (Van ott -ra bal, közel -hoz-az ablak)."], ["Grazie mille^4.", "Köszönöm szépen (Köszönet ezer)."], ["Ecco due assegni^5, vorrei dei contanti.", "Itt van két csekk, készpénzt kérek (Íme két csekkek, szeretnék -ból-a készpénz)."], ["Signore, questi^6 assegni sono falsi.", "Uram, ezek a csekkek hamisak (Úr, ezek csekkek vannak hamisak)."], ["Se non mi dà cento milioni di euro, sparo!", "Ha nem ad százmillió eurót, lövök! (Ha nem nekem ad száz milliók -ból euró, lövök!)"], ["Ecco i soldi. Prego, cento milioni di euro.", "Itt a pénz. Tessék, százmillió euró (Íme a pénzek. Tessék, száz milliók -ból euró)."], ["Va bene. Non sparo.", "Rendben van. Nem lövök (Megy jól. Nem lövök)."], ["Il signor Bianchi esce dalla^7 banca e torna a casa. La polizia lo^8 aspetta già.", "Bianchi úr kijön a bankból és hazamegy. A rendőrség már várja (A rendőrség őt várja már)."]], "notes": ["<b>Stamattina<\/b> = <b>questa mattina<\/b> (ma reggel, ma délelőtt). Ugyanígy: <b>stasera<\/b> (ma este), <b>stanotte<\/b> (ma éjjel).", "Utcanév: <b>via<\/b> + név, névelő nélkül: <b>in via Garibaldi<\/b> = a Garibaldi utcában. Tér: <b>piazza<\/b> (<b>in piazza Navona<\/b>).", "A magyar névutók helyett az olaszban elöljárós kifejezések állnak: <b>vicino a<\/b> (mellett, közel), <b>davanti a<\/b> (előtt), <b>dietro<\/b> (mögött). <b>a + la = alla<\/b>.", "<b>Grazie mille<\/b> = köszönöm szépen („ezer köszönet”). Melléknévből határozószó a <b>-mente<\/b> képzővel: <b>certo → certamente<\/b> (biztosan), <b>particolare → particolarmente<\/b> (különösen).", "Fontos különbség: az olaszban számnév után <i>többes szám<\/i> áll: <b>due assegni<\/b> (két csekk), <b>tre libri<\/b> (három könyv). Az <b>euro<\/b> nem változik: <b>un euro, cento euro<\/b>.", "<b>questo / questa / questi / queste<\/b> + főnév, <i>névelő nélkül<\/i>: <b>questo libro<\/b> = ez a könyv, <b>questi assegni<\/b> = ezek a csekkek. A magyar „ez <i>a<\/i>” névelője elmarad!", "Honnan? = <b>Da dove?<\/b> A <b>da<\/b> = -ból/-ből, -tól/-től: <b>esco dalla banca<\/b> (kijövök a bankból), <b>vengo da Roma<\/b> (Rómából jövök). Összefoglalva: <b>sono in banca<\/b> (bankban vagyok) / <b>vado in banca<\/b> (bankba megyek) / <b>esco dalla banca<\/b> (bankból jövök ki).", "<b>lo<\/b> = őt (hímnem), <b>la<\/b> = őt (nőnem); az ige <i>elé<\/i> kerül: <b>lo aspetta<\/b> = várja (őt). Vö. a magyar tárgyas ragozással: <b>várja<\/b>."], "ex1": [["Queste finestre sono belle.", "Ezek az ablakok szépek."], ["L'assegno è alla cassa.", "A csekk a pénztárban van."], ["Pierino torna a casa stamattina.", "Petike ma délelőtt hazamegy."], ["Se non studia, va a passeggiare.", "Ha nem tanul, sétálni megy."], ["L'albergo è vicino al ristorante.", "A szálloda az étterem mellett van."], ["La famiglia non viene dall'Ungheria.", "A család nem Magyarországról jön."]], "ex2": [{"hu": "Ezek a csekkek nem hamisak.", "gap": ". . . . . . assegni non sono . . . . . .", "ans": ["Questi", "falsi"]}, {"hu": "A konyha balra van.", "gap": "La . . . . . . è a . . . . . . . .", "ans": ["cucina", "sinistra"]}, {"hu": "A tanár pénzt ad.", "gap": "Il professore dà dei . . . . .", "ans": ["soldi"]}, {"hu": "Hogy van, uram?", "gap": "Come sta, . . . . . . . ?", "ans": ["signore"]}, {"hu": "Otthon van százmillió eurom.", "gap": "A casa . . cento milioni di euro", "ans": ["ho"]}, {"hu": "Nem Pietro jön a városból.", "gap": "Non è Pietro che viene . . . . . città", "ans": ["dalla"]}], "voc": [["la banca", "a bank"], ["la cassa", "a pénztár"], ["la finestra", "az ablak"], ["a sinistra", "balra"], ["a destra", "jobbra"], ["vicino a", "mellett, közel"], ["l'assegno", "a csekk"], ["i soldi", "a pénz"], ["falso", "hamis"], ["se", "ha"], ["stamattina", "ma délelőtt"], ["tornare a casa", "hazamenni"]]}, {"n": 9, "it": "Nona lezione", "hu": "Kilencedik lecke", "title_it": "È tardi", "title_hu": "Késő van (Van késő)", "dlg": [["Sono le otto^1 di mattina.", "Reggel nyolc óra van (Vannak a nyolc -ból reggel)."], ["La signora Neri va al lavoro.", "Neriné munkába megy (A asszony Neri megy -hoz-a munka)."], ["In piazza Venezia sale sul^2 tram.", "A Venezia téren felszáll a villamosra (-ban tér Venezia felszáll -ra-a villamos)."], ["Sul tram si siede^3 e legge il giornale.", "A villamoson leül és újságot olvas (-on-a villamos magát leülteti és olvas a újság)."], ["Scende dal tram vicino alla banca.", "A bank mellett leszáll a villamosról (Leszáll -ról-a villamos közel -hoz-a bank)."], ["Poi cammina a piedi per cinquecento metri.", "Aztán gyalog sétál ötszáz métert (Aztán gyalogol -on lábak -ért ötszáz méterek)."], ["Si ferma davanti a un grande palazzo. È il suo^4 posto di lavoro.", "Egy nagy ház előtt megáll. Ez a munkahelye (Magát megállítja előtt -hoz egy nagy palota. Van a ő helye -ból munka)."], ["Sale in ascensore al terzo piano.", "Felmegy lifttel a harmadik emeletre (Felmegy -ban lift -ra-a harmadik emelet)."], ["La signora Neri è nervosa perché sono già le nove.", "Neriné ideges, mert már kilenc óra van."], ["Buongiorno, signora Neri. Perché arriva solo adesso?", "Jó reggelt kívánok, Neriné. Miért csak most jön (Miért érkezik csak most)?"], ["Il nostro bambino è malato^5, direttore. Domani arrivo puntuale.", "Beteg a gyerekünk, igazgató úr. Holnap pontosan jövök (Holnap érkezem pontos)."]], "notes": ["Az idő: <b>Che ore sono?<\/b> (Hány óra van?) – <b>Sono le otto<\/b> (többes szám!), de: <b>È l'una<\/b> (egy óra van), <b>è mezzogiorno<\/b> (dél van). A létige itt sem marad el.", "Elöljárószó + névelő: <b>su + il = sul<\/b>, <b>da + il = dal<\/b>, <b>a + la = alla<\/b>. <b>salire su<\/b> = felszállni -ra, <b>scendere da<\/b> = leszállni -ról. Az irányt az ige mutatja (<b>salire<\/b> = fel, <b>scendere<\/b> = le), nem igekötő.", "Visszaható igék: <b>si siede<\/b> (leül), <b>si ferma<\/b> (megáll): <b>mi siedo, ti siedi, si siede…<\/b> A magyar igekötős ige (<i>le<\/i>ül, <i>meg<\/i>áll) gyakran olasz visszaható ige.", "Birtokos: névelő + birtokos névmás + főnév: <b>il suo posto<\/b> (az ő helye), <b>il mio, il tuo, il nostro<\/b>. Részletesen a 14. leckében.", "A melléknév egyezik: <b>il bambino è malato<\/b> / <b>la bambina è malata<\/b>. Megszólítás: <b>direttore<\/b> = igazgató úr („úr” nélkül)."], "ex1": [["Sul tram non leggo il giornale.", "A villamoson nem olvasok újságot."], ["Il nostro professore è malato.", "A tanárunk beteg."], ["Anche tu sali al terzo piano?", "Te is felmész a harmadik emeletre?"], ["A Budapest sono le sette, anche a Roma.", "Budapesten hét óra van, Rómában is."], ["Il mio posto di lavoro è vicino al ristorante.", "A munkahelyem az étterem mellett van."], ["Se non è nervosa, studia l'italiano.", "Ha nem ideges, olaszul tanul."]], "ex2": [{"hu": "Megállunk a bank előtt.", "gap": "Ci . . . . . . . . . davanti alla banca", "ans": ["fermiamo"]}, {"hu": "Már öt óra van.", "gap": ". . . . . già le cinque", "ans": ["Sono"]}, {"hu": "Ma a tanárok idegesek.", "gap": "Oggi i professori sono . . . . . . . .", "ans": ["nervosi"]}, {"hu": "Felmegyek a negyedik emeletre.", "gap": ". . . . . . al quarto piano", "ans": ["Salgo"]}, {"hu": "A gyerekek leszállnak a buszról.", "gap": "I bambini . . . . . . . . . dall'autobus", "ans": ["scendono"]}, {"hu": "Leülök, mert van időm.", "gap": "Mi . . . . . . perché ho tempo", "ans": ["siedo"]}], "voc": [["le otto", "nyolc óra"], ["il lavoro", "a munka"], ["salire", "felszállni, felmenni"], ["scendere", "leszállni, lemenni"], ["il tram", "a villamos"], ["sedersi", "leülni"], ["il giornale", "az újság"], ["a piedi", "gyalog"], ["fermarsi", "megállni"], ["l'ascensore", "a lift"], ["il piano", "az emelet"], ["nervoso", "ideges"], ["malato", "beteg"], ["domani", "holnap"]]}, {"n": 10, "it": "Decima lezione", "hu": "Tizedik lecke", "title_it": "Dal dentista", "title_hu": "A fogorvosnál (-nál-a fogorvos)", "dlg": [["Il professore di ungherese^1 va dal^2 dentista.", "A magyartanár fogorvoshoz megy (A tanár -ból magyar megy -hoz-a fogorvos)."], ["Dal dentista aspettano in molti.", "A fogorvosnál sokan várnak (-nál-a fogorvos várnak -ban sokan)."], ["Si siede. Gli fa molto male il dente^3, ma bisogna^4 aspettare.", "Leül. Nagyon fáj a foga, de várni kell (Neki csinál nagyon rosszat a fog, de kell várni)."], ["Finalmente entra nello studio del medico.", "Végre bemegy az orvos szobájába (Végre bemegy -ba-a rendelő -ból-a orvos)."], ["Che cosa le fa male? Dove le fa male? A sinistra? A destra?", "Mi fáj? Hol fáj? Balra? Jobbra? (Mi önnek csinál rosszat? Hol önnek csinál rosszat?)"], ["Mi fa male sia a sinistra che a destra. Sto molto male.", "Bal oldalon is fáj, jobb oldalon is fáj. Nagyon beteg vagyok (Nekem csinál rosszat is -ra bal, mint -ra jobb. Állok nagyon rosszul)."], ["Non abbia paura^5. Le faccio un'iniezione. Va tutto bene?", "Nem kell félni. Adok egy injekciót. Minden rendben van? (Ne legyen félelme. Önnek csinálok egy injekciót. Megy minden jól?)"], ["Il dente non mi fa più male. Grazie. Quanto pago?", "Már nem fáj a fogam. Köszönöm. Mennyit fizetek? (A fog nem nekem csinál többé rosszat.)"], ["Sono cento euro. Arrivederci, a domani alle^6 cinque del pomeriggio.", "Száz eurót kérek. Viszontlátásra holnap délután ötkor (Vannak száz euró. Viszontlátásra, -ra holnap -ra-a öt -ból-a délután)."], ["Dal dentista il professore va in una pasticceria.", "A tanár a fogorvostól egy cukrászdába megy."], ["Ha molta fame^7 e vuole mangiare qualcosa.", "Nagyon éhes és enni akar valamit (Van neki sok éhség és akar enni valamit)."]], "notes": ["<b>Professore di ungherese<\/b>: a <b>di<\/b> köti össze a két főnevet: <b>libro di storia<\/b> (történelemkönyv), <b>insegnante di italiano<\/b> (olasztanár). A magyarban ez egyetlen összetett szó.", "Személyeknél a <b>da<\/b> mindhárom irányt jelöli: <b>vado dal dentista<\/b> (fogorvoshoz megyek), <b>sono dal dentista<\/b> (a fogorvosnál vagyok), <b>vengo dal dentista<\/b> (a fogorvostól jövök). Egy szó – három magyar rag!", "Fájdalom: <b>mi fa male la testa<\/b> = fáj a fejem („nekem rosszat csinál a fej”). Birtokos rag helyett részes névmás: <b>mi<\/b> (nekem), <b>ti<\/b> (neked), <b>gli<\/b> (neki, férfi), <b>le<\/b> (neki, nő; Önnek).", "<b>Bisogna<\/b> + főnévi igenév = kell: <b>bisogna aspettare<\/b> = várni kell. Személyhez kötve: <b>devo aspettare<\/b> (várnom kell).", "<b>Non abbia paura<\/b> = ne féljen (Lei-forma). <b>Avere paura<\/b> = félni („félelmet birtokolni”). Tegezve: <b>Non avere paura!<\/b>", "Időpont: <b>alle cinque<\/b> = ötkor (<b>a + le<\/b>); <b>all'una<\/b> = egykor. Mikor? = <b>A che ora?<\/b>", "<b>Avere fame<\/b> = éhesnek lenni („éhséget birtokolni”). Ugyanígy: <b>avere sete<\/b> (szomjas), <b>avere freddo<\/b> (fázik), <b>avere paura<\/b> (fél)."], "ex1": [["Non ti fa male il dente?", "Nem fáj a fogad?"], ["Non bisogna avere paura in ascensore.", "Nem kell félni a liftben."], ["I malati sono dal medico.", "A betegek az orvosnál vannak."], ["Il dentista fa un'iniezione.", "A fogorvos injekciót ad."], ["Arrivederci, a domani.", "Viszontlátásra holnap."], ["Dai Rossi andate da Pietro?", "Rossiéktól Péterhez mentek?"]], "ex2": [{"hu": "Nagyon betegek vagyunk.", "gap": "Siamo molto . . . . . . .", "ans": ["malati"]}, {"hu": "A fogorvos a cukrászdába megy.", "gap": "Il dentista va in . . . . . . . . . . . .", "ans": ["pasticceria"]}, {"hu": "Itt olaszul kell beszélni.", "gap": "Qui . . . . . . . . parlare italiano", "ans": ["bisogna"]}, {"hu": "Mennyit fizetek?", "gap": ". . . . . . pago?", "ans": ["Quanto"]}, {"hu": "A férjem nem éhes.", "gap": "Mio marito non ha . . . . .", "ans": ["fame"]}, {"hu": "Nem akarnak a szállodában enni.", "gap": "Non . . . . . . . . mangiare in albergo", "ans": ["vogliono"]}], "voc": [["il dentista", "a fogorvos"], ["aspettare", "várni"], ["il dente", "a fog"], ["mi fa male", "fáj (nekem)"], ["bisogna", "kell"], ["finalmente", "végre"], ["il medico", "az orvos"], ["avere paura", "félni"], ["pagare", "fizetni"], ["il pomeriggio", "a délután"], ["la pasticceria", "a cukrászda"], ["avere fame", "éhesnek lenni"], ["mangiare", "enni"], ["qualcosa", "valami"]]}, {"n": 11, "it": "Undicesima lezione", "hu": "Tizenegyedik lecke", "title_it": "Oggi abbiamo un esame", "title_hu": "Ma vizsgázunk (Ma van-nekünk egy vizsga)", "dlg": [["Non avete paura dell'^1esame di oggi?", "Nem féltek a mai vizsgától? (Nem van-nektek félelem -tól-a vizsga -ból ma?)"], ["Sì che^2 abbiamo paura, perché il professore è molto severo.", "De félünk, mert nagyon szigorú a tanár (Igen hogy van-nekünk félelem…)."], ["A che ora avete l'esame?", "Hány órakor van a vizsgátok? (-ra melyik óra van-nektek a vizsga?)"], ["Alle quattro del pomeriggio.", "Délután négy órakor."], ["Noi l'abbiamo alle cinque, ma non di fisica^3, bensì di matematica.", "Mi öt órakor vizsgázunk, de nem fizikából, hanem matematikából (Mi azt birtokoljuk -ra-a öt…)."], ["Buongiorno, signori. Chi vuole fare l'esame di fisica? Prego, entrate e sedetevi^4.", "Jó napot, uraim. Ki akar vizsgázni fizikából? Tessék bejönni és leülni (Tessék, gyertek be és üljetek le)."], ["Professore, sono molto nervoso e mi fa male la testa.", "Tanár úr, nagyon ideges vagyok és fáj a fejem (nekem csinál rosszat a fej)."], ["Non fa niente^5, figliolo. Tutti^6 hanno paura degli esami.", "Nem baj, fiam. A vizsgáktól mindenki fél (Nem csinál semmit, fiacskám. Mindenki van-nekik félelem -tól-a vizsgák)."], ["Ma io non so niente. Torno a casa. Arrivederci.", "De én nem tudok semmit. Hazamegyek. Viszontlátásra."], ["Chi altro vuole fare l'esame di fisica?", "Ki akar még vizsgázni fizikából? (Ki más akar csinálni a vizsga -ból fizika?)"]], "notes": ["<b>Avere paura di<\/b> = félni valamitől: <b>paura dell'esame<\/b> (<b>di + l'<\/b>), <b>paura degli esami<\/b> (<b>di + gli<\/b>).", "Tagadó kérdésre ellentmondó válasz: <b>Sì che…<\/b> / <b>Certo che…<\/b> – vö. a magyar „<i>De<\/i> félünk!”", "<b>Fare l'esame di fisica<\/b> = fizikából vizsgázni. A tantárgyat a <b>di<\/b> vezeti be.", "Felszólító mód, <b>voi<\/b> (ti) alak: <b>entrate!<\/b> (gyertek be), <b>sedetevi!<\/b> (üljetek le – a visszaható névmás az ige végére tapad). Tegezve: <b>entra!<\/b>, <b>siediti!<\/b> A magyar „Tessék + főnévi igenév” helyett: <b>Prego<\/b> + felszólító mód.", "Kettős tagadás, mint a magyarban: <b>non<\/b> + ige + <b>niente<\/b>: <b>non so niente<\/b> (nem tudok semmit), <b>non fa niente<\/b> (nem baj). Ugyanígy: <b>non… mai<\/b> (soha), <b>non… nessuno<\/b> (senki).", "<b>Tutti<\/b> = mindenki, de az ige <i>többes számban<\/i> áll: <b>tutti hanno paura<\/b>."], "ex1": [["I professori oggi non fanno esami.", "A tanárok ma nem vizsgáztatnak."], ["Chi vuole sedersi?", "Ki akar leülni?"], ["L'esame non è difficile.", "A vizsga nem nehéz."], ["Il poliziotto non ha paura di niente.", "A rendőr semmitől nem fél."], ["Prego, entrate in camera.", "Tessék bejönni a szobába."], ["Torniamo a casa di mattina?", "Reggel hazamegyünk?"]], "ex2": [{"hu": "Ki akar matematikából vizsgázni?", "gap": "Chi . . . . . fare l'esame di . . . . . . . . . . ?", "ans": ["vuole", "matematica"]}, {"hu": "Tanár úr, nem fáj a fejem.", "gap": "Professore, non mi fa male la . . . . .", "ans": ["testa"]}, {"hu": "Ti is féltek az orvostól?", "gap": "Anche voi avete . . . . . del medico?", "ans": ["paura"]}, {"hu": "Délután nem akarok sétálni.", "gap": "Il . . . . . . . . . . non voglio passeggiare", "ans": ["pomeriggio"]}, {"hu": "Hány órakor megy a feleséged a bankba?", "gap": "A che . . . va in banca tua moglie?", "ans": ["ora"]}, {"hu": "Nem tudok semmit.", "gap": "Non so . . . . . .", "ans": ["niente"]}], "voc": [["l'esame", "a vizsga"], ["oggi", "ma"], ["severo", "szigorú"], ["A che ora?", "Hány órakor?"], ["la fisica", "a fizika"], ["la matematica", "a matematika"], ["entrare", "bemenni, bejönni"], ["la testa", "a fej"], ["Non fa niente.", "Nem baj."], ["tutti", "mindenki"], ["sapere (so)", "tudni (tudok)"], ["niente", "semmi"]]}, {"n": 12, "it": "Dodicesima lezione", "hu": "Tizenkettedik lecke", "title_it": "Visita guidata a Roma", "title_hu": "Városnézés Rómában (Látogatás vezetett -ra Róma)", "dlg": [["Cari turisti, siamo sul Tevere^1.", "Kedves turisták, a Tiberisnél vagyunk (Kedves turisták, vagyunk -on-a Tiberis)."], ["Questo è Ponte Sisto. Sulle due rive del Tevere, a Trastevere e in centro, passano autobus arancioni e tram verdi.", "Ez a Sisto-híd. A Tiberis két partján, Trasteverében is, a belvárosban is narancssárga buszok és zöld villamosok járnak."], ["Adesso saliamo al Campidoglio. Lì ci sono i grandi musei.", "Most felmegyünk a Capitoliumra. Ott vannak a nagy múzeumok."], ["Questa è la chiesa di Santa Maria in Aracoeli. È molto antica. Le finestre sono particolarmente belle.", "Ez az Aracoeli Szűz Mária-templom. Nagyon régi. Az ablakok különösen szépek."], ["Adesso scendiamo di nuovo verso il fiume.", "Most megint lemegyünk a folyóhoz (Most lemegyünk újra felé a folyó)."], ["Questo palazzo^2 a destra è Montecitorio, la Camera dei Deputati. È barocco.", "Ez az épület jobbra a Montecitorio, a Képviselőház. Barokk."], ["In alto a sinistra, quelli sono l'albergo Hassler e la chiesa di Trinità dei Monti.", "Balra fent az a Hassler szálloda és a Trinità dei Monti-templom (Fent -ra bal, azok vannak…)."], ["Scusi^3, perché ci sono palazzi moderni in un quartiere antico?", "Elnézést kérek, miért vannak modern épületek egy régi városrészben?"], ["Perché anche qui la gente^4 vive e lavora. Nella capitale italiana non ci sono solo monumenti.", "Mert itt is emberek élnek és dolgoznak (Mert itt is a nép él és dolgozik). Az olasz fővárosban nemcsak műemlékek vannak."], ["Quanti abitanti ha Roma?", "Hányan laknak Rómában? (Hány lakost birtokol Róma?)"], ["Roma ha quasi tre milioni di^5 abitanti. L'Italia ne ha^6 sessanta milioni.", "Rómának majdnem hárommillió lakosa van. Olaszországnak hatvanmillió (Olaszország abból birtokol hatvan milliót)."], ["Signore e signori, la visita è finita.", "Hölgyeim és uraim, a városnézésnek vége (a látogatás van befejezve)."]], "notes": ["<b>sul Tevere<\/b> = <b>su + il<\/b>. A folyónevek hímneműek és névelővel állnak: <b>il Tevere<\/b> (Tiberis), <b>il Danubio<\/b> (Duna), <b>il Po<\/b>.", "<b>questo<\/b> (közeli) / <b>quello<\/b> (távoli), mint <b>ez / az<\/b>: <b>questo palazzo<\/b> (ez az épület), <b>quel palazzo<\/b> (az az épület), <b>quelli<\/b> (azok). Névelő nem kell!", "<b>Scusi<\/b> = elnézést (Lei-forma); tegezve <b>scusa<\/b>.", "<b>La gente<\/b> = az emberek, de nyelvtanilag <i>egyes számú nőnem<\/i>: <b>la gente vive<\/b> (élnek az emberek).", "<b>milione<\/b> után <b>di<\/b>: <b>tre milioni di abitanti<\/b>. A <b>cento<\/b> és <b>mille<\/b> után nincs <b>di<\/b>: <b>cento euro<\/b>, <b>mille persone<\/b>.", "Birtoklás: <b>Roma ha…<\/b> („Róma birtokol”) – a magyar <i>-nak van<\/i> helyett <b>avere<\/b>. A <b>ne<\/b> = abból, belőle: <b>ne ha sessanta milioni<\/b> = (lakosból) hatvanmillió van neki."], "ex1": [["Quello a destra non è il Senato.", "Az ott jobbra nem a Szenátus."], ["Nella capitale ungherese ci sono i tram.", "A magyar fővárosban vannak villamosok."], ["Quante persone lavorano al ristorante?", "Hányan dolgoznak az étteremben?"], ["Anche voi scendete al fiume?", "Ti is lementek a folyóhoz?"], ["Scusi, dov'è l'albergo?", "Elnézést kérek, hol van a szálloda?"], ["Questo libro è particolarmente interessante.", "Ez a könyv különösen érdekes."]], "ex2": [{"hu": "Ez az épület jobbra a bank.", "gap": ". . . . . . palazzo a destra è la banca", "ans": ["Questo"]}, {"hu": "A fővárosnak tízmillió lakosa van.", "gap": "La capitale ha dieci . . . . . . . di abitanti", "ans": ["milioni"]}, {"hu": "A templom messze van?", "gap": "La chiesa è . . . . . . . ?", "ans": ["lontana"]}, {"hu": "A műemlékek fent vannak.", "gap": "I . . . . . . . . . sono in alto", "ans": ["monumenti"]}, {"hu": "Elnézést, hova megy ez a busz?", "gap": ". . . . . , dove va questo autobus?", "ans": ["Scusi"]}, {"hu": "A rendőr felmegy a harmadik emeletre.", "gap": "Il poliziotto . . . . al terzo piano", "ans": ["sale"]}], "voc": [["il turista", "a turista"], ["il fiume", "a folyó"], ["il ponte", "a híd"], ["la riva", "a part"], ["il museo", "a múzeum"], ["la chiesa", "a templom"], ["antico", "régi"], ["il palazzo", "az épület, a palota"], ["in alto", "fent"], ["Scusi!", "Elnézést!"], ["la gente", "az emberek"], ["la capitale", "a főváros"], ["l'abitante", "a lakos"], ["il monumento", "a műemlék"]]}, {"n": 13, "it": "Tredicesima lezione", "hu": "Tizenharmadik lecke", "title_it": "Fatti suoi", "title_hu": "Magánügy (Tények az övéi)", "dlg": [["Che cosa fa Giuseppe Fiore dalla mattina alla sera^1?", "Mit csinál Fiore József reggeltől estig?"], ["La mattina si alza alle sette. Si lava, si veste^2, fa colazione e legge il giornale.", "Reggel hétkor felkel. Mosakszik, felöltözik, reggelizik és újságot olvas (Magát felemeli… magát mossa, magát öltözteti, csinál reggelit…)."], ["Poi scende in strada. Sale sull'autobus e scende davanti alla fabbrica.", "Aztán lemegy az utcára. Felszáll a buszra és leszáll a gyár előtt."], ["Dalle otto alle cinque lavora in fabbrica accanto a una macchina.", "Nyolctól ötig dolgozik a gyárban egy gép mellett."], ["A mezzogiorno, alle dodici in punto, pranza, poi beve un caffè al bar^3.", "Délben, pontosan tizenkét órakor ebédel, majd iszik egy kávét a büfében."], ["Il pomeriggio è già molto stanco e nervoso.", "Délután már nagyon fáradt és ideges."], ["Alle otto di sera torna a casa, cena, guarda la tv, si spoglia e va a letto.", "Este nyolckor hazamegy, vacsorázik, tévét néz, levetkőzik, lefekszik (…megy -ba ágy)."], ["Di notte dorme^4 a casa.", "Éjjel otthon alszik."], ["Ma che cosa fa Giuseppe Fiore dalle cinque del pomeriggio alle otto di sera?", "De mit csinál Fiore József délután öttől este nyolcig?"], ["Sono fatti suoi^5.", "Ez magánügy (Vannak tények az övéi)."]], "notes": ["<b>da… a…<\/b> = -tól/-től …-ig: <b>dalla mattina alla sera<\/b> (reggeltől estig), <b>dalle otto alle cinque<\/b> (nyolctól ötig: <b>da + le<\/b>, <b>a + le<\/b>).", "Visszaható igék (vö. 9. lecke): <b>alzarsi<\/b> (felkelni) – <b>mi alzo, ti alzi, si alza…<\/b>; <b>lavarsi<\/b> (mosakodni), <b>vestirsi<\/b> (felöltözni), <b>spogliarsi<\/b> (levetkőzni). A magyar <i>-kodik / -kőzik<\/i> ige gyakran olasz visszaható ige.", "<b>Il bar<\/b> = kávézó-büfé, ahol az olaszok gyakran állva isszák a kávét. <b>Un caffè<\/b> = egy eszpresszó! <b>Bere<\/b> (inni) rendhagyó: <b>bevo, bevi, beve…<\/b>", "<b>-ire<\/b> igék: <b>dormire<\/b> – <b>dormo, dormi, dorme, dormiamo, dormite, dormono<\/b>.", "<b>Sono fatti suoi<\/b> = ez az ő dolga („az ő ügyei”); <b>fatti miei<\/b> = az én dolgom. Gyakori, kicsit nyers kifejezés."], "ex1": [["Quest'uomo non si lava.", "Ez az ember nem mosakszik."], ["Il caffè è particolarmente buono.", "A kávé különösen jó."], ["Dal medico il professore si spoglia.", "A tanár levetkőzik az orvosnál."], ["In fabbrica non c'è il bar.", "Nincs büfé a gyárban."], ["Dalle tre alle sei sono in chiesa.", "Háromtól hatig a templomban vagyok."], ["Bambini, chi vuole guardare la tv?", "Gyerekek, ki akar tévét nézni?"]], "ex2": [{"hu": "A család nem alszik.", "gap": "La famiglia non . . . . .", "ans": ["dorme"]}, {"hu": "Itt sokan beszélnek olaszul.", "gap": "Qui in . . . . . parlano italiano", "ans": ["molti"]}, {"hu": "A férjek nagyon fáradtak.", "gap": "I mariti sono molto . . . . . . .", "ans": ["stanchi"]}, {"hu": "Petike nem akar kilenctől tízig dolgozni.", "gap": "Pierino non vuole lavorare . . . . . nove . . . . dieci", "ans": ["dalle", "alle"]}, {"hu": "Ez az ő dolga.", "gap": "Sono fatti . . . . .", "ans": ["suoi"]}, {"hu": "A feleségem nem ebédel és nem vacsorázik.", "gap": "Mia moglie non . . . . . . e non . . . . .", "ans": ["pranza", "cena"]}], "voc": [["alzarsi", "felkelni"], ["lavarsi", "mosakodni"], ["vestirsi", "felöltözni"], ["fare colazione", "reggelizni"], ["la fabbrica", "a gyár"], ["la macchina", "a gép"], ["mezzogiorno", "dél"], ["pranzare", "ebédelni"], ["il caffè", "a kávé"], ["stanco", "fáradt"], ["cenare", "vacsorázni"], ["andare a letto", "lefeküdni"], ["dormire", "aludni"], ["la notte", "az éjszaka"]]}, {"n": 14, "it": "Quattordicesima lezione", "hu": "Tizennegyedik lecke", "title_it": "Ripasso", "title_hu": "Ismétlés", "ripasso": true, "sections": [["1 Az ige", ["<b>1.1 Visszaható igék.<\/b> <b>alzarsi, sedersi, fermarsi, lavarsi, vestirsi, spogliarsi<\/b>: a visszaható névmás (<b>mi, ti, si, ci, vi, si<\/b>) az ige <i>előtt<\/i> áll: <b>mi alzo<\/b> (felkelek). Felszólító módban az ige végére tapad: <b>sedetevi!<\/b>", "<b>1.2 Igekötők helyett.<\/b> Ahol a magyar igekötőt használ (<i>fel<\/i>megy, <i>le<\/i>megy, <i>be<\/i>megy, <i>ki<\/i>megy), az olasz többnyire külön igét: <b>salire, scendere, entrare, uscire<\/b>; vagy visszaható igét: <b>sedersi<\/b> (leül), <b>fermarsi<\/b> (megáll).", "<b>1.3 Három igecsoport.<\/b> <b>-are<\/b> (parlare), <b>-ere<\/b> (leggere), <b>-ire<\/b> (dormire). Néhány új rendhagyó ige a táblázatban."]], ["TABLE", [["", "alzarsi", "dormire", "uscire", "volere"], ["io", "mi alzo", "dormo", "esco", "voglio"], ["tu", "ti alzi", "dormi", "esci", "vuoi"], ["lui/lei", "si alza", "dorme", "esce", "vuole"], ["noi", "ci alziamo", "dormiamo", "usciamo", "vogliamo"], ["voi", "vi alzate", "dormite", "uscite", "volete"], ["loro", "si alzano", "dormono", "escono", "vogliono"]], "Igeragozás"], ["2 Hol? Hová? Honnan?", ["A magyarban kilenc helyhatározó rag van; az olasz nem választja szét a helyet és az irányt (<b>dove?<\/b> = hol? és hová?). Csak a „honnan?” kap külön elöljárót: <b>da<\/b>."]], ["TABLE", [["", "Hová? / Hol?", "Honnan?"], ["ország, helyiség", "in Italia, in banca", "dall'Italia, dalla banca"], ["város", "a Roma", "da Roma"], ["felület", "sul tram", "dal tram"], ["személy", "dal medico", "dal medico"]], "Helyhatározók"], ["3 Birtokos névmások", ["Névelő + birtokos névmás + főnév; a névmás a <i>birtokhoz<\/i> igazodik, nem a birtokoshoz: <b>la sua casa<\/b> = az ő háza (férfié vagy nőé egyaránt). Családtagnál egyes számban nincs névelő: <b>mia moglie, suo marito<\/b>; de: <b>il loro figlio<\/b>."]], ["TABLE", [["", "libro (hímn.)", "casa (nőn.)"], ["az enyém", "il mio libro", "la mia casa"], ["a tiéd", "il tuo libro", "la tua casa"], ["az övé", "il suo libro", "la sua casa"], ["a miénk", "il nostro libro", "la nostra casa"], ["a tiétek", "il vostro libro", "la vostra casa"], ["az övék", "il loro libro", "la loro casa"]], "Birtokos névmás"], ["4 Számnév után", ["A magyarral ellentétben számnév után <i>többes szám<\/i>: <b>due assegni<\/b> (két csekk), <b>tre milioni di abitanti<\/b>. Az <b>euro<\/b> változatlan: <b>cento euro<\/b>."]]], "dlg": [["In banca chiediamo dei contanti.", "A bankban készpénzt kérünk."], ["I turisti non fanno esami.", "A turisták nem vizsgáznak."], ["Già in pasticceria mi fa male il dente.", "Már a cukrászdában fáj a fogam."], ["Passeggio a piedi sul ponte.", "Gyalog sétálok a hídon."], ["Alle quattro del pomeriggio il professore di ungherese ha già molta fame.", "Délután négy órakor már nagyon éhes a magyartanár."], ["Che fai stasera? – Fatti miei.", "Mit csinálsz ma este? – Ez magánügy."], ["Sono stanco perché lavoro molto.", "Fáradt vagyok, mert sokat dolgozom."], ["Oggi il medico è nervoso.", "Az orvos ma ideges."], ["Mi fermo davanti al palazzo.", "Megállok az épület előtt."], ["La mattina andiamo al fiume.", "Délelőtt a folyóhoz megyünk."]], "voc": [["mi alzo", "felkelek"], ["esco", "kimegyek"], ["dormo", "alszom"], ["voglio", "akarok"], ["il mio / la mia", "az enyém"], ["da (+ személy)", "-nál, -hoz, -tól"]]}]</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const store={get(k,d){try{const v=localStorage.getItem('olaszora:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('olaszora:'+k,JSON.stringify(v))}catch(e){}}};
let st={tab:store.get('tab','lecke'),n:store.get('n',4),done:store.get('done',[]),boxes:store.get('boxes',{}),showHu:false};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sup=s=>s.replace(/\^(\d+)/g,'<sup>$1</sup>');
const calc=s=>s.replace(/\(([^)]*)\)/g,'<i>($1)</i>');
const clean=s=>s.replace(/\^\d+/g,'');
const lesson=()=>DATA.find(d=>d.n===st.n);
const canSpeak=false;
function speak(t){ if(!canSpeak) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(clean(t)); u.lang='it-IT'; u.rate=.85; const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('it')); if(v) u.voice=v; speechSynthesis.speak(u);}catch(e){} }
function save(){store.set('tab',st.tab);store.set('n',st.n);store.set('done',st.done);store.set('boxes',st.boxes)}
function allCards(){ const c=[]; DATA.forEach(d=>d.voc.forEach(([it,hu])=>c.push({id:d.n+':'+it,it,hu,n:d.n}))); return c }
function stats(){
  const cards=allCards(); const known=cards.filter(c=>(st.boxes[c.id]||0)>=3).length;
  document.getElementById('stats').innerHTML=`<span class="pill">Leckék: <b>${st.done.length}</b> / ${DATA.length}</span><span class="pill">Szavak (tudom): <b>${known}</b> / ${cards.length}</span>`;
}
function chips(){
  const el=document.getElementById('chips');
  if(st.tab==='kartya'){el.innerHTML='';return}
  el.innerHTML=DATA.map(d=>`<button class="chip ${st.done.includes(d.n)?'done':''}" aria-pressed="${d.n===st.n}" data-n="${d.n}"><span class="dot"></span>${d.n}. ${d.ripasso?'Ismétlés':esc(d.title_it)}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st.n=+b.dataset.n;st.showHu=false;render()});
}
function viewLesson(){
  const d=lesson(); let h=`<div class="lesson-head"><div><div class="kicker">${d.it} · ${d.hu}</div><h2>${esc(d.title_it)}</h2></div></div><p class="hu-title">${calc(d.title_hu)}</p>`;
  if(d.ripasso){
    h+='<div class="card rip">'+d.sections.map(([t,it,tt])=>{
      if(t==='TABLE') return `<h4>${tt||'Rendhagyó igék'}</h4><div class="tablewrap"><table class="conj">${it.map((r,i)=>'<tr>'+r.map((c,j)=>i===0||j===0?`<th>${c}</th>`:`<td>${c}</td>`).join('')+'</tr>').join('')}</table></div>`;
      return `<h4>${t}</h4>`+it.map(p=>`<p>${p}</p>`).join('')}).join('')+'</div>';
    h+=`<h3 class="kicker" style="margin:18px 0 8px">Ismétlő gyakorlat</h3>`;
  }
  h+=`<div class="toolbar"><button class="btn" id="tgl">${st.showHu?'Fordítás elrejtése':'Fordítás mutatása'}</button>${canSpeak?'<button class="btn ghost" id="all">▶ Teljes párbeszéd</button>':''}<button class="btn ${st.done.includes(d.n)?'':'primary'}" id="dn">${st.done.includes(d.n)?'✓ Kész – visszavonás':'Megjelölöm késznek'}</button></div>`;
  h+='<ol class="dlg">'+d.dlg.map(([it,hu],i)=>`<li><span class="num">${i+1}</span><span class="it">${sup(esc(it))}</span>${canSpeak?`<button class="say" data-i="${i}" aria-label="Meghallgatás">▶</button>`:''}<span class="hu ${st.showHu?'':'hidden'}" title="Koppints a fordításért">${calc(esc(hu))}</span></li>`).join('')+'</ol>';
  if(!st.showHu) h+='<p class="muted">Tipp: próbálja meg előbb megérteni az olasz mondatot, aztán koppintson a szürke sávra a fordításért.</p>';
  if(d.notes) h+='<section class="notes"><h3>Jegyzetek</h3><ol>'+d.notes.map(n=>`<li>${n}</li>`).join('')+'</ol></section>';
  const v=document.getElementById('view'); v.innerHTML=h;
  v.querySelector('#tgl').onclick=()=>{st.showHu=!st.showHu;render()};
  v.querySelector('#dn').onclick=()=>{st.done=st.done.includes(d.n)?st.done.filter(x=>x!==d.n):[...st.done,d.n];render()};
  v.querySelectorAll('.hu.hidden').forEach(e=>e.onclick=()=>e.classList.remove('hidden'));
  v.querySelectorAll('.say').forEach(b=>b.onclick=()=>speak(d.dlg[+b.dataset.i][0]));
  const a=v.querySelector('#all'); if(a) a.onclick=()=>speak(d.dlg.map(x=>x[0]).join(' … '));
}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’`]/g,"'").replace(/\s+/g,' ').trim();
const accentOk=(a,b)=>a.toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g,' ').trim()===b.toLowerCase();
function viewEx(){
  const d=lesson(); const v=document.getElementById('view');
  if(d.ripasso){ v.innerHTML=`<div class="card"><h3>Ismétlés</h3><p>Ennél a leckénél a gyakorlat maga a párbeszéd: nyissa meg a <b>Leckék</b> fület, takarja le a fordítást, és fordítsa le fejben mind a tíz mondatot.</p></div>`; return }
  let h=`<div class="lesson-head"><div><div class="kicker">${d.it} · Gyakorlatok</div><h2>${esc(d.title_it)}</h2></div></div>`;
  h+=`<section class="card ex1"><h3>1. gyakorlat – Fordítsa le</h3><ol>`+d.ex1.map(([it,hu],i)=>`<li><span>${esc(it)}</span> <button class="btn ghost" style="padding:2px 10px;font-size:.8rem" data-r="${i}">Megoldás</button><span class="ans" id="a${i}" hidden>${esc(hu)}</span></li>`).join('')+'</ol></section>';
  h+=`<section class="card ex2"><h3>2. gyakorlat – Egészítse ki</h3><p class="muted">Írja be a hiányzó olasz szavakat. Minden pont egy betű.</p>`;
  d.ex2.forEach((r,ri)=>{ let k=0; const line=esc(r.gap).replace(/(?:^|(?<=[\s']))\.(?: \.)*/g,m=>{const len=(m.match(/\./g)||[]).length;const id=`g${ri}_${k++}`;return `<input id="${id}" size="${Math.max(3,len+1)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="hiányzó szó">`});
    h+=`<div class="row"><div class="q">${ri+1}. ${esc(r.hu)}</div><div class="line">${line}<span class="fb" id="fb${ri}"></span></div></div>`});
  h+=`<div class="toolbar"><button class="btn primary" id="chk">Ellenőrzés</button><button class="btn" id="shw">Megoldások</button></div></section>`;
  v.innerHTML=h;
  v.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{document.getElementById('a'+b.dataset.r).hidden=false;b.remove()});
  v.querySelector('#chk').onclick=()=>{ let ok=0,tot=0; d.ex2.forEach((r,ri)=>{ let good=true; r.ans.forEach((a,k)=>{const el=document.getElementById(`g${ri}_${k}`);tot++;const val=el.value; const exact=accentOk(val,a); const loose=norm(val)===norm(a); el.className=exact?'ok':(loose?'ok':'no'); if(exact||loose) ok++; else good=false; if(loose&&!exact) document.getElementById('fb'+ri).textContent='ékezet: '+a;}); if(good&&!document.getElementById('fb'+ri).textContent) document.getElementById('fb'+ri).textContent='✓'; }); v.querySelector('#chk').textContent=`Ellenőrzés (${ok}/${tot})`; };
  v.querySelector('#shw').onclick=()=>d.ex2.forEach((r,ri)=>r.ans.forEach((a,k)=>{const el=document.getElementById(`g${ri}_${k}`);el.value=a;el.className=''}));
}
let deck=[],cur=0,flipped=false,dir=store.get('dir','it');
function buildDeck(){ const learned=DATA.filter(d=>d.n<=Math.max(st.n,...st.done,1)).map(d=>d.n); deck=allCards().filter(c=>learned.includes(c.n)).sort((a,b)=>(st.boxes[a.id]||0)-(st.boxes[b.id]||0)||Math.random()-.5); cur=0; flipped=false }
function viewCards(){
  if(!deck.length) buildDeck();
  const v=document.getElementById('view'); const c=deck[cur];
  const cnt=[0,1,2,3].map(b=>deck.filter(x=>Math.min(3,st.boxes[x.id]||0)===b).length);
  const q=dir==='it'?c.it:c.hu, a=dir==='it'?c.hu:c.it;
  v.innerHTML=`<div class="opts"><span>Irány:</span><button class="chip" aria-pressed="${dir==='it'}" id="d-it">olasz → magyar</button><button class="chip" aria-pressed="${dir==='hu'}" id="d-hu">magyar → olasz</button><span class="muted">A kártyák az eddig megnyitott leckékből jönnek.</span></div>
  <div class="flash"><div class="fcard" id="fc" tabindex="0" role="button" aria-label="Kártya megfordítása"><span class="tag">${c.n}. lecke · ${cur+1}/${deck.length}</span><div><div class="w">${esc(q)}</div>${flipped?`<div class="a">${esc(a)}</div>`:'<div class="muted" style="margin-top:10px">koppintson a megfordításhoz</div>'}</div></div>
  <div class="fbtns">${flipped?'<button class="btn" id="no">Még nem tudom</button><button class="btn primary" id="yes">Tudom</button>':''}${canSpeak?'<button class="btn ghost" id="sp">▶ Kiejtés</button>':''}</div>
  <div class="boxes"><span>új: ${cnt[0]}</span><span>1×: ${cnt[1]}</span><span>2×: ${cnt[2]}</span><span>tudom: ${cnt[3]}</span></div></div>`;
  const fc=v.querySelector('#fc'); fc.onclick=()=>{flipped=!flipped;viewCards()}; fc.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();fc.click()}};
  const next=()=>{cur=(cur+1)%deck.length;flipped=false;save();stats();viewCards()};
  const y=v.querySelector('#yes'); if(y) y.onclick=()=>{st.boxes[c.id]=Math.min(3,(st.boxes[c.id]||0)+1);next()};
  const n=v.querySelector('#no'); if(n) n.onclick=()=>{st.boxes[c.id]=0;next()};
  const sp=v.querySelector('#sp'); if(sp) sp.onclick=()=>speak(c.it);
  v.querySelector('#d-it').onclick=()=>{dir='it';store.set('dir',dir);flipped=false;viewCards()};
  v.querySelector('#d-hu').onclick=()=>{dir='hu';store.set('dir',dir);flipped=false;viewCards()};
}
function render(){
  save(); stats(); chips();
  ['lecke','gyak','kartya'].forEach(t=>document.getElementById('t-'+t).setAttribute('aria-selected',st.tab===t));
  if(st.tab==='lecke') viewLesson(); else if(st.tab==='gyak') viewEx(); else { deck=[]; viewCards(); }
}
['lecke','gyak','kartya'].forEach(t=>document.getElementById('t-'+t).onclick=()=>{st.tab=t;render()});
if(!DATA.some(d=>d.n===st.n)) st.n=DATA[0].n;
render();

</script>
